<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Transactions Audit - Cedars</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#020a14;color:#fff;font-family:system-ui,monospace;width:100vw;display:flex}.sidebar{width:260px;background:#081020;border-right:2px solid #2a3f6d;padding:20px}.main{flex:1;padding:20px}.card{background:linear-gradient(145deg,#1c2e55,#2a3f6d);border:1px solid #4a6aaa;border-radius:16px;padding:18px}table{width:100%;border-collapse:collapse;font-size:13px}th{color:#888;border-bottom:1px solid #2a3f6d;padding:8px;text-align:left}td{padding:8px;border-bottom:1px solid #1a2a4a}@media(max-width:900px){.sidebar{display:none}}</style><script>if(!localStorage.getItem('cedars_session')){location.href='login.html';}</script></head><body><div class="sidebar"><a href="index.html"><img src="assets/cedars-header-400-silver.png" style="width:200px;"></a><div style="margin-top:12px;line-height:2.8;"><a href="dashboard/index.html" style="color:#7da8d0;text-decoration:none;">Dashboard</a><br><a href="transactions.html" style="color:#7de8ff;font-weight:bold;">Transactions</a></div></div><div class="main"><div style="font-size:28px;font-weight:bold;">Transactions - Deposits/Withdrawals/ROI - Audit Trail</div><div class="card" style="margin-top:12px;"><table><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Status</th><th>Hash</th></tr></thead><tbody id="tb"></tbody></table></div></div><script>let tx=[];let invs=JSON.parse(localStorage.getItem('cedars_investments')||'[]');let wds=JSON.parse(localStorage.getItem('cedars_withdrawals')||'[]');invs.forEach(i=>{tx.push({d:i.created_at||new Date().toISOString(),t:'Deposit',a:i.amount,s:i.status||'Active',h:i.tx_hash||'Solana'});for(let k=1;k<=5;k++){tx.push({d:new Date(Date.now()-k*86400000).toISOString(),t:'ROI',a:(i.amount*0.015).toFixed(2),s:'Wallet',h:'1.5% Daily'});}});wds.forEach(w=>{tx.push({d:w.time||new Date().toISOString(),t:'Withdrawal',a:w.amount,s:w.status,h:w.wallet||'MoMo/Bank'});});tx.sort((a,b)=>new Date(b.d)-new Date(a.d));let h='';tx.forEach(x=>{h+=`<tr><td>${new Date(x.d).toLocaleDateString()}</td><td>${x.t}</td><td>$${x.a}</td><td>${x.s}</td><td style="color:#7de8ff;">${String(x.h).slice(0,12)}...</td></tr>`});document.getElementById('tb').innerHTML=h||'<tr><td colspan="5" style="color:#5a7aaa;text-align:center;">No transactions yet - Deposit $5-$100k - $5-$100k</td></tr>';</script></body></html>
