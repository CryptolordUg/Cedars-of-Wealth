<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Gate</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020a02;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.box{background:#122912;padding:25px;border-radius:15px;width:100%;max-width:400px;border:1px solid #2a5a2a}
input{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:1px solid #2a5a2a;background:#0a1a0a;color:white;font-size:16px}
button{width:100%;padding:14px;background:#2a8a2a;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center">🌲 Admin Gate</h2>
<input type="password" id="p1" placeholder="Login Password">
<input type="password" id="p2" placeholder="Security Key">
<button onclick="login()">UNLOCK</button>
<p id="err" style="color:#ff6666;text-align:center;margin-top:10px"></p>
</div>
<script>
const PASS = "Cedars2025!";
const KEY = "CEDARS-KEY-77X";
function login(){
  if(document.getElementById('p1').value !== PASS){document.getElementById('err').innerText="Wrong Password";return;}
  if(document.getElementById('p2').value !== KEY){document.getElementById('err').innerText="Wrong Security Key";return;}
  localStorage.setItem('cedar_role','admin');
  alert('✅ Success - Admin Unlocked');
  window.location.href='../dashboard/rubonai-trader.html';
}
</script>
</body>
</html>
