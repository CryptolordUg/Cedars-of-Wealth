<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Cedars of Wealth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,Arial;background:radial-gradient(circle at top,#0a2a0a,#020a02);color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
.box{background:#0f2310;border:2px solid #00ff8844;border-radius:20px;padding:30px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,255,136,0.2);text-align:center}
h1{font-size:28px;font-weight:900;color:#00ff88} p{color:#88aa88;font-size:13px;margin:10px 0 20px}
input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #1a4a1a;background:#020a02;color:#fff;font-size:15px}
button{width:100%;padding:14px;background:linear-gradient(90deg,#00ff88,#00cc66);color:#000;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:12px;cursor:pointer}
.success{color:#00ff88;background:#00ff8811;padding:12px;border-radius:8px;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="box">
<h1>🌲 CEDARS</h1>
<p style="letter-spacing:4px">CHANGE PASSWORD</p>
<div id="msg" style="color:#ffcc00;font-size:13px;margin-bottom:10px">You are using temporary password. Create new strong password.</div>

<input id="email" placeholder="Your email">
<input id="temp" type="password" placeholder="Temporary password from Admin">
<input id="new1" type="password" placeholder="New Password (min 8 chars)">
<input id="new2" type="password" placeholder="Confirm New Password">

<button onclick="changePass()">SET NEW PASSWORD</button>
<div id="ok" class="success"></div>
<p style="margin-top:20px;font-size:11px;color:#556655">Need help? WhatsApp Admin: +256...</p>
<a href="/Cedars-of-Wealth/login.html" style="color:#00ff88;font-size:12px;display:block;margin-top:15px;text-decoration:none">← Back to Login</a>
</div>

<script>
function changePass(){
 let email=document.getElementById('email').value.trim().toLowerCase();
 let temp=document.getElementById('temp').value;
 let n1=document.getElementById('new1').value;
 let n2=document.getElementById('new2').value;
 let ok=document.getElementById('ok');

 if(!email||!temp||!n1||!n2){alert('Fill all fields');return;}
 if(n1.length<8){alert('New password must be 8+ chars');return;}
 if(n1!==n2){alert('Passwords not match');return;}

 let investors=JSON.parse(localStorage.getItem('cedar_investors')||'{}');
 if(!investors[email]){alert('Email not found. Contact Admin.');return;}
 if(investors[email].password!==temp){alert('Wrong temporary password. Ask Admin for new one.');return;}

 // Update
 investors[email].password=n1;
 investors[email].mustChangePassword=false;
 investors[email].changedAt=new Date().toISOString();
 localStorage.setItem('cedar_investors', JSON.stringify(investors));

 ok.style.display='block';
 ok.innerHTML=`✅ Password Changed Successfully!<br>Login with new password now.`;
 setTimeout(()=>{ location.href='/Cedars-of-Wealth/login.html'; },2000);
}
</script>
</body>
</html>
