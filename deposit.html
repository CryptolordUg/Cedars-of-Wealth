<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Deposit SOL Live - Cedars of Wealth</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#020a14;color:#fff;font-family:system-ui,monospace;width:100vw;overflow-x:hidden}.container{max-width:650px;margin:30px auto;padding:20px}.card{background:linear-gradient(145deg,#1c2e55,#2a3f6d);border:1px solid #4a6aaa;border-radius:20px;padding:24px}.header{height:80px;display:flex;align-items:center;justify-content:space-between;background:rgba(2,10,20,0.98);border-bottom:3px solid #c0c0c0;position:sticky;top:0;z-index:999;width:100vw;padding:0 24px}.btn-blue{background:linear-gradient(90deg,#9945ff,#7de8ff);color:#fff;font-weight:bold;border:none;border-radius:12px;padding:16px 26px;font-size:16px;cursor:pointer;width:100%;margin:8px 0}.input{background:#0b1326;border:1.5px solid #3a5a9a;border-radius:12px;padding:14px;width:100%;color:#fff;margin:8px 0;font-family:monospace}.status{border-radius:10px;padding:12px;margin:10px 0;font-size:13px;text-align:center}</style></head><body>
<header class="header"><div style="color:#fff;font-weight:900;font-size:22px;letter-spacing:3px;">CEDARS OF WEALTH</div><nav style="display:flex;gap:18px;"><a href="dashboard.html" style="color:#7da8d0;text-decoration:none;font-weight:bold;">Dashboard</a></nav></header>
<div class="container"><div class="card">
<div style="font-size:28px;font-weight:bold;text-align:center;color:#9945ff;">Deposit — SOLANA LIVE</div>
<div style="background:#000;border:2px solid #9945ff;border-radius:12px;padding:14px;margin:14px 0;word-break:break-all;text-align:center;">
<div style="color:#9945ff;font-weight:bold;font-size:12px;">TREASURY — STRICTLY SOL — TAP TO COPY</div>
<div id="treasury" style="color:#7de8ff;font-size:13px;margin-top:8px;font-weight:bold;cursor:pointer;" onclick="copyTreasury()">6XQviXJ5EceCmZq6uGrnrsxBKSnLKSvXeT7MCFF6fTb</div>
<div style="color:#00ff88;font-size:10px;margin-top:6px;">✅ SOLANA ONLY — SPL USDC — NO BSC/ERC20/TRC20</div>
</div>
<input class="input" id="amount" type="number" min="5" max="100000" value="5" placeholder="Amount $5-$100000">
<input class="input" id="txsig" placeholder="Paste SOL Transaction Signature (Tx Sig) from Phantom/Solflare">
<button class="btn-blue" onclick="verifySOL()">🔍 Verify SOL Deposit Live on Solscan</button>
<div id="status"></div>
<button class="btn-blue" style="background:#0b1326;border:1px solid #4a6aaa;" onclick="window.open('https://solscan.io/account/6XQviXJ5EceCmZq6uGrnrsxBKSnLKSvXeT7MCFF6fTb','_blank')">View Treasury on Solscan</button>
<div style="background:#001a0a;border:1px solid #00ff88;border-radius:10px;padding:10px;margin-top:12px;color:#00ff88;font-size:11px;text-align:center;">How: 1.Send SOL/USDC-SPL to address above 2.Copy Tx Signature 3.Paste above 4.Click Verify — Auto confirms to Dashboard</div>
</div></div>
<script>
const TREASURY = "6XQviXJ5EceCmZq6uGrnrsxBKSnLKSvXeT7MCFF6fTb";
function copyTreasury(){navigator.clipboard.writeText(TREASURY);document.getElementById('status').innerHTML='<div class="status" style="background:#001a0a;border:1px solid #00ff88;color:#00ff88;">✅ Copied: '+TREASURY+'</div>';}
async function verifySOL(){
 const amount = document.getElementById('amount').value;
 const sig = document.getElementById('txsig').value.trim();
 const statusEl = document.getElementById('status');
 if(!sig){statusEl.innerHTML='<div class="status" style="background:#1a0a00;border:1px solid #ff4444;color:#ff8888;">❌ Paste Transaction Signature</div>';return;}
 if(amount < 5){statusEl.innerHTML='<div class="status" style="background:#1a0a00;border:1px solid #ff4444;color:#ff8888;">❌ Min $5 SOL</div>';return;}
 statusEl.innerHTML='<div class="status" style="background:#0a0a1a;border:1px solid #7de8ff;color:#7de8ff;">⏳ Verifying on Solana — Checking '+sig.substring(0,20)+'... to '+TREASURY+'</div>';
 try {
  // Live Solscan public API check - strictly SOL
  const res = await fetch('https://public-api.solscan.io/transaction/'+sig);
  if(res.ok){
    const data = await res.json();
    statusEl.innerHTML='<div class="status" style="background:#001a0a;border:1px solid #00ff88;color:#00ff88;">✅ TX Found on Solana!<br>To: '+TREASURY+'<br>Amount: $'+amount+'<br>Status: Confirmed — Dashboard Activated<br><a href="https://solscan.io/tx/'+sig+'" target="_blank" style="color:#7de8ff;">View Tx on Solscan</a></div><button class="btn-blue" onclick="location.href=\'dashboard.html\'">Go Dashboard — $'+amount+' Activated</button>';
    // Save to localStorage for dashboard
    localStorage.setItem('last_deposit_sol', JSON.stringify({amount, sig, treasury:TREASURY, time:Date.now(), network:'solana'}));
  } else {
    statusEl.innerHTML='<div class="status" style="background:#001a0a;border:1px solid #ffd700;color:#ffd700;">⚠️ Tx not found yet — Wait 30 sec for confirmation<br>We saved your Tx — Checking Treasury: '+TREASURY+'<br>Amount: $'+amount+' — If you sent SOL to correct address, it will confirm automatically.<br><a href="https://solscan.io/tx/'+sig+'" target="_blank" style="color:#7de8ff;">Check on Solscan Manually</a></div><button class="btn-blue" onclick="location.href=\'dashboard.html\'">Go Dashboard — Pending Verification</button>';
    localStorage.setItem('last_deposit_sol', JSON.stringify({amount, sig, treasury:TREASURY, time:Date.now(), network:'solana', status:'pending'}));
  }
 } catch(e){
  statusEl.innerHTML='<div class="status" style="background:#001a0a;border:1px solid #00ff88;color:#00ff88;">✅ SOL Sent — Manual Verify<br>Treasury: '+TREASURY+'<br>Tx: '+sig.substring(0,30)+'...<br>Amount: $'+amount+'<br>Network: SOLANA ONLY<br><a href="https://solscan.io/tx/'+sig+'" target="_blank" style="color:#7de8ff;">Verify on Solscan</a></div><button class="btn-blue" onclick="location.href=\'dashboard.html\'">Go Dashboard</button>';
 }
}
</script></body></html>
