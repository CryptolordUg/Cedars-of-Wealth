<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Withdraw SOL Live - Cedars of Wealth</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#020a14;color:#fff;font-family:system-ui,monospace;width:100vw;overflow-x:hidden}.container{max-width:650px;margin:30px auto;padding:20px}.card{background:linear-gradient(145deg,#1c2e55,#2a3f6d);border:1px solid #4a6aaa;border-radius:20px;padding:24px}.header{height:80px;display:flex;align-items:center;justify-content:space-between;background:rgba(2,10,20,0.98);border-bottom:3px solid #c0c0c0;position:sticky;top:0;z-index:999;width:100vw;padding:0 24px}.btn-blue{background:linear-gradient(90deg,#9945ff,#7de8ff);color:#fff;font-weight:bold;border:none;border-radius:12px;padding:16px 26px;font-size:16px;cursor:pointer;width:100%;margin:8px 0}.input{background:#0b1326;border:1.5px solid #3a5a9a;border-radius:12px;padding:14px;width:100%;color:#fff;margin:8px 0;font-family:monospace}.status{border-radius:10px;padding:12px;margin:10px 0;font-size:13px;text-align:center}</style></head><body>
<header class="header"><div style="color:#fff;font-weight:900;font-size:22px;letter-spacing:3px;">CEDARS OF WEALTH</div><nav style="display:flex;gap:18px;"><a href="dashboard.html" style="color:#7da8d0;text-decoration:none;font-weight:bold;">Dashboard</a><a href="deposit.html" style="color:#7da8d0;text-decoration:none;font-weight:bold;">Deposit</a></nav></header>
<div class="container"><div class="card">
<div style="font-size:28px;font-weight:bold;text-align:center;color:#00ff88;">Withdraw — SOLANA ONLY</div>
<div style="background:#001a0a;border:1px solid #00ff88;border-radius:10px;padding:12px;margin:12px 0;text-align:center;">
<div style="color:#00ff88;font-weight:bold;">BALANCE: $1,350.00 — Fee $10 Auto Deduct</div><div style="color:#888;font-size:11px;margin-top:4px;">Min Withdraw $20 — You receive amount - $10 — SOL Network Only</div>
</div>
<input class="input" id="amount" type="number" min="20" placeholder="Withdraw Amount — Min $20 (You get - $10 fee)" oninput="calcNet()">
<div id="net" class="status" style="background:#000;border:1px solid #4a6aaa;color:#7de8ff;">Net you receive: $0 — Fee $10 — SOL</div>
<input class="input" id="wallet" placeholder="Your SOL Wallet Address — 32+ chars — Solana Only — NOT BSC/ERC20">
<button class="btn-blue" onclick="requestWithdraw()">💸 Request Withdraw — SOL Only — Fee $10</button>
<div id="status"></div>
<div style="background:#000;border:2px solid #9945ff;border-radius:12px;padding:12px;margin-top:12px;word-break:break-all;text-align:center;">
<div style="color:#9945ff;font-size:11px;">TREASURY PAYOUT FROM:</div><div style="color:#7de8ff;font-size:12px;">6XQviXJ5EceCmZq6uGrnrsxBKSnLKSvXeT7MCFF6fTb</div><div style="color:#888;font-size:10px;margin-top:4px;">Solscan Verified — SOLANA ONLY</div>
</div>
</div></div>
<script>
const TREASURY = "6XQviXJ5EceCmZq6uGrnrsxBKSnLKSvXeT7MCFF6fTb";
function calcNet(){
 const amt = parseFloat(document.getElementById('amount').value) || 0;
 const net = amt - 10;
 document.getElementById('net').innerHTML = amt >= 20 ? 'Net you receive: $'+net.toFixed(2)+' — Fee $10 deducted — To SOL wallet — SOL Network Only' : 'Net you receive: $0 — Min $20 required';
}
function requestWithdraw(){
 const amt = parseFloat(document.getElementById('amount').value);
 const wallet = document.getElementById('wallet').value.trim();
 const statusEl = document.getElementById('status');
 if(!amt || amt < 20){statusEl.innerHTML='<div class="status" style="background:#1a0a00;border:1px solid #ff4444;color:#ff8888;">❌ Min $20 — Fee $10</div>';return;}
 if(!wallet || wallet.length < 32){statusEl.innerHTML='<div class="status" style="background:#1a0a00;border:1px solid #ff4444;color:#ff8888;">❌ Invalid SOL address — Must be Solana — 32+ chars</div>';return;}
 if(wallet === TREASURY){statusEl.innerHTML='<div class="status" style="background:#1a0a00;border:1px solid #ff4444;color:#ff8888;">❌ Cannot withdraw to Treasury itself</div>';return;}
 const net = amt - 10;
 statusEl.innerHTML='<div class="status" style="background:#001a0a;border:1px solid #00ff88;color:#00ff88;">✅ Withdraw Request Submitted — SOL ONLY<br>Amount: $'+amt+'<br>Fee: $10<br>Net: $'+net.toFixed(2)+' to '+wallet.substring(0,15)+'...<br>From Treasury: '+TREASURY+'<br>Network: SOLANA ONLY<br>Status: Pending Admin Approval — Solscan Tx will appear after approval</div><button class="btn-blue" onclick="location.href=\'dashboard.html\'">Back to Dashboard</button>';
 localStorage.setItem('last_withdraw_sol', JSON.stringify({amount:amt, fee:10, net, to:wallet, from:TREASURY, time:Date.now(), network:'solana'}));
}
</script></body></html>
