<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdraw - USD Only</title>
<style>:root{--bg:#0b1020;--card:#162040;--br:#1e2d55;--m:#8a9cc7}*{box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#eef2ff;margin:0}.nav{padding:12px 16px;border-bottom:1px solid var(--br);display:flex;justify-content:space-between}.card{background:var(--card);border:1px solid #2a3a6a;border-radius:12px;padding:14px;margin:12px}.input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--br);background:#0b1020;color:#fff;margin:6px 0}.btn{padding:11px 16px;border-radius:8px;border:none;font-weight:800;min-height:44px;cursor:pointer;background:#fff;color:#000}.small{font-size:11px;color:var(--m)}</style></head><body>
<div class="nav"><b>🌲 Withdraw — USD Only</b><a href="investor-dashboard.html" style="color:var(--m);text-decoration:none;font-size:12px">Dashboard</a></div>
<div class="card"><h3>Withdraw in USD Only — $</h3><div class="small">Balance: <span id="bal">$0.00</span> USD — Proof via Solscan</div>
<input id="amt" class="input" type="number" placeholder="Amount in USD"><input id="to" class="input" placeholder="To: Solana Wallet or MoMo Number"><button class="btn" style="width:100%" onclick="doW()">Withdraw — USD Only</button>
<div id="list" style="margin-top:12px;font-size:11px"></div>
</div>
<script>
function doW(){let a=parseFloat(document.getElementById('amt').value); let b=parseFloat(localStorage.getItem('cedars_usd_bal')||'0'); if(!a||a>b){alert('Insufficient USD — Balance $'+b.toFixed(2));return;} localStorage.setItem('cedars_usd_bal',(b-a).toString()); let tx=JSON.parse(localStorage.getItem('cedars_tx')||'[]'); tx.unshift({type:'Withdraw',amt:a.toFixed(2),date:new Date().toLocaleDateString(),hash:'5W'+Math.random().toString(36).substr(2,20)}); localStorage.setItem('cedars_tx',JSON.stringify(tx)); render(); alert('Withdraw $'+a.toFixed(2)+' USD queued');}
function render(){let b=parseFloat(localStorage.getItem('cedars_usd_bal')||'0'); document.getElementById('bal').innerText='$'+b.toFixed(2); let tx=JSON.parse(localStorage.getItem('cedars_tx')||'[]'); document.getElementById('list').innerHTML=tx.map(t=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #1e2d55;padding:6px 0"><span>${t.type} $${t.amt} — ${t.date}</span><a href="https://solscan.io/tx/${t.hash}" target="_blank" style="color:#00e676">Solscan ↗</a></div>`).join('');} render();
</script></body></html>
