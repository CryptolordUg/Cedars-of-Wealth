<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdraw USD - Cedars</title><style>:root{--bg:#0b1020;--card:#162040;--br:#1e2d55;--m:#8a9cc7}*{box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#eef2ff;margin:0}.top{background:rgba(11,16,32,.98);border-bottom:1px solid var(--br);padding:10px 12px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:9}.menu{display:flex;gap:6px;overflow-x:auto}.menu a{color:var(--m);text-decoration:none;font-size:11px;padding:6px 10px;border-radius:20px;border:1px solid var(--br);background:var(--card)}.card{max-width:400px;margin:20px auto;background:var(--card);border:1px solid #2a3a6a;border-radius:14px;padding:16px}.input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--br);background:#0b1020;color:#fff;margin:6px 0}.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:800;background:#2a5bd7;color:#fff;min-height:44px}.small{font-size:11px;color:var(--m)}</style></head><body>
<div class="top"><b>🌲 Withdraw — USD Only $</b><div class="menu"><a href="index.html">Home</a><a href="deposit.html">Deposit</a><a href="withdraw.html">Withdraw</a><a href="referral.html">Referral</a><a href="login.html">Sign in/out</a></div></div>
<div class="card"><h3>Withdraw USD Only — $</h3><p class="small">Balance: <span id="bal">$0.00 USD</span></p><input id="amt" class="input" type="number" placeholder="Amount USD"><input id="wall" class="input" placeholder="Solana Wallet"><button class="btn" onclick="doW()">Request Withdraw $ USD</button><div id="out" style="margin-top:10px;font-size:12px"></div></div>
<script src="fix.js"></script><script>
function doW(){let a=parseFloat(document.getElementById('amt').value); let bal=parseFloat(localStorage.getItem('cedars_usd_bal')||'0'); if(!a||a<=0){alert('Enter USD');return;} if(a>bal){alert('Insufficient $ USD Balance: $'+bal);return;} bal-=a; localStorage.setItem('cedars_usd_bal',bal.toString()); let tx=JSON.parse(localStorage.getItem('cedars_tx')||'[]'); let h='WDR-'+Math.random().toString(36).substr(2,9).toUpperCase(); tx.push({type:'Withdraw',amt:a,hash:h,date:new Date().toLocaleString()}); localStorage.setItem('cedars_tx',JSON.stringify(tx)); document.getElementById('out').innerHTML='✅ Withdraw $'+a+' requested — <a href="https://solscan.io/tx/'+h+'" target="_blank" style="color:#00e676">Solscan ↗</a>'; document.getElementById('bal').innerText='$'+bal.toFixed(2)+' USD'; location.href='investor-dashboard.html';}
document.getElementById('bal').innerText='$'+(parseFloat(localStorage.getItem('cedars_usd_bal')||'0').toFixed(2))+' USD';
</script><script src="support-widget.js"></script><script src="integrity-check.js"></script></body></html>
