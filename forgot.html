<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Cedars of Wealth Singapore</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,Arial;background:radial-gradient(circle at top,#0a1a2a,#020a02);color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}.box{background:#0a1a0f;border:2px solid #00ff8844;border-radius:20px;padding:30px;width:100%;max-width:420px;text-align:center}h1{font-size:28px;color:#00ff88}input{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:1px solid #1a4a1a;background:#020a02;color:#fff}button{width:100%;padding:14px;background:#00ff88;color:#000;border:none;border-radius:12px;font-weight:900;margin-top:10px;cursor:pointer}.flag{font-size:12px;color:#88aa88;margin-top:12px}</style>
</head><body>
<div class="box">
<h1>🌲 CEDARS</h1><p style="letter-spacing:3px;font-size:11px">SINGAPORE • WORLDWIDE • 500 YEAR LOCK</p>
<h3 style="margin:20px 0 5px">Forgot Password?</h3><p style="font-size:12px;color:#8899aa">Enter email — We send reset link worldwide</p>
<input id="email" type="email" placeholder="Your email worldwide">
<button onclick="sendReset()">SEND RESET LINK</button>
<div id="msg" style="margin-top:15px;font-size:13px;color:#00ff88;display:none"></div>
<div class="flag">🌍 Works in USA • UK • Dubai • Uganda • Singapore • All Countries<br>⚡ Singapore Server — Fast Global CDN</div>
<a href="/Cedars-of-Wealth/login.html" style="color:#00ff88;font-size:12px;display:block;margin-top:15px;text-decoration:none">← Back to Login</a>
</div>
<script>
function sendReset(){
 let email=document.getElementById('email').value.trim();
 if(!email){alert('Enter email');return;}
 let token=btoa(email+'|'+Date.now()).replace(/=/g,'');
 let link=`https://cryptolordug.github.io/Cedars-of-Wealth/password.html?email=${encodeURIComponent(email)}&token=${token}`;
 document.getElementById('msg').style.display='block';
 document.getElementById('msg').innerHTML=`✅ Reset link ready!<br><br><a href="${link}" style="color:#fff;background:#111;padding:8px 12px;border-radius:8px;word-break:break-all;display:inline-block">${link}</a><br><br><span style="font-size:11px;color:#8899aa">In production, this link will be sent to ${email} automatically via email. For now, click link above.</span>`;
 // Later: connect to EmailJS / Firebase to auto-send email
 localStorage.setItem('reset_'+email, token);
}
</script>
</body></html>
