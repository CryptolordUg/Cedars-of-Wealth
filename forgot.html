<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Cedars of Wealth</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,Arial;background:radial-gradient(circle at top,#0a1a0f,#020a02);color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}.box{background:#0f2310;border:2px solid #00ff8844;border-radius:20px;padding:30px;width:100%;max-width:420px;text-align:center;overflow:hidden}h1{font-size:32px;font-weight:900;color:#00ff88}.sub{letter-spacing:4px;font-size:11px;color:#88cc88;margin:6px 0 18px;font-weight:700}.marquee{width:100%;background:#00ff8815;border:1px solid #00ff8833;border-radius:8px;padding:8px 0;margin:10px 0 18px;overflow:hidden;white-space:nowrap}.marquee span{display:inline-block;padding-left:100%;animation:slide 8s linear infinite;font-weight:900;font-size:14px;color:#00ff88}@keyframes slide{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}input{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:1px solid #1a4a1a;background:#020a02;color:#fff;font-size:15px}button{width:100%;padding:14px;background:linear-gradient(90deg,#00ff88,#00cc66);color:#000;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px;cursor:pointer}.motto{margin-top:18px;font-weight:900;letter-spacing:3px;color:#ffcc00;font-size:13px;text-transform:uppercase}</style>
</head><body>
<div class="box">
<h1>🌲 CEDARS</h1>
<div class="sub">Trust. Growth. Unity</div>
<div class="marquee"><span>Enter email, We send reset • Enter email, We send reset • Enter email, We send reset •</span></div>
<h3>Forgot Password?</h3>
<input id="email" type="email" placeholder="Your email">
<button id="btn" onclick="sendReset()">SEND RESET LINK</button>
<div id="msg" style="margin-top:15px;font-size:13px;display:none"></div>
<div class="motto">Die rich or Die trying</div>
<a href="/Cedars-of-Wealth/login.html" style="color:#00ff88;font-size:12px;display:block;margin-top:18px;text-decoration:none">← Back to Login</a>
</div>
<script>
const SERVICE_ID = "REPLACE_WITH_YOUR_SERVICE_ID";
const TEMPLATE_ID = "REPLACE_WITH_YOUR_TEMPLATE_ID";
const PUBLIC_KEY = "e3V4YLk4056BIonfQ";
emailjs.init(PUBLIC_KEY);

function sendReset(){
 let email=document.getElementById('email').value.trim();
 if(!email){alert('Enter email');return;}
 if(SERVICE_ID.includes("REPLACE")){alert('Please send me your Service ID and Template ID to activate auto-email. Go to dashboard.emailjs.com');return;}
 let btn=document.getElementById('btn');let msg=document.getElementById('msg');
 btn.innerText="SENDING WORLDWIDE...";btn.disabled=true;
 let token=btoa(email+'|'+Date.now()).replace(/=/g,'');
 let reset_link=`https://cryptolordug.github.io/Cedars-of-Wealth/password.html?email=${encodeURIComponent(email)}&token=${token}`;
 let params = { to_email: email, reset_link: reset_link, to_name: email.split('@')[0], from_name: "Cedars of Wealth - No Reply", reply_to: "noreply@cedarsofwealth.sg" };
 emailjs.send(SERVICE_ID, TEMPLATE_ID, params).then(()=>{
   msg.style.display='block';msg.style.color='#00ff88';
   msg.innerHTML=`✅ Email sent worldwide to <b>${email}</b>!<br><br>Check inbox / spam.<br><small style="color:#8899aa">From: Cedars of Wealth (no-reply)<br>Sender hidden: cryptome2030@gmail.com</small>`;
   btn.innerText="SEND RESET LINK";btn.disabled=false;
 }).catch((err)=>{
   msg.style.display='block';msg.style.color='#ff4444';
   msg.innerHTML=`❌ Failed: ${err.text || err}<br>Check Service ID / Template ID`;
   btn.innerText="SEND RESET LINK";btn.disabled=false;
 });
}
</script>
</body></html>
