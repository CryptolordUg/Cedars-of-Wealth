<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Cedars of Wealth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,Arial;background:radial-gradient(circle at top,#0a1a0f,#020a02);color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
.box{background:#0f2310;border:2px solid #00ff8844;border-radius:20px;padding:30px;width:100%;max-width:420px;text-align:center;overflow:hidden}
h1{font-size:32px;font-weight:900;color:#00ff88;letter-spacing:2px}
.sub{letter-spacing:4px;font-size:11px;color:#88cc88;margin:6px 0 18px;font-weight:700}
.marquee{width:100%;background:#00ff8815;border:1px solid #00ff8833;border-radius:8px;padding:8px 0;margin:10px 0 18px;overflow:hidden;white-space:nowrap}
.marquee span{display:inline-block;padding-left:100%;animation:slide 8s linear infinite;font-weight:900;font-size:14px;color:#00ff88;letter-spacing:1px}
@keyframes slide{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
input{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:1px solid #1a4a1a;background:#020a02;color:#fff;font-size:15px}
button{width:100%;padding:14px;background:linear-gradient(90deg,#00ff88,#00cc66);color:#000;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px;cursor:pointer}
.motto{margin-top:18px;font-weight:900;letter-spacing:3px;color:#ffcc00;font-size:13px;text-transform:uppercase}
</style>
</head><body>
<div class="box">
<h1>🌲 CEDARS</h1>
<div class="sub">Trust. Growth. Unity</div>

<div class="marquee"><span>Enter email, We send reset • Enter email, We send reset • Enter email, We send reset •</span></div>

<h3 style="margin:5px 0">Forgot Password?</h3>
<input id="email" type="email" placeholder="Your email">
<button onclick="sendReset()">SEND RESET LINK</button>

<div id="msg" style="margin-top:15px;font-size:13px;color:#00ff88;display:none"></div>

<div class="motto">Die rich or Die trying</div>

<a href="/Cedars-of-Wealth/login.html" style="color:#00ff88;font-size:12px;display:block;margin-top:18px;text-decoration:none">← Back to Login</a>
</div>

<script>
function sendReset(){
 let email=document.getElementById('email').value.trim();
 if(!email){alert('Enter email');return;}
 let token=btoa(email+'|'+Date.now()).replace(/=/g,'');
 let link=`https://cryptolordug.github.io/Cedars-of-Wealth/password.html?email=${encodeURIComponent(email)}&token=${token}`;
 document.getElementById('msg').style.display='block';
 document.getElementById('msg').innerHTML=`✅ Reset link ready!<br><br><a href="${link}" style="color:#fff;background:#111;padding:8px 12px;border-radius:8px;word-break:break-all;display:inline-block">${link}</a><br><br><span style="font-size:11px;color:#8899aa">This link will be auto-emailed to ${email}</span>`;
 localStorage.setItem('reset_'+email, token);
}
</script>
</body></html>
