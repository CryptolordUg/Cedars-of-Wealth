<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title>
<style>:root{--bg:#0b1020;--card:#162040;--br:#1e2d55}*{box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#eef2ff;margin:0}.card{max-width:360px;margin:40px auto;background:var(--card);border:1px solid #2a3a6a;border-radius:14px;padding:16px}.input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--br);background:#0b1020;color:#fff;margin:6px 0}.btn{width:100%;padding:12px;border-radius:8px;border:none;font-weight:800;background:#fff;color:#000;min-height:44px}</style></head><body>
<div class="card"><h3>Sign In — USD Only</h3>
<input id="email" class="input" placeholder="Email"><input id="pass" class="input" type="password" placeholder="Password">
<button class="btn" onclick="doLogin()">SIGN IN — $ USD</button><button class="btn" style="background:#1e2d55;color:#fff;margin-top:6px" onclick="doOut()">SIGN OUT</button>
<p style="font-size:11px;color:#8a9cc7;margin-top:8px">Commands: CedarsSignIn(), CedarsSignOut(), CedarsBalance()</p></div>
<script src="fix.js"></script>
<script>
function doLogin(){let e=document.getElementById('email').value; if(!e){alert('Enter email');return;} CedarsSignIn(e);}
function doOut(){CedarsSignOut();}
</script></body></html>
