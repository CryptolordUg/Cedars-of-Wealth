<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><style>body{margin:0;background:#050805;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Arial} .box{background:#0c140c;border:1px solid #2a4a2a;padding:24px;border-radius:12px;width:90%;max-width:360px} input{width:100%;padding:10px;margin:6px 0;background:#060a06;border:1px solid #2a4a2a;color:#fff;border-radius:6px} .btn{width:100%;padding:10px;background:#a8c686;border:0;border-radius:8px;font-weight:800}</style></head><body><div class="box"><div style="color:#c8b07a;font-weight:900;text-align:center">🌲 CEDARS LOGIN</div><input id="e" placeholder="Email / Username"><input id="p" type="password" placeholder="Password"><button class="btn" onclick="let u=JSON.parse(localStorage.getItem('cedar_user')||'{}');if((e.value==u.e||e.value==u.u)&&p.value==u.p){localStorage.setItem('cedar_login','1');location.href='dashboard/balance.html'}else alert('Invalid')">LOGIN TO VAULT</button><div style="display:flex;justify-content:space-between;margin-top:10px;font-size:10px"><a href="register.html" style="color:#a8c686">Register</a><a href="#" onclick="localStorage.clear();alert('Logged out');location.href='index.html'" style="color:#5a6a3a">Logout</a></div></div></body></html>
