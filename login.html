<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#F8F9FA;padding-top:68px}.top{position:fixed;top:0;left:0;right:0;background:#102A43;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:9999;border-bottom:2px solid #FFD700}.logo{font-size:28px;font-weight:900;color:#fff;text-shadow:0 0 10px #FFD700}.logo span{color:#FFD700}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,215,0,.3)}.nav a.active{background:#FFD700;color:#102A43}.wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 68px);padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:28px;width:100%;max-width:420px}.ip{font-size:11px;background:#102A43;color:#FFD700;padding:8px 12px;border-radius:8px;margin-bottom:12px;text-align:center}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;margin:8px 0}.row{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:12px}.row input{width:18px;height:18px;margin:0}.btn{width:100%;padding:14px;background:#102A43;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px}.link{color:#102A43;font-size:13px;text-decoration:none;font-weight:600;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:400px;border:2px solid #FFD700}footer{text-align:center;padding:16px;font-size:10px;color:#666}@media(max-width:700px){.top{flex-direction:column;gap:6px}body{padding-top:100px}}</style></head><body><div class="top"><div class="logo">🌲 CEDARS <span>OF WEALTH</span></div><div class="nav"><a href="index.html">Home</a><a href="register.html">Register</a><a href="dashboard/deposit.html">Deposit</a><a href="dashboard/withdraw.html">Withdraw</a><a href="dashboard/referral.html">Referral</a><a href="dashboard/balance.html">Balance</a><a href="login.html" class="active">Sign In</a></div></div><div class="wrap"><div class="card"><div style="text-align:center;font-size:22px;font-weight:900;margin-bottom:12px">🌲 CEDARS <span style="color:#FFD700">OF WEALTH</span></div><div class="ip" id="ip">Detecting location...</div><div style="display:flex;justify-content:space-between;font-size:11px;color:#666;margin-bottom:4px"><span id="activeCount">Active Accounts: 0</span><span id="ipTxt">Secure</span></div><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><div class="row"><input type="checkbox" id="rem"><label for="rem">Remember login</label><span style="margin-left:auto"><a class="link" onclick="openReset()">Forgot Password?</a></span></div><button class="btn" onclick="login()">Sign In</button><p style="text-align:center;margin-top:12px"><a class="link" href="register.html">Create Account</a></p><div id="msg" style="font-size:12px;margin-top:8px;text-align:center"></div></div></div><div class="modal" id="resetModal"><div class="modal-box"><h3 style="margin-bottom:8px">Reset Password</h3><p style="font-size:12px;color:#666;margin-bottom:8px">Enter username + new password. One-time reset.</p><input id="ru" placeholder="Username"><input id="rp" type="password" placeholder="New Password"><input id="rp2" type="password" placeholder="Confirm New Password"><button class="btn" onclick="resetPass()">Reset Password</button><button class="btn" style="background:#ddd;color:#333;margin-top:8px" onclick="closeReset()">Cancel</button><div id="rMsg" style="font-size:12px;margin-top:8px;text-align:center"></div></div></div><footer>© CEDARS OF WEALTH</footer><script>let ipData={ip:'-',loc:'-'};async function detect(){try{let r=await fetch('https://ipapi.co/json/');let d=await r.json();ipData={ip:d.ip,loc:d.city+', '+d.country_name};document.getElementById('ip').innerText='IP: '+d.ip+' | '+d.city+', '+d.country_name;document.getElementById('ipTxt').innerText=d.ip;}catch{try{let r2=await fetch('https://ipinfo.io/json');let d2=await r2.json();ipData={ip:d2.ip,loc:d2.city+', '+d2.country};document.getElementById('ip').innerText='IP: '+d2.ip+' | '+d2.city+', '+d2.country;}catch{document.getElementById('ip').innerText='Secure Connection';}}}detect();(function(){let r=JSON.parse(localStorage.getItem('cedar_remember')||'null');if(r){document.getElementById('u').value=r.u||'';document.getElementById('p').value=r.p||'';document.getElementById('rem').checked=true;}})();function getAll(){return JSON.parse(localStorage.getItem('cedar_all_users')||'[]')}function countActive(){let all=getAll();document.getElementById('activeCount').innerText='Active Accounts: '+all.length+' on this device';return all.length}countActive();function login(){let u=document.getElementById('u').value.trim(),p=document.getElementById('p').value,rem=document.getElementById('rem').checked;if(!u||!p){document.getElementById('msg').innerText='Fill all';return}let all=getAll();let found=all.find(x=>x.u===u&&x.p===p);if(!found&&all.length>0){document.getElementById('msg').innerText='Wrong username or password. Use Reset.';return}if(!found){found={u:u,p:p,code:'CW-'+u.toUpperCase()+'-'+Math.random().toString(36).substring(2,6).toUpperCase(),ip:ipData.ip,loc:ipData.loc,time:Date.now()};all.push(found);localStorage.setItem('cedar_all_users',JSON.stringify(all));}if(rem){localStorage.setItem('cedar_remember',JSON.stringify({u:u,p:p}))}else{localStorage.removeItem('cedar_remember')}localStorage.setItem('cedar_user',JSON.stringify(found));document.getElementById('msg').innerText='Login success';location.href='dashboard/balance.html';}function openReset(){document.getElementById('resetModal').classList.add('open');document.getElementById('ru').value=document.getElementById('u').value}function closeReset(){document.getElementById('resetModal').classList.remove('open')}function resetPass(){let u=document.getElementById('ru').value.trim(),p=document.getElementById('rp').value,p2=document.getElementById('rp2').value;if(!u||!p){document.getElementById('rMsg').innerText='Fill all';return}if(p!==p2){document.getElementById('rMsg').innerText='Passwords not match';return}if(p.length<6){document.getElementById('rMsg').innerText='Min 6 chars';return}let all=getAll();let idx=all.findIndex(x=>x.u===u);if(idx===-1){document.getElementById('rMsg').innerText='Username not found on this device';return}all[idx].p=p;all[idx].resetIP=ipData.ip;all[idx].resetTime=Date.now();localStorage.setItem('cedar_all_users',JSON.stringify(all));localStorage.setItem('cedar_remember',JSON.stringify({u:u,p:p}));document.getElementById('rMsg').innerText='Password reset ✓ — Login now';document.getElementById('rMsg').style.color='#0a8a00';setTimeout(()=>{closeReset();document.getElementById('u').value=u;document.getElementById('p').value=p;},800)}</script></body></html>
