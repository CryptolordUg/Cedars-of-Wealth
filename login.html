<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEDARS Login</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#020a02;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}.box{background:#0f2310;border:2px solid #00ff8844;border-radius:20px;padding:30px;width:100%;max-width:400px}.input{width:100%;padding:14px;margin:8px 0;background:#020a02;border:1px solid #00ff8844;border-radius:10px;color:#fff}.btn{width:100%;padding:14px;background:#00ff88;border:none;border-radius:10px;font-weight:900;cursor:pointer;margin:10px 0}</style></head><body><div class="box"><h1 style="color:#00ff88;text-align:center">🌲 CEDARS</h1><p style="text-align:center">LOGIN</p><input id="email" class="input" placeholder="Email"><input id="pass" class="input" type="password" placeholder="Password"><button class="btn" onclick="login()">LOGIN</button><p style="text-align:center;font-size:13px"><a href="register.html" style="color:#00ff88">Register</a> | <a href="#" onclick="alert('Demo: Use any registered user or email: demo@cedars.com pass: demo123');return false;" style="color:#00ff88">Forgot?</a></p><p id="msg" style="color:#ff8888;text-align:center"></p></div><script>function login(){let e=document.getElementById('email').value.trim();let p=document.getElementById('pass').value;let users=JSON.parse(localStorage.getItem('cedars_users')||'[]');if(users.length==0){let demo={email:'demo@cedars.com',password:'demo123',balance:'1250'};users=[demo];localStorage.setItem('cedars_users',JSON.stringify(users));}let u=users.find(x=>x.email==e&&x.password==p);if(!u&&e&&p){u={email:e,password:p,balance:'1250'};users.push(u);localStorage.setItem('cedars_users',JSON.stringify(users));}if(u){localStorage.setItem('cedars_current_user',JSON.stringify(u));location.href='dashboard/rubonai-trader.html';}else{document.getElementById('msg').innerText='Invalid login';}}</script></body></html>
