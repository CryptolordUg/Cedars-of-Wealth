<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#F8F9FA;padding-top:68px}.top{position:fixed;top:0;left:0;right:0;background:#102A43;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:9999;border-bottom:2px solid #FFD700}.logo{font-size:28px;font-weight:900;color:#fff;text-shadow:0 0 10px #FFD700}.logo span{color:#FFD700}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,215,0,.3)}.card{max-width:400px;margin:40px auto;background:#fff;border:1px solid #ddd;border-radius:16px;padding:28px}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;margin:8px 0}.btn{width:100%;padding:14px;background:#102A43;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px}a{color:#102A43;font-size:13px;text-decoration:none;font-weight:600}</style></head><body><div class="top"><div class="logo">🌲 CEDARS <span>OF WEALTH</span></div><div class="nav"><a href="index.html">Home</a><a href="register.html">Register</a><a href="dashboard/deposit.html">Deposit</a><a href="dashboard/withdraw.html">Withdraw</a><a href="dashboard/referral.html">Referral</a><a href="dashboard/balance.html">Balance</a><a href="login.html">Sign In</a></div></div><div class="card"><h3 style="text-align:center">Sign In</h3><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button class="btn" onclick="login()">Sign In</button><p style="text-align:center;margin-top:12px"><a href="register.html">Create Account</a></p><div id="msg" style="font-size:12px;margin-top:8px;text-align:center"></div></div><script>function login(){let u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;if(!u||!p){document.getElementById('msg').innerText='Fill all';return}let stored=JSON.parse(localStorage.getItem('cedar_user')||'{}');if(stored.u===u){location.href='dashboard/balance.html'}else{let user={u:u,code:'CW-'+u.toUpperCase()+'-'+Math.random().toString(36).substring(2,6).toUpperCase()};localStorage.setItem('cedar_user',JSON.stringify(user));location.href='dashboard/balance.html'}} </script></body></html>
