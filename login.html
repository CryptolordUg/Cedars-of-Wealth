<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEDARS | Login</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#020a02;color:#fff;font-family:Arial;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}.box{background:#0f2310;border:2px solid #00ff8844;border-radius:20px;padding:30px;max-width:420px;width:100%}.input{width:100%;padding:14px;background:#020a02;border:1px solid #00ff8844;border-radius:10px;color:#fff;margin:10px 0}.btn{width:100%;padding:14px;background:linear-gradient(90deg,#00ff88,#00cc66);border:none;border-radius:10px;font-weight:900;cursor:pointer;margin:10px 0}</style>
</head><body>
<div class="box">
<div id="loginForm">
<h1 style="color:#00ff88;text-align:center">🌲 CEDARS</h1><p style="text-align:center;margin:10px 0">Login to RUBONAI</p>
<input id="email" class="input" placeholder="Email">
<input id="pass" class="input" type="password" placeholder="Password">
<button class="btn" onclick="doLogin()">LOGIN</button>
<p style="text-align:center;font-size:13px"> <a href="#" onclick="showForgot();return false;" style="color:#00ff88">Forgot Password?</a> | <a href="register.html" style="color:#00ff88">Register</a></p>
<p id="msg" style="text-align:center;margin-top:10px;color:#ff8888"></p>
</div>
<div id="forgotForm" style="display:none">
<h2 style="color:#00ff88">Reset Password</h2>
<input id="femail" class="input" placeholder="Enter your email">
<button class="btn" onclick="doForgot()">SEND RESET</button>
<p style="text-align:center"><a href="#" onclick="showLogin();return false;" style="color:#00ff88">Back to Login</a></p>
</div>
</div>
<script>
function showForgot(){document.getElementById('loginForm').style.display='none';document.getElementById('forgotForm').style.display='block';}
function showLogin(){document.getElementById('forgotForm').style.display='none';document.getElementById('loginForm').style.display='block';}
function doLogin(){
 let e=document.getElementById('email').value.trim();
 let p=document.getElementById('pass').value;
 let users=JSON.parse(localStorage.getItem('cedars_users')||'[]');
 let u=users.find(x=>(x.email===e||x.username===e)&&x.password===p);
 if(u){localStorage.setItem('cedars_current_user',JSON.stringify(u));location.href='dashboard/rubonai-trader.html';}
 else{document.getElementById('msg').innerText='Invalid email or password. Try registering first.';}
}
function doForgot(){let e=document.getElementById('femail').value;alert('If '+e+' exists, reset link sent! (Demo: just login with new password: cedars123)');showLogin();}
 // Auto-redirect if already logged in
 let cur=localStorage.getItem('cedars_current_user'); if(cur && !location.hash.includes('reset')){/* stay on login - user clicked logout */}
// FIX: Never show "Invalid reset link" on normal login - only if ?token= present
if(!location.search.includes('token')){showLogin();}
</script>
</body></html>
