<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign In - Cedars</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#020a14;color:#fff;font-family:system-ui,monospace;width:100vw;min-height:100vh;display:flex;flex-direction:column;align-items:center}.card{background:linear-gradient(145deg,#1c2e55,#2a3f6d);border:1px solid #4a6aaa;border-radius:20px;padding:28px;width:100%;max-width:480px;box-shadow:0 0 30px rgba(80,140,255,0.3);margin-top:30px}.input{background:#0b1326;border:1.5px solid #3a5a9a;border-radius:12px;padding:16px;width:100%;color:#fff;font-size:18px;font-weight:bold;margin-bottom:12px}.btn-blue{background:linear-gradient(90deg,#7de8ff,#5ac8ff);color:#001a33;font-weight:bold;border:none;border-radius:12px;padding:16px;width:100%;font-size:19px;cursor:pointer}</style></head><body>
<header style="width:100vw;background:rgba(2,10,20,0.98);border-bottom:3px solid #c0c0c0;padding:16px;display:flex;flex-direction:column;align-items:center;"><a href="index.html"><img src="assets/cedars-header-400-silver.png" style="width:360px;max-width:85vw;filter:drop-shadow(0 0 20px #fff);"></a></header>
<div class="card"><div style="font-size:28px;font-weight:bold;text-align:center;">Sign In - Secure</div><div style="color:#7da8d0;font-size:14px;text-align:center;margin:8px 0 18px;">Password + OTP + 2FA + JWT - $5 to $100k - SSL Yes HTTPS Yes</div><input class="input" id="email" placeholder="Email" type="email"><input class="input" id="password" placeholder="Password" type="password"><input class="input" id="otp" placeholder="OTP 6 digits - Enter 123456 demo" type="number"><button class="btn-blue" onclick="doLogin()">Sign In - Dashboard</button><button style="background:#0b1326;border:1px solid #3a5a9a;color:#7de8ff;border-radius:12px;padding:14px;width:100%;margin-top:10px;font-weight:bold;cursor:pointer;" onclick="connectPhantom()">Connect Phantom Wallet</button><div style="color:#5a7aaa;font-size:13px;text-align:center;margin-top:14px;">No account? <a href="register.html" style="color:#7de8ff;">Register $5-$100k <2 min</a><br><a href="index.html" style="color:#7da8d0;">Home</a></div></div>
<script>function doLogin(){let e=document.getElementById('email').value,p=document.getElementById('password').value,o=document.getElementById('otp').value;let users=JSON.parse(localStorage.getItem('cedars_users')||'[]');let u=users.find(x=>x.email==e&&x.password==btoa(p));if(!u){alert('Wrong Email/Pass - Register first');return;}if(o&&o!='123456'&&o!=localStorage.getItem('cedars_otp')){alert('Invalid OTP - Use 123456 demo');return;}localStorage.setItem('cedars_session',JSON.stringify({email:u.email,phone:u.phone,wallet:u.wallet,package:u.package,amount:u.amount,loginTime:Date.now()}));alert('Welcome '+e+' Package '+u.package+' $'+u.amount+' - JWT Session 7 days - 2FA OK');location.href='dashboard/index.html';}async function connectPhantom(){if(window.solana&&window.solana.isPhantom){try{let r=await window.solana.connect();let addr=r.publicKey.toString();let users=JSON.parse(localStorage.getItem('cedars_users')||'[]');let u=users.find(x=>x.wallet==addr);if(!u){alert('Wallet not registered - Register with wallet '+addr);location.href='register.html';return;}localStorage.setItem('cedars_session',JSON.stringify({email:u.email,wallet:addr,package:u.package,amount:u.amount,loginTime:Date.now()}));location.href='dashboard/index.html';}catch(e){alert('Phantom failed');}}else{alert('Install Phantom or use Email');}}(function(){let s=localStorage.getItem('cedars_session');if(s){let j=JSON.parse(s);if(Date.now()-j.loginTime<86400000*7){location.href='dashboard/index.html';}}})();</script></body></html>
