<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Cedars of Wealth</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--b:#102A43;--g:#a8c686;--bg:#F8F9FA;--bd:#DADADA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,Arial,sans-serif;background:var(--bg);padding-top:72px} .top{position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--b);border-bottom:2px solid var(--g);padding:12px 20px;display:flex;justify-content:space-between;align-items:center} .logo{font-size:19px;font-weight:700;color:#fff} .logo span{color:var(--g)} .nav{display:flex;gap:8px;flex-wrap:wrap} .nav a{font-size:15px;font-weight:600;color:#fff;text-decoration:none;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)} .nav a.active{background:var(--g);color:var(--b)} .wrap{max-width:480px;margin:40px auto;padding:24px} .card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:24px} h1{font-size:28px;color:#102A43} .muted{font-size:14px;color:#666;margin-top:8px} input{width:100%;padding:14px;border:1px solid var(--bd);border-radius:8px;margin:10px 0;font-size:16px} .btn{width:100%;padding:14px;background:#102A43;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer} footer{text-align:center;padding:20px;font-size:12px;color:#666;margin-top:20px} footer a{color:#0057B8;text-decoration:none;font-weight:600} *:focus{outline:3px solid #4D90FE;outline-offset:2px}</style></head><body>
<div class="top"><div class="logo">🌲 CEDARS <span>OF WEALTH</span></div><div class="nav"><a href="index.html">Home</a><a href="dashboard/balance.html">Balance</a><a href="login.html" class="active">Login</a><a href="register.html">Register</a></div></div>
<div class="wrap"><div class="card"><h1>Login (demo)</h1><p class="muted">Preview account stored in this browser.</p><input id="e" placeholder="Email or Username"><input id="p" type="password" placeholder="Password"><button class="btn" onclick="log()">Login</button><div id="msg" style="margin-top:12px;font-size:14px"></div><p class="muted" style="margin-top:12px"><a href="register.html">No account? Create one</a></p></div><footer>Demo only. Risk disclosure in <a href="terms.html">Terms</a>.</footer></div>
<script>function log(){let e=document.getElementById('e').value.trim(),p=document.getElementById('p').value;let u=JSON.parse(localStorage.getItem('cedar_user')||'null');if(!u){document.getElementById('msg').innerHTML='<span style="color:#8b0000">No account found in this browser. Please register.</span>';return}if((e===u.e||e===u.u)&&p===u.p){localStorage.setItem('cedar_login','1');localStorage.setItem('cedar_session',Date.now().toString());location.href='dashboard/balance.html'}else{document.getElementById('msg').innerHTML='<span style="color:#8b0000">Invalid credentials</span>'}}</script>
</body></html>
