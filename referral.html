<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Referral - Cedars</title>
<style>:root{--bg:#0b1020;--card:#162040;--br:#1e2d55;--g:#00e676;--m:#8a9cc7}*{box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#eef2ff;margin:0}.h{padding:12px 16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--br)}.card{background:var(--card);border:1px solid #2a3a6a;border-radius:12px;padding:14px;margin:12px}.input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--br);background:#0b1020;color:#fff;margin:6px 0}.btn{padding:10px 14px;border-radius:8px;border:none;font-weight:800;min-height:44px;cursor:pointer}.leg{border:2px solid #4a7cff;border-radius:10px;padding:10px;text-align:center}.legB{border-color:var(--g)}</style></head><body>
<div class="h"><b>🌲 Cedars of Wealth</b><a href="index.html" style="color:var(--m);text-decoration:none;font-size:12px">Home</a></div>
<div class="card"><h3>Referral Link — 2 Lines Only</h3>
<input id="code" class="input" readonly>
<div style="display:flex;gap:6px"><input id="link" class="input" readonly style="flex:1"><button class="btn" style="background:#fff;color:#000" onclick="navigator.clipboard.writeText(document.getElementById('link').value);alert('Copied')">Copy</button></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><div class="leg"><b>LEG A</b><div id="aCount">0</div><div id="aList" style="font-size:10px;color:var(--m);margin-top:6px"></div></div><div class="leg legB"><b>LEG B</b><div id="bCount">0</div><div id="bList" style="font-size:10px;color:var(--m);margin-top:6px"></div></div></div></div>
<div class="card"><h4>History</h4><div id="hist" style="font-size:11px;margin-top:8px"></div></div>
<script>
let ref=localStorage.getItem('cedars_ref');if(!ref){ref='CRD-'+Math.random().toString(36).substr(2,6).toUpperCase();localStorage.setItem('cedars_ref',ref);}
document.getElementById('code').value=ref;
let base=location.href.split('?')[0].replace('referral.html','');if(base.endsWith('/'))base=base.slice(0,-1);
document.getElementById('link').value=base+'/?ref='+ref;
function render(){let A=JSON.parse(localStorage.getItem('cedars_legA')||'[]');let B=JSON.parse(localStorage.getItem('cedars_legB')||'[]');let H=JSON.parse(localStorage.getItem('cedars_referral_history')||'[]');document.getElementById('aCount').innerText=A.length+' refs';document.getElementById('bCount').innerText=B.length+' refs';document.getElementById('aList').innerText=A.map(x=>x.name).join(', ')||'Empty';document.getElementById('bList').innerText=B.map(x=>x.name).join(', ')||'Empty';document.getElementById('hist').innerHTML=H.length?H.map(h=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #1e2d55;padding:5px 0"><span>${h.name} - ${h.leg}</span><span style="color:#00e676">${h.bonus||''}</span></div>`).join(''):'No refs yet';}
render();let p=new URLSearchParams(location.search).get('ref');if(p){localStorage.setItem('cedars_referred_by',p);}
</script></body></html>
