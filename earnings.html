<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Earnings Wallet - Cedars</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#020a14;color:#fff;font-family:system-ui,monospace;width:100vw;display:flex}.sidebar{width:260px;background:#081020;border-right:2px solid #2a3f6d;padding:20px}.main{flex:1;padding:20px}.card{background:linear-gradient(145deg,#1c2e55,#2a3f6d);border:1px solid #4a6aaa;border-radius:16px;padding:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:900px){.sidebar{display:none}.grid3{grid-template-columns:1fr}}</style><script>if(!localStorage.getItem('cedars_session')){location.href='login.html';}</script></head><body><div class="sidebar"><a href="index.html"><img src="assets/cedars-header-400-silver.png" style="width:200px;"></a><div style="margin-top:12px;line-height:2.8;"><a href="dashboard/index.html" style="color:#7da8d0;text-decoration:none;">Dashboard</a><br><a href="earnings.html" style="color:#7de8ff;font-weight:bold;">Earnings Wallet</a></div></div><div class="main"><div style="font-size:28px;font-weight:bold;">Earnings Wallet - ROI Table</div><div class="grid3" style="margin-top:12px;"><div class="card" style="text-align:center;border-left:4px solid #7de8ff;"><div style="color:#888;font-size:10px;">WALLET BALANCE</div><div id="w" style="font-size:26px;font-weight:bold;">$0</div></div><div class="card" style="text-align:center;border-left:4px solid #00ff88;"><div style="color:#888;font-size:10px;">TODAY ROI</div><div id="t" style="font-size:26px;font-weight:bold;color:#00ff88;">$0</div></div><div class="card" style="text-align:center;border-left:4px solid #ffd700;"><div style="color:#888;font-size:10px;">TOTAL ROI</div><div id="tot" style="font-size:26px;font-weight:bold;color:#ffd700;">$0</div></div></div><div class="card" style="margin-top:12px;"><table style="width:100%;font-size:13px;border-collapse:collapse;"><thead><tr style="color:#888;border-bottom:1px solid #2a3f6d;"><th style="padding:8px;text-align:left;">Date</th><th>Daily Profit</th><th>Status</th></tr></thead><tbody id="rb"></tbody></table></div></div><script>let ses=JSON.parse(localStorage.getItem('cedars_session')||'{}');let a=parseFloat(ses.amount)||5;document.getElementById('w').innerText='$'+(a*0.015*7).toFixed(2);document.getElementById('t').innerText='$'+(a*0.015).toFixed(2);document.getElementById('tot').innerText='$'+(a*0.015*30).toFixed(2);let h='';for(let i=0;i<10;i++){h+=`<tr><td style="padding:8px;">${new Date(Date.now()-i*86400000).toLocaleDateString()}</td><td style="color:#00ff88;font-weight:bold;">$${(a*0.015).toFixed(2)}</td><td>Added To Wallet - ROI Table roi_id daily_profit generated_date</td></tr>`;}document.getElementById('rb').innerHTML=h;</script></body></html>
