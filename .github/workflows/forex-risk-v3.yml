name: Forex Risk v3 Pro
on:
  schedule: [{cron: '*/15 * * * *'}]
  workflow_dispatch:
jobs:
  pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node -e "
          const fs=require('fs');
          const weights={FED_RATE:40,NFP:30,CPI:25,GDP:20,WAR:50,ETF:30,EXCHANGE_HACK:60};
          const events=['CPI'];
          let calendarRisk=Math.min(events.reduce((s,e)=>s+(weights[e]||10),0),100);
          let risk=Math.round(calendarRisk*0.35+40*0.25+35*0.20+25*0.10+20*0.10);
          function throttle(r){
            if(r>=90) return {leverage:1,positionPct:0,allowTrades:false,label:'LOCKDOWN'};
            if(r>=70) return {leverage:2,positionPct:0.25,allowTrades:true,label:'HIGH'};
            if(r>=50) return {leverage:5,positionPct:0.5,allowTrades:true,label:'MEDIUM'};
            return {leverage:10,positionPct:1,allowTrades:true,label:'LOW'};
          }
          const t=throttle(risk);
          // PnL backtest simulation
          let balance=10000, equityCurve=[10000], grossWins=0, grossLosses=0;
          for(let i=0;i<50;i++){let pnl=(Math.random()-0.42)*200*t.positionPct; balance+=pnl; equityCurve.push(balance); if(pnl>0)grossWins+=pnl; else grossLosses+=-pnl;}
          let peak=equityCurve[0], maxDD=0;
          equityCurve.forEach(eq=>{peak=Math.max(peak,eq); maxDD=Math.max(maxDD,(peak-eq)/peak*100);});
          let profitFactor=grossLosses>0?(grossWins/grossLosses):0;
          const crypto=require('crypto');
          const payload={type:'RISK_ALERT',risk,event:events[0]||'NONE',throttle:t,timestamp:Date.now()};
          const sig=crypto.createHmac('sha256','cedars-secret').update(JSON.stringify(payload)).digest('hex');
          payload.signature=sig;
          const out={...payload,backtest:{startBalance:10000,endBalance:Math.round(balance),netProfit:Math.round(balance-10000),roi:((balance-10000)/100).toFixed(1)+'%',maxDrawdown:maxDD.toFixed(2)+'%',profitFactor:profitFactor.toFixed(2)},updated:new Date().toISOString()};
          fs.mkdirSync('dashboard',{recursive:true});
          fs.writeFileSync('dashboard/forex-risk.json',JSON.stringify(out,null,2));
          "
          git config user.name "risk-bot"; git config user.email "bot@cedars.farm"
          git add dashboard/forex-risk.json; git commit -m "risk v3" || true; git push || true
