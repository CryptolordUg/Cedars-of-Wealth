name: Forex Risk Guard v2
on:
  schedule: [{cron: '*/30 * * * *'}]
  workflow_dispatch:
jobs:
  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node -e "
          const fs=require('fs');
          // Weights
          const weights={FED_RATE:40,NFP:30,CPI:25,GDP:20,WAR:50,ETF:30,EXCHANGE_HACK:60,TOKEN_UNLOCK:15};
          // Simulated live events - replace with API calls
          const events=['CPI','NFP']; // example
          let calendarRisk=Math.min(events.reduce((s,e)=>s+(weights[e]||10),0),100);
          let newsRisk=35+Math.random()*20;
          let volatilityRisk=30+Math.random()*25;
          let liquidityRisk=20+Math.random()*15;
          let cryptoRisk=15+Math.random()*10;
          let riskScore = calendarRisk*0.35 + newsRisk*0.25 + volatilityRisk*0.20 + liquidityRisk*0.10 + cryptoRisk*0.10;
          // Proven tweak: 2+ high events in 2h window
          let highEventsInWindow=events.filter(e=>['FED_RATE','NFP','WAR','EXCHANGE_HACK'].includes(e)).length;
          if(highEventsInWindow>=2) riskScore*=1.3;
          riskScore=Math.min(Math.round(riskScore),100);
          // Event-Driven Throttle
          let throttle={};
          if(riskScore<=29){throttle={mode:'NORMAL',size:'1.0x',leverage:'1:100',action:'Trade Normally'};}
          else if(riskScore<=59){throttle={mode:'MEDIUM',size:'0.75x',leverage:'1:50',action:'Reduce Size 25%'};}
          else if(riskScore<=79){throttle={mode:'HIGH',size:'0.5x',leverage:'1:20',action:'Reduce Size 50%'};}
          else{throttle={mode:'CRITICAL',size:'0x',leverage:'1:1',action:'Block New Trades, SL to breakeven'};}
          const out={risk:riskScore,mode:throttle.mode,size:throttle.size,leverage:throttle.leverage,action:throttle.action,events,updated:new Date().toISOString()};
          fs.mkdirSync('dashboard',{recursive:true});
          fs.writeFileSync('dashboard/forex-risk.json', JSON.stringify(out,null,2));
          console.log('Risk:',out);
          "
          git config user.name "risk-bot"
          git config user.email "bot@cedars.farm"
          git add dashboard/forex-risk.json
          git commit -m "risk v2 update" || true
          git push || true
