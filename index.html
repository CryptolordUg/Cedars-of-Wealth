<script>
// SECURITY LOCK v=SEC2026
const SEC = {
  minPass: 8,
  lockAttempts: 5,
  lockTime: 15*60*1000,
  checkEmail: (e)=> /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e),
  checkPass: (p)=> /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/.test(p),
  hash: (s)=> btoa(s.split('').reverse().join('')+'_CEDARS_SALT_2026'),
  saveUser: (u)=> {
    let users=JSON.parse(localStorage.getItem('cedars_users')||'[]');
    if(users.find(x=>x.email===u.email)) throw 'Email already registered';
    u.password=SEC.hash(u.password);
    u.id=Date.now();
    u.createdAt=new Date().toISOString();
    u.kyc=false; u.verified=false;
    users.push(u);
    localStorage.setItem('cedars_users', JSON.stringify(users));
    localStorage.setItem('cedars_session', JSON.stringify({email:u.email,id:u.id,loginAt:Date.now()}));
  }
};

function secureRegister(){
  const email=document.getElementById('regEmail')?.value?.trim().toLowerCase();
  const pass=document.getElementById('regPass')?.value;
  const confirm=document.getElementById('regConfirm')?.value;
  const wallet=document.getElementById('regWallet')?.value?.trim();
  const agree=document.getElementById('regAgree')?.checked;
  const errBox=document.getElementById('regError');

  try{
    if(!email||!SEC.checkEmail(email)) throw 'Invalid email format - use real email';
    if(!pass||!SEC.checkPass(pass)) throw 'Weak password - need 8 chars, UPPER, lower, number, symbol (@$!%)';
    if(pass!==confirm) throw 'Passwords do not match';
    if(!wallet||!wallet.startsWith('T')||wallet.length<26) throw 'Invalid TRC20 wallet - Must start with T';
    if(!agree) throw 'You must accept Terms & Compliance';
    
    let attempts=parseInt(localStorage.getItem('cedars_reg_attempts')||'0');
    if(attempts>=SEC.lockAttempts) throw 'Too many attempts - wait 15 mins';

    SEC.saveUser({email,password:pass,wallet,ref:'USER'+Math.random().toString(36).substr(2,6).toUpperCase()});
    localStorage.removeItem('cedars_reg_attempts');
    alert('✅ Secure registration success - Redirecting to TRC20 deposit');
    location.href='app/deposit.html?v=SEC2026';

  }catch(e){
    let attempts=parseInt(localStorage.getItem('cedars_reg_attempts')||'0')+1;
    localStorage.setItem('cedars_reg_attempts',attempts.toString());
    if(errBox){errBox.innerText=e;errBox.style.display='block';}
    else alert('❌ '+e);
  }
}

function secureLogin(){
  const email=document.getElementById('loginEmail')?.value?.trim().toLowerCase();
  const pass=document.getElementById('loginPass')?.value;
  const hashed=SEC.hash(pass);
  let users=JSON.parse(localStorage.getItem('cedars_users')||'[]');
  let u=users.find(x=>x.email===email && x.password===hashed);
  if(!u) return alert('❌ Invalid email or password');
  localStorage.setItem('cedars_session', JSON.stringify({email:u.email,id:u.id,loginAt:Date.now()}));
  location.href='app/dashboard.html?v=SEC2026';
}
</script>
