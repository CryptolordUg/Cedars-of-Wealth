<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEDARS OF WEALTH - Solana Live</title>
<script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#020617;color:#e8eefc;font-family:Inter,system-ui}.hd{background:linear-gradient(135deg,#9945FF,#14F195);padding:20px;text-align:center}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:16px;margin:10px 0}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.btn{background:linear-gradient(135deg,#14F195,#9945FF);color:#000;padding:12px 20px;border-radius:10px;font-weight:800;border:0;cursor:pointer;width:100%;margin-top:10px}.btn:disabled{opacity:.4}</style></head><body>
<div class="hd"><h1>💱 CEDARS OF WEALTH • SOLANA</h1><p id="netLabel">Mainnet • Real USDC • Risk Guard v3</p><div style="margin-top:10px"><button id="connectBtn" class="btn" style="width:auto;padding:10px 24px">Connect Phantom</button><div id="walletAddr" style="font-size:12px;margin-top:8px"></div></div></div>
<div class="wrap"><div class="grid3">
<div class="card"><h3>💰 WALLET BALANCE</h3><div style="font-size:36px;font-weight:800">$<span id="bal">0.00</span> USDC</div><div style="font-size:11px;color:#94a3b8" id="upd">connect wallet</div><button id="withdrawBtn" class="btn" disabled>💸 Withdraw 90% in USDC</button><div id="txStatus" style="font-size:12px;margin-top:8px;word-break:break-all"></div><div style="margin-top:12px;padding:10px;background:#020617;border-radius:10px;font-size:12px">Risk: <b id="riskScore">40</b> | <b id="riskMode">AGGRESSIVE</b></div></div>
<div class="card"><h3>📈 STAKING</h3><div>Staked: <b>$<span id="stake">0.00</span></b><br>Reserve (10%): <b style="color:#facc15">$<span id="locked">0.00</span></b></div></div>
<div class="card"><h3>🧾 Info</h3><div style="font-size:12px;color:#94a3b8">Payouts are performance-based, not guaranteed.</div></div>
</div></div>
<script>
const USDC_MINT_MAIN="EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";
const TREASURY_WALLET="YOUR_TREASURY_WALLET_HERE";
const TOKEN_PROGRAM_ID=new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA");
const ASSOC_PROGRAM_ID=new solanaWeb3.PublicKey("ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL");
let connection, publicKey=null, usdcMint, userATA=null, rawAmount=0n;
function getConn(){
  usdcMint=new solanaWeb3.PublicKey(USDC_MINT_MAIN);
  return new solanaWeb3.Connection("https://api.mainnet-beta.solana.com",'confirmed');
}
connection=getConn();
async function findATA(owner,mint){
  const [ata]=await solanaWeb3.PublicKey.findProgramAddress([owner.toBuffer(),TOKEN_PROGRAM_ID.toBuffer(),mint.toBuffer()],ASSOC_PROGRAM_ID);
  return ata;
}
document.getElementById('connectBtn').onclick=async()=>{
  if(!window.solana){alert('Install Phantom');return;}
  const r=await window.solana.connect(); publicKey=r.publicKey;
  document.getElementById('walletAddr').innerText=publicKey.toString().slice(0,6)+'...'+publicKey.toString().slice(-6);
  document.getElementById('connectBtn').innerText='Connected ✓';
  document.getElementById('withdrawBtn').disabled=false;
  loadBalance();
};
async function loadBalance(){
  try{
    userATA=await findATA(publicKey, usdcMint);
    const info=await connection.getAccountInfo(userATA);
    let ui=0;
    if(info && info.data.length>=72){
      const dv=new DataView(info.data.buffer, info.data.byteOffset, info.data.byteLength);
      const lo=dv.getUint32(64,true); const hi=dv.getUint32(68,true);
      rawAmount=(BigInt(hi)<<32n)|BigInt(lo);
      ui=Number(rawAmount)/1e6;
    } else { rawAmount=0n; }
    document.getElementById('bal').innerText=ui.toFixed(2);
    document.getElementById('stake').innerText=ui.toFixed(2);
    document.getElementById('locked').innerText=(ui*0.10).toFixed(2);
    document.getElementById('upd').innerText='on-chain balance loaded';
    document.getElementById('upd').style.color='#4ade80';
  }catch(e){ document.getElementById('upd').innerText='error loading balance: '+e.message; }
}
document.getElementById('withdrawBtn').onclick=async()=>{
  const st=document.getElementById('txStatus');
  try{
    if(TREASURY_WALLET.includes("YOUR_")){st.innerText="Set TREASURY_WALLET first in code.";return;}
    if(rawAmount==0n){st.innerText="No USDC balance.";return;}
    st.innerText="Building transaction... approve in Phantom";
    alert("Withdraw needs manual ATA creation - set treasury first. Balance read is working.");
  }catch(e){st.innerText="Error: "+e.message;}
};
fetch('/Cedars-of-Wealth/forex-risk.json?t='+Date.now()).then(r=>r.json()).then(j=>{document.getElementById('riskScore').innerText=j.risk??40;document.getElementById('riskMode').innerText=j.throttle?.label||'AGGRESSIVE';}).catch(()=>{});
</script></body></html>
