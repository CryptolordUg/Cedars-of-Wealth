<div id="calc">
  <input id="depAmt" type="number" placeholder="Deposit $" />
  <button onclick="calcDep()">Calculate</button>
  <div id="calcOut"></div>
</div>
<script>
function calcDep(){
  const amt = parseFloat(document.getElementById('depAmt').value||0);
  const boosted = amt*1.7;
  document.getElementById('calcOut').innerHTML =
    `Boosted (70%): $${boosted.toFixed(2)}<br>Locked: 200 years<br>200y projection: $${(amt*Math.pow(1.7,200)).toExponential(2)}`;
}
</script>
