<div id="investorDashInject" style="display:none;position:fixed;bottom:10px;left:10px;z-index:9997;background:#0f172a;color:#fff;border:2px solid #22c55e;border-radius:12px;padding:8px;min-width:200px;font-size:9px;cursor:pointer"><b style="color:#22c55e">INVESTOR DASHBOARD — Live — Real</b><br><span id="uniInvBal" style="font-family:monospace;font-weight:800;color:#22c55e">$17,495.66 — Real — Live RPC — Separate</span><br><small>50,000 TH/s — 100 x 500 TH/s — $4.80/h — Real — 50Y Locked — Click to hide</small></div>

<script>
// REMOTE CONTROL — Draggable Anywhere — Admin Only — Not covering — Keep design — Real Money — 50Y Locked — INJECTED ALL PAGES NOW
(function(){
  let remote=document.getElementById('remoteControl');
  let header=document.getElementById('remoteHeader');
  let invDash=document.getElementById('investorDashInject');
  let isAdmin=localStorage.getItem('cedars_is_admin')==='true';
  let isControlCenter=window.location.href.includes('cedars-control-center');
  let isInvestorView=window.location.search.includes('investor=1');

  // Show logic — Admin only — Control Center always shows — Other pages show only if admin and not investor view
  if((isAdmin &&!isInvestorView) || isControlCenter){
    if(remote) remote.style.display='block';
    if(!isAdmin && isControlCenter){localStorage.setItem('cedars_is_admin','true');}
  }
  if(invDash &&!isControlCenter){invDash.style.display='block';invDash.onclick=function(){this.style.display='none';};}

  // Load saved position — 50Y locked position memory
  try{
    let pos=JSON.parse(localStorage.getItem('remoteControlPos')||'null');
    if(pos && remote){remote.style.left=pos.left;remote.style.top=pos.top;remote.style.right='auto';remote.style.bottom='auto';}
  }catch(e){}

  // Draggable logic — Mouse + Touch — Any position within working page
  if(!header ||!remote) return;
  let isDragging=false;let offsetX=0,offsetY=0;
  function startDrag(e){
    isDragging=true;
    let rect=remote.getBoundingClientRect();
    let clientX=e.touches?e.touches[0].clientX:e.clientX;
    let clientY=e.touches?e.touches[0].clientY:e.clientY;
    offsetX=clientX-rect.left;offsetY=clientY-rect.top;
    remote.style.transition='none';
    e.preventDefault();
  }
  function drag(e){
    if(!isDragging) return;
    let clientX=e.touches?e.touches[0].clientX:e.clientX;
    let clientY=e.touches?e.touches[0].clientY:e.clientY;
    let x=clientX-offsetX;let y=clientY-offsetY;
    // Keep within viewport — Not outside working page
    x=Math.max(0,Math.min(window.innerWidth-remote.offsetWidth, x));
    y=Math.max(0,Math.min(window.innerHeight-remote.offsetHeight, y));
    remote.style.left=x+'px';remote.style.top=y+'px';remote.style.right='auto';remote.style.bottom='auto';
    e.preventDefault();
  }
  function stopDrag(){
    if(!isDragging) return;
    isDragging=false;
    remote.style.transition='';
    try{localStorage.setItem('remoteControlPos',JSON.stringify({left:remote.style.left,top:remote.style.top}));}catch(e){}
  }
  header.addEventListener('mousedown',startDrag);
  document.addEventListener('mousemove',drag);
  document.addEventListener('mouseup',stopDrag);
  header.addEventListener('touchstart',startDrag,{passive:false});
  document.addEventListener('touchmove',drag,{passive:false});
  document.addEventListener('touchend',stopDrag);
})();
</script>
