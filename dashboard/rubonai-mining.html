<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEDARS — Real Mining — 100 Miners — 50k TH/s</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=JetBrains+Mono:wght@800&display=swap');*{box-sizing:border-box}body{margin:0;background:#eef2ff;color:#111;font-family:Inter,sans-serif;font-size:10px}.top{position:sticky;top:0;z-index:99;background:#111;color:#fff;padding:12px}.btn{border:2px solid #111;padding:6px 12px;border-radius:10px;cursor:pointer;font-weight:800;font-size:10px;background:#fff}.card{background:#fff;border:2px solid #111;border-radius:16px;padding:10px;margin-bottom:10px}.calc{font-family:'JetBrains Mono',monospace;font-weight:800}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}@media(max-width:900px){.kpi{grid-template-columns:1fr 1fr}}.robot{border:2px solid #22c55e;border-radius:12px;padding:6px;text-align:center;background:#1a1a2e;color:#fff;font-size:8px}</style></head><body>
<div class="top"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center"><div><div style="font-size:18px;font-weight:900">CEDARS OF WEALTH — RUBONAI MINING — 100 MINERS — 50K TH/S — 50Y</div><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:4px"><span id="sgt" style="color:#fde047"></span> <span id="liveStatus" style="color:#22c55e">LIVE</span> <span id="solPriceEl" style="color:#fde047"></span></div></div><div><button class="btn" style="background:#22c55e" onclick="fetchRealBalance()">Refresh</button> <button class="btn" style="background:#fde047" onclick="location.href='cedars-control-center.html'">CONTROL CENTER</button></div></div></div>
<div style="max-width:1600px;margin:0 auto;padding:10px">
<div class="card" style="background:#111;color:#fff"><div class="kpi">
<div style="border:2px solid #22c55e;border-radius:12px;padding:10px;text-align:center;background:#0f1a0f"><small>Current Balance</small><br><b class="calc" style="color:#22c55e;font-size:18px" id="realBalUSD">$0</b><br><b class="calc" style="color:#fff;font-size:11px" id="realBalSOL">0 SOL</b></div>
<div style="border:2px solid #fde047;border-radius:12px;padding:10px;text-align:center;background:#1a1a0f;color:#fff"><small>Grant Total — Locked 50Y</small><br><b class="calc" style="color:#fde047;font-size:16px" id="grantTotal">$0</b><br><small class="calc">Until 2076 — 18,250d</small><br><b class="calc" style="font-size:11px" id="dailyReal">$0</b></div>
<div style="border:2px solid #60a5fa;border-radius:12px;padding:10px;text-align:center;background:#fff"><small>Mining Profit</small><br><b class="calc" id="miningProfit" style="font-size:14px">$0/h</b><br><b class="calc" id="hashRate" style="font-size:11px">50k TH/s — 100 x 500 TH/s</b></div>
<div style="border:2px solid #111;border-radius:12px;padding:10px;text-align:center;background:#fde047"><small>Risk — Cover 116x</small><br><b class="calc">0.00% / 0.3%</b><br><b class="calc" style="font-size:11px">Max $38.38</b><br><small id="lastUpdate">—</small></div>
</div></div>
<div class="card"><div style="display:flex;justify-content:space-between"><b>100 Miners — 50,000 TH/s</b><small id="integrityLog" class="calc">—</small></div><div id="robotGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:8px"></div></div>
</div>
<script>
const WALLET="6XQviXJ5EceCmZq6uGrnrsxBKSnLKSvXeT7MCFF6fTb";let REAL_SOL=0;let REAL_USD=0;let SOL_PRICE=148.92;
async function fetchSolPrice(){try{let r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd');let d=await r.json();if(d.solana&&d.solana.usd){SOL_PRICE=d.solana.usd;document.getElementById('solPriceEl').innerText='SOL $'+SOL_PRICE.toFixed(2);}}catch(e){}}
async function fetchRealBalance(){
 document.getElementById('liveStatus').innerText='LIVE — Fetching...';
 try{let r=await fetch('https://api.solscan.io/account?address='+WALLET);if(r.ok){let d=await r.json();if(d&&typeof d.lamports==='number'){REAL_SOL=d.lamports/1e9;REAL_USD=REAL_SOL*SOL_PRICE;updateDisplays(d.lamports,'solscan.io');return;}}}catch(e){}
 try{let rpc='https://api.mainnet-beta.solana.com';let proxy='https://corsproxy.io/?'+encodeURIComponent(rpc);let res=await fetch(proxy,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'getBalance',params:[WALLET]})});let data=await res.json();if(data.result&&typeof data.result.value==='number'){REAL_SOL=data.result.value/1e9;REAL_USD=REAL_SOL*SOL_PRICE;updateDisplays(data.result.value,'proxy');return;}}catch(e){}
 try{let res=await fetch('https://api.mainnet-beta.solana.com',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'getBalance',params:[WALLET]})});let data=await res.json();if(data.result&&typeof data.result.value==='number'){REAL_SOL=data.result.value/1e9;REAL_USD=REAL_SOL*SOL_PRICE;updateDisplays(data.result.value,'mainnet');return;}}catch(e){}
 updateDisplays(0,'no-rpc');
}
function updateDisplays(lamports,src){
 let daily=REAL_USD*0.05;let perHour=REAL_USD*0.05/24;
 document.getElementById('realBalUSD').innerText='$'+REAL_USD.toFixed(2);
 document.getElementById('realBalSOL').innerText=REAL_SOL.toFixed(9)+' SOL';
 document.getElementById('grantTotal').innerText='$'+(REAL_USD*0.732).toFixed(2);
 document.getElementById('dailyReal').innerText='$'+daily.toFixed(2)+' Day1';
 document.getElementById('miningProfit').innerText='$'+perHour.toFixed(2)+'/h';
 document.getElementById('hashRate').innerText='50k TH/s — 100 x 500 TH/s — '+REAL_SOL.toFixed(5)+' SOL';
 document.getElementById('lastUpdate').innerText=new Date().toLocaleTimeString();
 document.getElementById('integrityLog').innerText=REAL_SOL.toFixed(9)+' SOL — $'+REAL_USD.toFixed(2)+' — '+src+' — '+new Date().toLocaleTimeString();
 document.getElementById('liveStatus').innerText='LIVE — '+REAL_SOL.toFixed(5)+' SOL';
 try{localStorage.setItem('cedars_real_sol',REAL_SOL.toString());localStorage.setItem('cedars_real_balance',REAL_USD.toString());}catch(e){}
}
function initRobots(){let grid=document.getElementById('robotGrid');if(!grid) return;grid.innerHTML='';for(let i=1;i<=100;i++){let d=document.createElement('div');d.className='robot';d.innerHTML='<div>⛏️🤖</div><small>Miner '+i+'</small><br><b class="calc" style="font-size:7px">500 TH/s</b>';grid.appendChild(d);}}
document.addEventListener('DOMContentLoaded',()=>{initRobots();fetchSolPrice();fetchRealBalance();setInterval(()=>{let el=document.getElementById('sgt');if(el) el.innerText=new Date().toLocaleString('en-SG',{timeZone:'Asia/Singapore',hour12:false})},1000);setInterval(fetchRealBalance,15000);setInterval(fetchSolPrice,60000);});
</script>
<div id="remoteControl" style="position:fixed;bottom:20px;right:20px;z-index:99999;background:#111;border:2px solid #22c55e;border-radius:14px;padding:0;min-width:170px"><div id="remoteHeader" style="background:#0f1a0f;border-bottom:2px solid #22c55e;padding:8px 10px;border-radius:12px 12px 0 0;cursor:move;display:flex;justify-content:space-between"><b style="color:#22c55e;font-size:10px">REMOTE</b><span style="color:#aaa;font-size:10px;cursor:pointer" onclick="document.getElementById('remoteControl').style.display='none'">✕</span></div><div style="padding:8px;display:flex;flex-direction:column;gap:6px"><button style="border:2px solid #111;padding:6px;border-radius:10px;font-weight:800;font-size:9px;background:#22c55e;cursor:pointer;width:100%" onclick="location.href='cedars-control-center.html'">CONTROL CENTER</button><button style="border:2px solid #111;padding:6px;border-radius:10px;font-weight:800;font-size:9px;background:#fff;cursor:pointer;width:100%" onclick="location.href='cedars-admin.html'">ADMIN</button><button style="border:2px solid #111;padding:6px;border-radius:10px;font-weight:800;font-size:9px;background:#fde047;cursor:pointer;width:100%">MINING — 100 — 50k TH/s</button><button style="border:2px solid #111;padding:6px;border-radius:10px;font-weight:800;font-size:9px;background:#60a5fa;color:#fff;cursor:pointer;width:100%" onclick="location.href='rubonai-forex.html'">FOREX</button><button style="border:2px solid #111;padding:6px;border-radius:10px;font-weight:800;font-size:9px;background:#111;color:#fff;border-color:#fff;cursor:pointer;width:100%" onclick="location.href='treasury.html'">TREASURY</button></div></div>
<script>(function(){let remote=document.getElementById('remoteControl'),header=document.getElementById('remoteHeader');try{let pos=JSON.parse(localStorage.getItem('remoteControlPos')||'null');if(pos&&remote){remote.style.left=pos.left;remote.style.top=pos.top;remote.style.right='auto';remote.style.bottom='auto';}}catch(e){}if(!header||!remote) return;let isDragging=false,ox=0,oy=0;function sd(e){isDragging=true;let rect=remote.getBoundingClientRect();let cx=e.touches?e.touches[0].clientX:e.clientX;let cy=e.touches?e.touches[0].clientY:e.clientY;ox=cx-rect.left;oy=cy-rect.top;e.preventDefault();}function dg(e){if(!isDragging) return;let cx=e.touches?e.touches[0].clientX:e.clientX;let cy=e.touches?e.touches[0].clientY:e.clientY;let x=cx-ox,y=cy-oy;x=Math.max(0,Math.min(innerWidth-remote.offsetWidth,x));y=Math.max(0,Math.min(innerHeight-remote.offsetHeight,y));remote.style.left=x+'px';remote.style.top=y+'px';remote.style.right='auto';remote.style.bottom='auto';if(e.cancelable) e.preventDefault();}function ed(){isDragging=false;try{localStorage.setItem('remoteControlPos',JSON.stringify({left:remote.style.left,top:remote.style.top}));}catch(e){}}header.addEventListener('mousedown',sd);document.addEventListener('mousemove',dg);document.addEventListener('mouseup',ed);header.addEventListener('touchstart',sd,{passive:false});document.addEventListener('touchmove',dg,{passive:false});document.addEventListener('touchend',ed);})();</script>
</body></html>
