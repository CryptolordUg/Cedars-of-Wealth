<script>
const esMine = new EventSource('/api/signals/live?type=mining');
esMine.onmessage = e => {
  const d = JSON.parse(e.data);
  const h = document.getElementById('hashrate'); if(h) h.innerText = d.hashrate + ' TH/s';
  const p = document.getElementById('payout'); if(p) p.innerText = d.payout_btc + ' BTC';
};
</script>
