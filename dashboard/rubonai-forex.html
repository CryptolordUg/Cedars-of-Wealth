<script>
const esForex = new EventSource('/api/signals/live?type=forex');
esForex.onmessage = e => {
  const d = JSON.parse(e.data);
  const el = document.getElementById('price'); if(el) el.innerText = d.price;
  const s = document.getElementById('signal'); if(s) s.innerText = d.signal;
};
</script>
