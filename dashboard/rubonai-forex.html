<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEDARS 24/7 - Real Trading Ready</title>
<style>
body{background:#0a0e1a;color:#fff;font-family:Arial;padding:10px;margin:0}
.header{background:#111827;padding:15px;border-radius:10px;text-align:center;border:2px solid #f59e0b}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.card{background:#1f2937;padding:12px;border-radius:8px;text-align:center}
.price{color:#f59e0b;font-weight:bold;font-size:18px}
#feed{background:#000;height:320px;overflow-y:auto;padding:10px;border-radius:8px;font-family:monospace;font-size:12px}
.buy{color:#00ff88}.sell{color:#ff4444}.info{color:#888}
button{border:none;padding:12px;border-radius:8px;font-weight:bold;width:100%;margin:5px 0;cursor:pointer}
.sync{background:#f59e0b;color:#000}
.stop{background:#dc2626;color:#fff}
.risk{background:#1f2937;padding:10px;border-radius:8px;margin:10px 0;font-size:13px}
</style>
</head>
<body>
<div class="header">
<h2>CEDARS OF WEALTH - 24/7 LIVE</h2>
<div>Cloud: <span id="cloud">connecting...</span></div>
<div>Trading Enabled: <span id="tenabled">checking...</span></div>
<div>Mode: <span id="mode">STARTING</span></div>
<button class="sync" onclick="syncNow()">SYNC NOW</button>
<button class="stop" onclick="emergencyStop()">🛑 EMERGENCY STOP</button>
</div>
<div class="risk" id="riskBox">Risk: loading...</div>
<div class="grid" id="pairs"></div>
<div id="feed"></div>
<script>
const RENDER_URL = "https://cedars-24-7-server.onrender.com";
const PAIRS=[
{name:"EUR/USD",price:1.08},{name:"GBP/USD",price:1.26},
{name:"USD/JPY",price:150.79},{name:"XAU/USD",price:2320.64},
{name:"BTC/USD",price:67148.96},{name:"SOL/USD",price:174.40},
{name:"BOOM1000",price:1000}
];
let queue=[];
function render(){document.getElementById('pairs').innerHTML=PAIRS.map(p=>`<div class="card"><div>${p.name}</div><div class="price">${p.price.toFixed(4)}</div></div>`).join('');}
render();
function log(m,c=''){let d=document.createElement('div');if(c)d.className=c;d.textContent=new Date().toLocaleTimeString()+' '+m;document.getElementById('feed').prepend(d);}
async function checkCloud(){
 try{
  let r=await fetch(RENDER_URL+'/status'); let j=await r.json();
  document.getElementById('cloud').textContent='ONLINE 24/7 - Trades:'+j.trades;
  document.getElementById('tenabled').textContent=j.trading_enabled?'TRUE - LIVE':'FALSE - SAFE BLOCKED';
  document.getElementById('tenabled').style.color=j.trading_enabled?'#00ff88':'#ff4444';
  document.getElementById('mode').textContent=j.trading_enabled?'LIVE TRADING':'SAFE MODE - SIGNALS BLOCKED';
  document.getElementById('riskBox').innerHTML=`Risk per trade: ${j.risk.maxRiskPerTradePct}% | Daily max loss: ${j.risk.maxDailyLossPct}% | Open: ${j.openPositions}/${j.risk.maxOpenPositions} | Daily Loss: ${j.dailyLoss}%`;
  let f=await fetch(RENDER_URL+'/feed'); let logs=await f.json();
  document.getElementById('feed').innerHTML=''; logs.forEach(l=>log(l.msg,l.type));
  if(queue.length>0){ await syncNow(); }
 }catch(e){
  document.getElementById('cloud').textContent='OFFLINE - Local Brain Active';
  document.getElementById('mode').textContent='OFFLINE BRAIN - Queuing';
  let p=PAIRS[Math.floor(Math.random()*PAIRS.length)];
  if(Math.random()>0.7){
   let action=Math.random()>0.5?'BUY':'SELL';
   let tx='TX'+Math.random().toString(36).slice(2,10).toUpperCase();
   queue.push({pair:p.name,action,tx,time:Date.now()});
   log(`QUEUED OFFLINE ${action} ${p.name} | ${tx}`,action==='BUY'?'buy':'sell');
   try{localStorage.setItem('cedars_queue',JSON.stringify(queue));}catch(_){}
  }
 }
}
async function syncNow(){
 if(queue.length===0){log('Nothing to sync','info');return;}
 try{await fetch(RENDER_URL+'/sync',{method:'POST'});log(`Synced ${queue.length} offline trades`,'info');queue=[];localStorage.removeItem('cedars_queue');}
 catch(e){log('Sync failed - still offline','info');}
}
async function emergencyStop(){
 if(!confirm('EMERGENCY STOP? This halts new signals.'))return;
 try{await fetch(RENDER_URL+'/emergency-stop',{method:'POST'});log('EMERGENCY STOP SENT','sell');alert('Stop sent. Set TRADING_ENABLED=false in Render to lock.');}
 catch(e){alert('Failed - stop Render service manually in dashboard');}
}
try{queue=JSON.parse(localStorage.getItem('cedars_queue')||'[]');}catch(_){}
log('Cedars 24/7 Real Trading Ready. Kill-switch active.','info');
setInterval(checkCloud,3000);checkCloud();
</script>
</body>
</html>
