<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEDARS OF WEALTH - AAPL 360</title>
<script src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"></script>
<style>
body{background:#0a0e1a;color:#fff;font-family:Arial;margin:0;padding:10px}
.header{text-align:center;padding:15px;background:#111827;border-radius:10px;margin-bottom:10px}
.stats{display:flex;gap:10px;margin:10px 0}
.card{flex:1;background:#1f2937;padding:12px;border-radius:8px;text-align:center}
#tv{height:400px;margin:10px 0}
#feed{background:#000;height:200px;overflow-y:auto;padding:10px;border-radius:8px;font-family:monospace;font-size:12px}
.buy{color:#00ff88} .sell{color:#ff4444}
button{background:#f59e0b;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;width:100%;margin:5px 0}
</style>
</head>
<body>
<div class="header">
<h2>CEDARS OF WEALTH - AAPL 360</h2>
<p>NASDAQ:AAPL • 1s Scalper • Live</p>
</div>

<div class="stats">
<div class="card"><div>WALLET</div><div id="bal">$10,000</div></div>
<div class="card"><div>PnL</div><div id="pnl">$0</div></div>
<div class="card"><div>TRADES</div><div id="cnt">0</div></div>
</div>

<div id="tv"></div>
<script>
new TradingView.widget({"container_id":"tv","symbol":"NASDAQ:AAPL","interval":"1","theme":"dark","style":"1","width":"100%","height":400});
</script>

<button onclick="toggle()">START / STOP SCANNER</button>
<div id="feed"></div>

<script>
let running=false, timer=null, greens=0, reds=0, trades=0;
function addLog(msg, cls=''){
  let d=document.createElement('div'); if(cls) d.className=cls;
  d.textContent=msg; let f=document.getElementById('feed');
  f.prepend(d);
}
function scan(){
  let isGreen = Math.random() > 0.5;
  if(isGreen){ greens++; reds=0; } else { reds++; greens=0; }
  let now = new Date().toLocaleTimeString();
  if(greens>=3){
    let tx='TX'+Math.random().toString(36).slice(2,10).toUpperCase();
    addLog(now+' - BUY AAPL 1s @ market | '+tx,'buy');
    trades++; document.getElementById('cnt').textContent=trades;
    greens=0;
  } else if(reds>=3){
    let tx='TX'+Math.random().toString(36).slice(2,10).toUpperCase();
    addLog(now+' - SELL AAPL 1s @ market | '+tx,'sell');
    trades++; document.getElementById('cnt').textContent=trades;
    reds=0;
  } else {
    addLog(now+' - Scanning AAPL 1s... no signal');
  }
}
function toggle(){
  running=!running;
  if(running){ timer=setInterval(scan,1000); addLog('Scanner started...'); }
  else { clearInterval(timer); addLog('Scanner stopped.'); }
}
addLog('AAPL 360 ready. Press START.');
</script>
</body>
</html>
