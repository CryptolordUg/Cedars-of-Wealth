<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEDARS OF WEALTH - FOREX BOOM 24/7</title>
<style>
body{background:#0a0e1a;color:#fff;font-family:Arial;margin:0;padding:10px}
.header{text-align:center;padding:15px;background:#111827;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.card{background:#1f2937;padding:12px;border-radius:8px;text-align:center}
.price{font-size:18px;font-weight:bold;color:#f59e0b}
#feed{background:#000;height:260px;overflow-y:auto;padding:10px;border-radius:8px;font-family:monospace;font-size:12px;margin-top:10px}
.buy{color:#00ff88}.sell{color:#ff4444}.info{color:#aaa}
button{background:#f59e0b;border:none;padding:12px;border-radius:8px;font-weight:bold;width:100%;margin:5px 0;cursor:pointer}
.walletbtn{background:#2563eb;color:white}
</style>
</head>
<body>
<div class="header">
<h2>CEDARS OF WEALTH - FOREX BOOM 24/7</h2>
<p>Multi-Pair 1s Scalper • Online Cloud Ready</p>
<button class="walletbtn" onclick="connectWallet()">Connect Wallet</button>
<div id="waddr" style="font-size:12px;">Not connected</div>
</div>

<div class="grid" id="pairs"></div>

<div style="height:400px;margin-top:10px;">
<iframe src="https://s.tradingview.com/widgetembed/?symbol=OANDA:EURUSD&interval=1&theme=dark&style=1" style="width:100%;height:400px;border:0;"></iframe>
</div>

<button onclick="toggle()">START / STOP 24/7 SCANNER</button>
<div>Status: <span id="status">OFFLINE - Browser Only</span></div>
<div id="feed"></div>

<script>
const PAIRS = [
{name:"EUR/USD", price:1.08, sym:"EURUSD"},
{name:"GBP/USD", price:1.26, sym:"GBPUSD"},
{name:"USD/JPY", price:150.79, sym:"USDJPY"},
{name:"XAU/USD", price:2320.64, sym:"XAUUSD"},
{name:"BTC/USD", price:67148.96, sym:"BTCUSD"},
{name:"SOL/USD", price:174.40, sym:"SOLUSD"},
{name:"BOOM1000", price:1000, sym:"BOOM1000"}
];
let running=false, timer=null, trades=0;
let streaks = {};

PAIRS.forEach(p=>{ streaks[p.sym]={g:0,r:0}; });

function renderPairs(){
 let h='';
 PAIRS.forEach(p=>{
  h+=`<div class="card"><div>${p.name}</div><div class="price" id="p_${p.sym}">${p.price}</div><div style="font-size:11px;" id="s_${p.sym}">waiting</div></div>`;
 });
 document.getElementById('pairs').innerHTML=h;
}
renderPairs();

function addLog(m,c=''){let d=document.createElement('div');if(c)d.className=c;d.textContent=m;document.getElementById('feed').prepend(d);}

function updatePrices(){
 PAIRS.forEach(p=>{
  let change = (Math.random()-0.5)*0.002 * p.price;
  p.price += change;
  let el=document.getElementById('p_'+p.sym);
  if(el) el.textContent = p.price.toFixed(p.price<5?4:2);
 });
}

function scanAll(){
 updatePrices();
 let now=new Date().toLocaleTimeString();
 PAIRS.forEach(p=>{
  let isGreen=Math.random()>0.5;
  let st=streaks[p.sym];
  if(isGreen){st.g++;st.r=0;}else{st.r++;st.g=0;}
  let sigEl=document.getElementById('s_'+p.sym);
  if(st.g>=3){
   let tx='TX'+Math.random().toString(36).slice(2,8).toUpperCase();
   addLog(`${now} - BUY ${p.name} 1s | ${tx}`,'buy');
   if(sigEl){sigEl.textContent='BUY SIGNAL';sigEl.style.color='#00ff88';}
   trades++; st.g=0;
  } else if(st.r>=3){
   let tx='TX'+Math.random().toString(36).slice(2,8).toUpperCase();
   addLog(`${now} - SELL ${p.name} 1s | ${tx}`,'sell');
   if(sigEl){sigEl.textContent='SELL SIGNAL';sigEl.style.color='#ff4444';}
   trades++; st.r=0;
  } else {
   if(sigEl){sigEl.textContent=`scanning... ${st.g}G/${st.r}R`;sigEl.style.color='#aaa';}
  }
 });
 // offline cache
 try{ localStorage.setItem('cedars_last', JSON.stringify({time:Date.now(), trades})); }catch(e){}
}

function toggle(){
 running=!running;
 document.getElementById('status').textContent = running? 'ONLINE - Scanning 1s (browser)' : 'OFFLINE - Paused, showing cached';
 if(running){ timer=setInterval(scanAll,1000); addLog('24/7 Scanner started - SIMULATION. For true 24/7 with laptop off, deploy to Render.','info'); }
 else{ clearInterval(timer); addLog('Scanner paused. Cached data kept for offline view.','info'); }
}

async function connectWallet(){
 if(window.ethereum){ try{let a=await window.ethereum.request({method:'eth_requestAccounts'}); document.getElementById('waddr').textContent='Connected: '+a[0].slice(0,6)+'...'+a[0].slice(-4);}catch(e){} }
 else{alert('Install MetaMask');}
}

// offline load
try{
 let last=JSON.parse(localStorage.getItem('cedars_last')||'null');
 if(last){ addLog('Loaded offline cache from '+new Date(last.time).toLocaleString(),'info'); }
}catch(e){}
addLog('FOREX BOOM 24/7 ready. Press START. Simulation only.','info');
</script>
</body>
</html>
