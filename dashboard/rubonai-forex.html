<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEDARS 24/7 - $1 Real Ready</title>
<style>
body{background:#0a0e1a;color:#fff;font-family:Arial;padding:10px;margin:0}
.header{background:#111827;padding:15px;border-radius:10px;text-align:center;border:2px solid #f59e0b}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.card{background:#1f2937;padding:12px;border-radius:8px;text-align:center}
.price{color:#f59e0b;font-weight:bold;font-size:18px}
#feed{background:#000;height:300px;overflow-y:auto;padding:10px;border-radius:8px;font-family:monospace;font-size:12px}
.buy{color:#00ff88}.sell{color:#ff4444}.info{color:#888}
button{border:none;padding:12px;border-radius:8px;font-weight:bold;width:100%;margin:5px 0;cursor:pointer}
.sync{background:#f59e0b;color:#000}.stop{background:#dc2626;color:#fff}
.risk{background:#1f2937;padding:10px;border-radius:8px;margin:10px 0;font-size:13px}
</style>
</head>
<body>
<div class="header">
<h2>CEDARS OF WEALTH - 24/7</h2>
<div>Cloud: <span id="cloud">connecting...</span></div>
<div>Deriv: <span id="deriv">checking...</span> | Balance: <span id="bal">-</span></div>
<div>Trading: <span id="tenabled">checking...</span></div>
<button class="sync" onclick="syncNow()">SYNC NOW</button>
<button class="stop" onclick="emergencyStop()">🛑 EMERGENCY STOP</button>
</div>
<div class="risk">Account $1 Test | Max risk $0.01/trade | Daily stop $0.03 | Max 3 positions | Kill-switch: TRADING_ENABLED=false in Render</div>
<div class="grid" id="pairs"></div>
<div id="feed"></div>
<script>
const RENDER_URL = "https://cedars-24-7-server.onrender.com";
const PAIRS=[{name:"EUR/USD",price:1.08},{name:"GBP/USD",price:1.26},{name:"USD/JPY",price:150.79},{name:"XAU/USD",price:2320.64},{name:"BTC/USD",price:67148.96},{name:"BOOM1000",price:1000}];
function render(){document.getElementById('pairs').innerHTML=PAIRS.map(p=>`<div class="card"><div>${p.name}</div><div class="price">${p.price.toFixed(2)}</div></div>`).join('');}
render();
function log(m,c=''){let d=document.createElement('div');if(c)d.className=c;d.textContent=new Date().toLocaleTimeString()+' '+m;document.getElementById('feed').prepend(d);}
async function check(){
 try{
  let r=await fetch(RENDER_URL+'/status'); let j=await r.json();
  document.getElementById('cloud').textContent='ONLINE 24/7';
  document.getElementById('deriv').textContent=j.deriv_connected?'CONNECTED':'NOT CONNECTED';
  document.getElementById('bal').textContent=j.balance??'-';
  document.getElementById('tenabled').textContent=j.trading_enabled?'TRUE':'FALSE - SAFE';
  let f=await fetch(RENDER_URL+'/feed'); let logs=await f.json();
  document.getElementById('feed').innerHTML=''; logs.forEach(l=>log(l.msg,l.type));
 }catch(e){ document.getElementById('cloud').textContent='OFFLINE - Local only'; }
}
async function syncNow(){ log('Sync check','info'); check(); }
async function emergencyStop(){ if(!confirm('Stop?'))return; try{await fetch(RENDER_URL+'/emergency-stop',{method:'POST'}); log('STOP SENT','sell');}catch(e){alert('Go to Render dashboard and Suspend service manually');} }
log('Ready. Replace RENDER_URL with your real Render URL then Commit again.','info');
setInterval(check,4000); check();
</script>
</body>
</html>
