<!DOCTYPE html>
<html>
<head><title>Cedars Bridge V17.1 REAL LIVE</title></head>
<body style="background:#000;color:#0f0;text-align:center;padding:50px">
<h1>V17.1 REAL LIVE - Volatility 100</h1>
<button onclick="trade('BUY')" style="padding:20px;background:green;color:white;font-size:20px">BUY CALL $1</button>
<button onclick="trade('SELL')" style="padding:20px;background:red;color:white;font-size:20px">SELL PUT $1</button>
<p id="status"></p>
<script>
async function trade(action){
 document.getElementById('status').innerText='Trading...';
 let res = await fetch('https://cedars-bridge.onrender.com/webhook',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body: JSON.stringify({action:action, market:'R_100', amount:1, duration:5})
 });
 let data = await res.json();
 document.getElementById('status').innerText=JSON.stringify(data);
}
</script>
</body>
</html>
