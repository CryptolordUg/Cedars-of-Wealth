<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CEDARS COMMAND CENTER</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#fff;font-family:Arial;padding:15px}
h1{color:#f5c518;text-align:center}
.card{background:#101010;border:2px solid #f5c518;border-radius:15px;padding:20px;margin:15px 0}
input,textarea{width:100%;padding:14px;margin:10px 0;border-radius:10px;background:#000;color:#fff;border:1px solid #f5c518;font-size:16px}
button{width:100%;padding:16px;margin:8px 0;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
.btn-gold{background:#f5c518;color:#000}
.btn-black{background:#000;color:#f5c518;border:1px solid #f5c518}
#tgStatus{margin-top:15px;padding:10px;border-radius:8px;font-weight:bold}
.ok{background:#0f2e0f;color:#00ff00}
.err{background:#2e0f0f;color:#ff4444}
</style>
</head>
<body>

<h1>🌲 CEDARS COMMAND CENTER</h1>
<p style="text-align:center;color:#888;">Vault: 6XQviXJ5EceCmZq6uGrnrsxBKSnLKSvXeT7MCFF6fTb<br>Bot: @cedars_6XQvi_720_bot</p>

<div class="card">
<h3 style="color:#f5c518;">📊 LIVE DEPOSITS — Auto 10s</h3>
<div id="deposits" style="color:#aaa;">Scanning chain...</div>
</div>

<div class="card">
<h2 style="color:#f5c518;">📡 CHANNEL MESSENGER</h2>

<label style="color:#888;">Your Channel @username</label>
<input id="tgChatId" value="@YOUR_CHANNEL" placeholder="@your_channel_name">

<label style="color:#888;">Message</label>
<textarea id="tgMessage" rows="6">🌲 CEDARS OF WEALTH — VAULT OPEN 💰

Vault: 6XQviXJ5EceCmZq6uGrnrsxBKSnLKSvXeT7MCFF6fTb

1️⃣ Send SOL to vault
2️⃣ Verify: https://cryptolordug.github.io/Cedars-of-Wealth/dashboard/verify.html
3️⃣ Auto-unlock Dashboard

Bot: @cedars_6XQvi_720_bot</textarea>

<button class="btn-gold" onclick="sendTgMessage()">🚀 SEND TO CHANNEL</button>
<button class="btn-black" onclick="sendPoster()">🖼️ SEND POSTER + QR</button>

<div id="tgStatus"></div>
</div>

<script>
// >>> PASTE NEW TOKEN HERE <<<
const BOT_TOKEN = "PUT_NEW_TOKEN_HERE_FROM_BOTFATHER";

async function sendTgMessage(){
 let c=document.getElementById("tgChatId").value.trim();
 let m=document.getElementById("tgMessage").value.trim();
 let s=document.getElementById("tgStatus");
 if(!c.startsWith("@")){s.className="err"; s.innerHTML="❌ Channel must start with @"; return;}
 s.className=""; s.innerHTML="⏳ Sending via @cedars_6XQvi_720_bot...";
 try{
  let r=await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:c,text:m,parse_mode:"HTML"})});
  let d=await r.json();
  if(d.ok){s.className="ok"; s.innerHTML="✅ SENT TO "+c+" — Message ID: "+d.result.message_id;}
  else{s.className="err"; s.innerHTML="❌ "+d.description+" — Code: "+d.error_code;}
 }catch(e){s.className="err"; s.innerHTML="❌ Network: "+e.message;}
}

async function sendPoster(){
 let c=document.getElementById("tgChatId").value.trim();
 let s=document.getElementById("tgStatus");
 s.className=""; s.innerHTML="⏳ Sending poster...";
 try{
  let r=await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:c,photo:"https://api.qrserver.com/v1/create-qr-code/?size=800x800&data=6XQviXJ5EceCmZq6uGrnrsxBKSnLKSvXeT7MCFF6fTb",caption:"🌲 CEDARS OF WEALTH\n\nVault: 6XQviXJ5EceCmZq6uGrnrsxBKSnLKSvXeT7MCFF6fTb\n\nVerify & Unlock:\nhttps://cryptolordug.github.io/Cedars-of-Wealth/dashboard/verify.html"})});
  let d=await r.json();
  if(d.ok){s.className="ok"; s.innerHTML="✅ POSTER SENT TO "+c;}
  else{s.className="err"; s.innerHTML="❌ "+d.description;}
 }catch(e){s.className="err"; s.innerHTML="❌ "+e.message;}
}

async function loadDeposits(){
 try{
  let res=await fetch("https://api.mainnet-beta.solana.com",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method:"getSignaturesForAddress",params:["6XQviXJ5EceCmZq6uGrnrsxBKSnLKSvXeT7MCFF6fTb",{limit:5}]})});
  let data=await res.json();
  if(!data.result || data.result.length==0){document.getElementById("deposits").innerHTML="No deposits yet — vault empty"; return;}
  let html="";
  data.result.forEach(tx=>{html+=`<div style='padding:8px;border-bottom:1px solid #222;font-size:12px;'>${tx.signature.slice(0,30)}...<br>${new Date(tx.blockTime*1000).toLocaleString()}</div>`;});
  document.getElementById("deposits").innerHTML=html;
 }catch(e){document.getElementById("deposits").innerHTML="Chain loading error";}
}
loadDeposits(); setInterval(loadDeposits,10000);
</script>
</body>
</html>
