<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Cedars Account</title>
<style>body{font-family:sans-serif;padding:16px;background:#f6fbf6;max-width:600px;margin:0 auto}.card{background:#fff;padding:14px;margin:10px 0;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}a{color:#2e7d32;text-decoration:none;margin-right:12px}.stat{font-size:22px;font-weight:bold;color:#2e7d32}</style>
</head><body>
<h1>👤 My Cedars Account</h1>
<div class="card"><div>Total Invested</div><div class="stat" id="tInv">$0</div></div>
<div class="card"><div>Total Withdrawable</div><div class="stat" id="tWd">$0</div></div>
<div class="card"><h3>My Investments</h3><div id="list">Loading...</div></div>
<p><a href="packages.html">📦 Packages</a><a href="withdraw.html">💸 Withdraw</a></p>
<script>
let inv=JSON.parse(localStorage.getItem('cedars_inv')||'[]');
let tI=0,tW=0,html='';
if(!inv.length) html='No investments yet. <a href="packages.html">Start →</a>';
inv.forEach(v=>{
 let amt=parseFloat(v.amount); tI+=amt;
 let w=(amt*0.5/6 + amt*0.2/30);
 tW+=w;
 html+=`<div>• ${v.pkg} - $${amt} (${new Date(v.date).toLocaleDateString()})</div>`;
});
document.getElementById('tInv').textContent='$'+tI.toFixed(2);
document.getElementById('tWd').textContent='$'+tW.toFixed(2);
document.getElementById('list').innerHTML=html;
</script></body></html>
