<!DOCTYPE html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>RUBONAI REAL SOLANA TRADER</title>
<script src="https://unpkg.com/@solana/web3.js@1.87.6/lib/index.iife.min.js"></script>
</head><body style='background:#060a18;color:#fff;font-family:system-ui;padding:12px'>
<h3>🔴 REAL SOLANA TRADING - NO FAKE</h3>
<div style='background:#111a33;padding:12px;border-radius:12px;border:2px solid #ff3d00'>
<div>Real Wallet: <span id='wallet'>Not Connected</span></div>
<div>Real USDC: <span id='realBal'>0.00</span> | Real SOL for fee: <span id='solBal'>0.00</span></div>
<div id='status' style='color:#ffeb3b;margin-top:8px'>Status: Waiting Phantom</div>
</div>
<div style='background:#111a33;padding:12px;border-radius:12px;margin-top:10px'>
<button id='connect' style='width:100%;padding:12px;background:#9945ff;color:#fff;border:0;border-radius:10px;font-weight:900'>1. CONNECT PHANTOM REAL</button>
<button id='trade' style='width:100%;padding:12px;background:#00e676;color:#000;border:0;border-radius:10px;font-weight:900;margin-top:8px;display:none'>2. TRADE REAL $0.20 USDC -> SOL (Jupiter)</button>
<div id='txLink' style='margin-top:10px;font-size:11px;word-break:break-all'></div>
<div id='log' style='font-size:10px;margin-top:10px;background:#070b1a;padding:8px;height:120px;overflow:auto;font-family:monospace'>Log: Ready for REAL...</div>
</div>
<script>
let provider=null, pubKey=null;
const RPC='https://api.mainnet-beta.solana.com';
const connection = new solanaWeb3.Connection(RPC);
document.getElementById('connect').onclick=async()=>{
  try{
    if(!window.solana || !window.solana.isPhantom){ alert('Open this inside Phantom Browser!'); return; }
    provider = window.solana;
    const resp = await provider.connect();
    pubKey = resp.publicKey;
    document.getElementById('wallet').innerText = pubKey.toString().slice(0,6)+'...'+pubKey.toString().slice(-4);
    document.getElementById('status').innerText='Fetching real balances...';
    const solBal = await connection.getBalance(pubKey);
    document.getElementById('solBal').innerText=(solBal/1e9).toFixed(4)+' SOL';
    const USDC_MINT='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';
    const tokenAccounts = await connection.getParsedTokenAccountsByOwner(pubKey,{mint:new solanaWeb3.PublicKey(USDC_MINT)});
    let usdc=0; if(tokenAccounts.value.length>0){ usdc=tokenAccounts.value[0].account.data.parsed.info.tokenAmount.uiAmount; }
    document.getElementById('realBal').innerText='$'+usdc.toFixed(2);
    document.getElementById('status').innerText='✅ REAL Connected. Ready to trade real $0.20';
    document.getElementById('trade').style.display='block';
    log('Real USDC: $'+usdc+' | SOL: '+(solBal/1e9).toFixed(4));
  }catch(e){ log('Error: '+e.message); }
};
document.getElementById('trade').onclick=async()=>{
  if(!pubKey) return;
  try{
    log('🔴 Starting REAL Jupiter swap $0.20 USDC -> SOL...');
    document.getElementById('status').innerText='Getting real quote from Jupiter...';
    const quoteRes = await fetch('https://quote-api.jup.ag/v6/quote?inputMint=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v&outputMint=So11111111111111111111111111111111111111112&amount=200000&slippageBps=100');
    const quote = await quoteRes.json();
    const swapRes = await fetch('https://quote-api.jup.ag/v6/swap',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({quoteResponse:quote,userPublicKey:pubKey.toString(),wrapAndUnwrapSol:true})
    });
    const {swapTransaction} = await swapRes.json();
    const swapTxBuf = Uint8Array.from(atob(swapTransaction),c=>c.charCodeAt(0));
    const transaction = solanaWeb3.VersionedTransaction.deserialize(swapTxBuf);
    log('Please APPROVE in Phantom — REAL money...');
    const signed = await provider.signTransaction(transaction);
    const txid = await connection.sendTransaction(signed);
    log('Sent real tx: '+txid);
    document.getElementById('txLink').innerHTML='<a href="https://solscan.io/tx/'+txid+'" target="_blank" style="color:#00ff88">View REAL TX on Solscan: '+txid.slice(0,10)+'...</a>';
    await connection.confirmTransaction(txid);
    log('✅ CONFIRMED REAL!');
  }catch(e){ log('Trade failed: '+e.message); }
};
function log(m){ document.getElementById('log').innerHTML+='<br>'+new Date().toLocaleTimeString()+' '+m; }
</script>
</body></html>
