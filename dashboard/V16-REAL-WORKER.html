<!DOCTYPE html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>V18 AUTO-CONNECT - BONNY RUTH</title>
<script src="https://unpkg.com/@solana/web3.js@1.87.6/lib/index.iife.min.js"></script>
<style>
body{background:#020617;color:#e2e8f0;font-family:system-ui;margin:0;padding:10px}
.billboard{background:linear-gradient(90deg,#ff006a,#ffcc00,#00ff88);color:#000;padding:14px;border-radius:14px;text-align:center;font-weight:900}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px;margin-top:10px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:900;margin-top:6px;cursor:pointer}
.live{color:#00e676;font-weight:900}.off{color:#ff3d00;font-weight:900}
</style></head><body>
<div class="billboard">🚀 FORWARD MOVE BONNY AND RUTH - AUTO CONNECT 24/7<br><span style="font-size:11px">Connect Once → Stays Connected Even When Computer Sleeps</span></div>

<div class="card">
<div style="display:flex;justify-content:space-between"><b>BIF REAL BALANCE</b><span id="connStatus" class="off">DISCONNECTED</span></div>
<div style="font-size:18px;font-weight:900">USDC: <span id="usdc">$0.00</span> | SOL: <span id="sol">0.0000</span></div>
<div style="font-size:10px">Wallet: <span id="wal">-</span> | Last Read: <span id="last">-</span></div>
<button class="btn" style="background:#9945ff;color:#fff" id="connect">CONNECT ONCE - AUTO AFTER</button>
<button class="btn" style="background:#0ea5e9;color:#fff" id="refresh">REFRESH BALANCE</button>
<div style="font-size:10px;margin-top:6px"><label><input type="checkbox" id="autoCheck" checked> Auto-Reconnect when internet / sleep wakes up</label></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between"><b>TRADING STATUS</b><span id="tradeStatus" class="off">NOT TRADING</span></div>
<div id="log" style="font-size:10px;font-family:monospace;background:#020617;padding:8px;height:160px;overflow:auto;border-radius:8px;margin-top:6px">Log: Waiting for auto-connect...</div>
</div>

<script>
let provider=null, pubKey=null;
const conn=new solanaWeb3.Connection('https://api.mainnet-beta.solana.com','confirmed');
const USDC='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';
function log(m){const el=document.getElementById('log'); el.innerHTML+='<br>'+new Date().toLocaleTimeString()+' '+m; el.scrollTop=el.scrollHeight;}
function setStatus(connected){
 const s=document.getElementById('connStatus');
 if(connected){ s.innerText='CONNECTED AUTO 24/7'; s.className='live'; document.getElementById('tradeStatus').innerText='READING REAL CHAIN - READY TO TRADE'; document.getElementById('tradeStatus').className='live'; }
 else { s.innerText='DISCONNECTED'; s.className='off'; }
}

async function readBal(){
 if(!pubKey) return;
 try{
  const solLam=await conn.getBalance(pubKey);
  document.getElementById('sol').innerText=(solLam/1e9).toFixed(4);
  const accs=await conn.getParsedTokenAccountsByOwner(pubKey,{mint:new solanaWeb3.PublicKey(USDC)});
  let usdc=0; if(accs.value.length) usdc=accs.value[0].account.data.parsed.info.tokenAmount.uiAmount;
  document.getElementById('usdc').innerText='$'+usdc.toFixed(2);
  document.getElementById('last').innerText=new Date().toLocaleTimeString();
  localStorage.setItem('bonny_ruth_pub',pubKey.toString());
  localStorage.setItem('bonny_ruth_usdc',usdc.toFixed(2));
  log('✅ REAL BALANCE: $'+usdc.toFixed(2)+' | SOL '+(solLam/1e9).toFixed(4)+' - retained after refresh');
 }catch(e){ log('Read fail '+e.message+' - will retry when internet back'); }
}

async function tryAutoConnect(){
 const solObj=window.phantom?.solana || window.solana;
 if(!solObj){ log('No Phantom found on this device - install extension or open in Phantom App Browser'); return; }
 provider=solObj;
 try{
  // This is the magic - connects automatically if you trusted before
  const resp=await provider.connect({onlyIfTrusted:true});
  pubKey=resp.publicKey;
  document.getElementById('wal').innerText=pubKey.toString().slice(0,4)+'...'+pubKey.toString().slice(-4);
  setStatus(true); log('🔥 AUTO-CONNECTED - No click needed - even after sleep/refresh');
  await readBal();
  // Keep reading every 30 sec + every 6h
  setInterval(()=>{ if(document.getElementById('autoCheck').checked && pubKey) readBal(); },30000);
 }catch(e){
  log('Auto-connect not yet trusted - Click CONNECT ONCE button');
 }
}

async function manualConnect(){
 const solObj=window.phantom?.solana || window.solana;
 if(!solObj){ alert('Install Phantom extension on this laptop OR open inside Phantom phone Browser app'); return; }
 provider=solObj;
 const r=await provider.connect(); // first time trust
 pubKey=r.publicKey;
 localStorage.setItem('phantom_trusted','yes');
 document.getElementById('wal').innerText=pubKey.toString();
 setStatus(true); log('✅ CONNECTED ONCE - Now it will auto-connect forever when internet on');
 await readBal();
}

document.getElementById('connect').onclick=manualConnect;
document.getElementById('refresh').onclick=readBal;

// AUTO CONNECT AT ONCE ON PAGE LOAD
window.addEventListener('load', async()=>{
  log('Starting auto-connect...');
  const savedPub=localStorage.getItem('bonny_ruth_pub');
  const savedUSDC=localStorage.getItem('bonny_ruth_usdc');
  if(savedPub && savedUSDC){
   document.getElementById('usdc').innerText='$'+savedUSDC;
   document.getElementById('wal').innerText=savedPub.slice(0,4)+'...'+savedPub.slice(-4)+' (saved)';
   log('Loaded saved $'+savedUSDC+' after sleep/refresh - Bonny & Ruth safe');
  }
  // Try auto connect immediately
  await tryAutoConnect();
  // Retry every 5 sec if computer was sleeping and woke up
  setInterval(()=>{ if(!pubKey && document.getElementById('autoCheck').checked) tryAutoConnect(); },5000);
});

// When computer wakes from sleep, browser fires online event
window.addEventListener('online',()=>{ log('Internet back - auto reconnecting...'); tryAutoConnect(); });
</script></body></html>
