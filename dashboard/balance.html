<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balance</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet"><style>:root{--b:#102A43;--g:#FFD700}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#F8F9FA;padding-top:68px}.top{position:fixed;top:0;left:0;right:0;background:#102A43;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:9999;border-bottom:2px solid #FFD700}.logo{font-size:28px;font-weight:900;color:#fff;text-shadow:0 0 10px #FFD700}.logo span{color:#FFD700}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,215,0,.3)}.nav a.active{background:#FFD700;color:#102A43}.wrap{max-width:900px;margin:0 auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin-top:14px;text-align:center}.bal{font-size:40px;font-weight:900;color:#102A43}.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.clock div{background:#102A43;color:#fff;padding:10px;border-radius:10px;border:1px solid #FFD700}.clock b{font-size:18px;display:block;color:#FFD700}.btn{display:block;width:100%;padding:14px;background:#102A43;color:#fff;text-align:center;text-decoration:none;border-radius:8px;font-weight:700;margin-top:10px}.btn-g{background:#FFD700;color:#102A43}footer{text-align:center;padding:16px;font-size:10px;color:#666}@media(max-width:700px){.top{flex-direction:column;gap:6px}body{padding-top:100px}}</style></head><body><div class="top"><div class="logo">🌲 CEDARS <span>OF WEALTH</span></div><div class="nav"><a href="../index.html">Home</a><a href="balance.html" class="active">Balance</a><a href="deposit.html">Deposit</a><a href="withdraw.html">Withdraw</a><a href="referral.html">Referral</a><a href="#" onclick="localStorage.clear();location.href='../login.html'" style="background:#8b0000">Sign Out</a></div></div><div class="wrap"><div class="card"><div class="bal" id="bal">$0.00</div><div class="clock"><div><b id="d">0</b>Days</div><div><b id="h">0</b>Hrs</div><div><b id="m">0</b>Min</div><div><b id="s">0</b>Sec</div></div><p style="font-size:11px;color:#666;margin-top:8px">720 Days</p></div><div class="card"><a href="deposit.html" class="btn btn-g">Deposit</a><a href="withdraw.html" class="btn">Withdraw</a></div></div><footer>© CEDARS OF WEALTH</footer><script>function getBal(){let deps=JSON.parse(localStorage.getItem('cedar_deposits')||'[]');let withs=JSON.parse(localStorage.getItem('cedar_withdraws')||'[]');let t=0;deps.forEach(x=>{if(x.status==='approved')t+=parseFloat(x.amount)});withs.forEach(x=>{if(x.status!=='rejected')t-=parseFloat(x.amount)});return t<0?0:t}function load(){document.getElementById('bal').innerText='$'+getBal().toFixed(2);let start=localStorage.getItem('cedar_contract_start');if(!start){let deps=JSON.parse(localStorage.getItem('cedar_deposits')||'[]');let f=deps.find(x=>x.status==='approved');if(f){start=Date.now();localStorage.setItem('cedar_contract_start',start)}}if(start){let end=parseInt(start)+720*24*60*60*1000;let diff=end-Date.now();if(diff<0)diff=0;document.getElementById('d').innerText=Math.floor(diff/(1000*60*60*24));document.getElementById('h').innerText=Math.floor((diff%(1000*60*60*24))/(1000*60*60));document.getElementById('m').innerText=Math.floor((diff%(1000*60*60))/(1000*60));document.getElementById('s').innerText=Math.floor((diff%(1000*60))/1000);}}load();setInterval(load,1000);</script></body></html>
