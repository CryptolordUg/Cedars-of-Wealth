<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balance - Military Vault</title><style>body{margin:0;background:#040804;color:#e8e9d8;font-family:Arial} .top{padding:14px 20px;background:#070d07;border-bottom:1px solid #1f351f;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0} .logo{color:#c8b07a;font-weight:900;font-size:12px} .wrap{max-width:520px;margin:30px auto;padding:0 18px} .card{background:#0a120a;border:1px solid #1f351f;border-radius:14px;padding:24px;text-align:center} .amt{font-size:44px;font-weight:900;margin:12px 0;color:#fff} .live{font-size:8px;color:#a8c686;background:#112011;padding:4px 8px;border-radius:20px;display:inline-block} .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px} .btn{padding:12px;border-radius:8px;text-decoration:none;font-size:10px;font-weight:800;text-align:center;display:block} .g{background:linear-gradient(90deg,#7a9a4a,#a8c686);color:#000} .o{border:1px solid #2a4a2a;color:#a8c686} .info{margin-top:16px;text-align:left;background:#080d08;border:1px solid #121e12;border-radius:8px;padding:12px;font-size:9px;color:#6a7a5a;line-height:1.7}</style></head><body>
<div class="top"><div class="logo">🌲 CEDARS • MILITARY VAULT</div><div><a href="../index.html" style="color:#5a6a4a;font-size:10px;text-decoration:none">HOME</a> <a href="#" onclick="localStorage.removeItem('cedar_login');location.href='../login.html'" style="color:#a8c686;font-size:10px;margin-left:10px;text-decoration:none">LOGOUT</a></div></div>
<div class="wrap"><div class="card"><span class="live">● LIVE REAL BALANCE</span><div class="amt" id="bal">$0.00</div><div style="font-size:10px;color:#5a6a4a;letter-spacing:1px">AVAILABLE • DEEP SHINY MILITARY VAULT</div><div class="grid"><a href="deposit.html" class="btn g">DEPOSIT</a><a href="withdraw.html" class="btn o">WITHDRAW</a><a href="referral.html" class="btn o">REFERRAL</a></div><div class="info" id="hist">Loading real data...</div></div></div>
<script>
if(localStorage.getItem('cedar_login')!='1')location.href='../login.html';
let user=JSON.parse(localStorage.getItem('cedar_user')||'{"bal":100}');
let deposits=JSON.parse(localStorage.getItem('cedar_deposits')||'[]');
let total=parseFloat(user.bal||100);
deposits.forEach(d=>{if(d.status=='approved') total+=parseFloat(d.amount||0)});
document.getElementById('bal').innerText='$'+total.toFixed(2);
let h='REAL ACCOUNT<br>• Initial Vault: $100.00<br>';
if(deposits.length==0) h+='• No deposits yet<br>• Deposit to see real growth';
else deposits.forEach(d=>{h+=`• ${d.date||'Today'}: $${d.amount} — ${d.status}<br>`});
h+='<br>✓ Clean • Neat • Real Reading';
document.getElementById('hist').innerHTML=h;
</script></body></html>
