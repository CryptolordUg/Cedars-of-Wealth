<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balance — Cedars of Wealth</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet"><style>:root{--b:#102A43;--g:#a8c686}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#F8F9FA;padding-top:72px}.top{position:fixed;top:0;left:0;right:0;background:#102A43;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:999}.logo{color:#fff;font-weight:700}.logo span{color:#a8c686}.nav a{color:#fff;text-decoration:none;margin-left:8px;font-size:13px;font-weight:600;padding:8px 12px;background:rgba(255,255,255,.1);border-radius:6px}.nav a.active{background:#a8c686;color:#102A43}.wrap{max-width:900px;margin:0 auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px;margin-top:16px;text-align:center}.bal{font-size:42px;font-weight:700;color:#102A43}.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.clock div{background:#102A43;color:#fff;padding:12px;border-radius:10px}.clock b{font-size:20px;display:block}.btn{display:block;width:100%;padding:14px;background:#102A43;color:#fff;text-align:center;text-decoration:none;border-radius:8px;font-weight:600;margin-top:10px}.btn-g{background:#a8c686;color:#102A43}footer{text-align:center;padding:20px;font-size:11px;color:#666;margin-top:30px}@media(max-width:700px){.top{flex-direction:column;gap:8px}body{padding-top:110px}}</style></head><body><div class="top"><div class="logo">🌲 CEDARS <span>OF WEALTH</span></div><div class="nav"><a href="../index.html">Home</a><a href="balance.html" class="active">Balance</a><a href="deposit.html">Deposit</a><a href="withdraw.html">Withdraw</a><a href="referral.html">Referral</a><a href="#" onclick="localStorage.clear();location.href='../login.html'" style="background:#8b0000">Logout</a></div></div><div class="wrap"><div class="card"><h3>Balance</h3><div class="bal" id="bal">$0.00</div><div class="clock" id="clock"><div><b id="d">0</b>Days</div><div><b id="h">0</b>Hours</div><div><b id="m">0</b>Min</div><div><b id="s">0</b>Sec</div></div><p style="margin-top:10px;font-size:12px;color:#666">Contract: 720 Days</p></div><div class="card"><a href="deposit.html" class="btn btn-g">Deposit</a><a href="withdraw.html" class="btn">Withdraw</a></div></div><footer>© CEDARS OF WEALTH</footer><script>function getBal(){let deps=JSON.parse(localStorage.getItem('cedar_deposits')||'[]');let withs=JSON.parse(localStorage.getItem('cedar_withdraws')||'[]');let t=0;deps.forEach(x=>{if(x.status==='approved')t+=parseFloat(x.amount)});withs.forEach(x=>{if(x.status!=='rejected')t-=parseFloat(x.amount)});return t<0?0:t}function load(){document.getElementById('bal').innerText='$'+getBal().toFixed(2);let start=localStorage.getItem('cedar_contract_start');if(!start){let deps=JSON.parse(localStorage.getItem('cedar_deposits')||'[]');let first=deps.find(x=>x.status==='approved');if(first){start=Date.now();localStorage.setItem('cedar_contract_start',start)}}if(start){let end=parseInt(start)+720*24*60*60*1000;let now=Date.now();let diff=end-now;if(diff<0)diff=0;let days=Math.floor(diff/(1000*60*60*24));let hrs=Math.floor((diff%(1000*60*60*24))/(1000*60*60));let mins=Math.floor((diff%(1000*60*60))/(1000*60));let secs=Math.floor((diff%(1000*60))/1000);document.getElementById('d').innerText=days;document.getElementById('h').innerText=hrs;document.getElementById('m').innerText=mins;document.getElementById('s').innerText=secs;}}load();setInterval(load,1000);</script></body></html>
