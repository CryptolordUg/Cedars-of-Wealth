<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUBONAI V12 — Live Mining</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e1a;color:#e0e6f0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#ff8c00,#ff5500);padding:14px;text-align:center;font-weight:800;letter-spacing:1px;color:#fff}
.lock{background:linear-gradient(135deg,#e11d48,#be123c);color:#fff;text-align:center;padding:10px;font-weight:700;font-size:14px}
.wrap{max-width:900px;margin:0 auto;padding:20px}
.card{background:#131a2e;border:1px solid #1e2a4a;border-radius:16px;padding:20px;margin:16px 0}
.balance{font-size:42px;font-weight:800;color:#fff}
.label{color:#8b9bb4;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.wallet{font-family:monospace;background:#0a0e1a;padding:10px;border-radius:8px;word-break:break-all;color:#4ade80;font-size:13px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.stat{background:#0a0e1a;border-radius:12px;padding:14px;text-align:center}
.stat b{font-size:20px;color:#fff;display:block}
.stat span{font-size:11px;color:#8b9bb4}
.workers{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:360px;overflow:auto;margin-top:12px}
.worker{background:#0a0e1a;border:1px solid #1e2a4a;border-radius:10px;padding:10px;font-size:11px;font-family:monospace;cursor:pointer;transition:all.2s}
.worker:hover{border-color:#4ade80;transform:translateY(-2px);box-shadow:0 4px 12px rgba(74,222,128,.2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:6px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 6px #4ade80}50%{opacity:.4;box-shadow:none}}
.hash{color:#8b9bb4}
.boosted{border-color:#facc15!important;background:#1a160a!important}
.btn{display:inline-block;background:#4ade80;color:#000;padding:10px 20px;border-radius:10px;font-weight:700;text-decoration:none;margin-top:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.live{color:#4ade80;font-size:12px;font-weight:700}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.balance{font-size:32px}}
</style></head><body>
<div class="header">RUBONAI MINING V12 FINAL LOCK</div>
<div class="lock">50YR IMMORTAL ACTIVE until 2076 — 10% LOCKED</div>
<div class="wrap">
<div class="card">
<div class="label">Live Balance</div>
<div class="balance"><span id="bal">—</span> <span style="font-size:20px;color:#8b9bb4">SOL</span></div>
<div style="color:#8b9bb4;font-size:12px;margin-top:6px" id="upd">connecting...</div>
<div class="wallet">6XQviXJ5EceCmZq6uGrnrsxBKSnLKSvXeT7MCFF6fTb</div>
<div class="stats">
<div class="stat"><b>100</b><span>Workers</span></div>
<div class="stat"><b>150</b><span>SOL Target</span></div>
<div class="stat"><b id="th">50k</b><span>TH/s</span></div>
<div class="stat"><b>SOL</b><span>Coin</span></div>
</div>
<a class="btn" href="https://solscan.io/account/6XQviXJ5EceCmZq6uGrnrsxBKSnLKSvXeT7MCFF6fTb#transfers">View on Solscan</a>
</div>
<div class="card">
<div class="topbar"><div class="label">100 Workers Live</div><div class="live">● ALL SYSTEMS GO</div></div>
<div class="workers" id="workers"></div>
<div style="color:#8b9bb4;font-size:11px;margin-top:10px">Tap any worker to boost • Hash flickers live</div>
</div>
</div>
<script>
let hashes=Array(100).fill(500);
function renderWorkers(){
 let h="";
 for(let i=0;i<100;i++){
  let n=("00"+(i+1)).slice(-3);
  h+='<div class="worker" id="w'+i+'" onclick="boost('+i+')"><span class="dot"></span>Worker '+n+'<br><span class="hash" id="h'+i+'">'+hashes[i]+' TH/s</span></div>';
 }
 document.getElementById("workers").innerHTML=h;
}
function boost(i){
 let el=document.getElementById("w"+i);
 el.classList.add("boosted");
 hashes[i]=750;
 document.getElementById("h"+i).innerText="750 TH/s ⚡ BOOSTED";
 setTimeout(()=>{el.classList.remove("boosted");hashes[i]=500;},3000);
}
setInterval(()=>{
 for(let i=0;i<100;i++){
  if(!document.getElementById("w"+i).classList.contains("boosted")){
   hashes[i]=480+Math.floor(Math.random()*40);
   let e=document.getElementById("h"+i);
   if(e) e.innerText=hashes[i]+" TH/s";
  }
 }
 let total=hashes.reduce((a,b)=>a+b,0);
 document.getElementById("th").innerText=(total/1000).toFixed(1)+"k";
},2000);
async function loadBal(){
 try{
  var r=await fetch("balance.json?t="+Date.now());
  var j=await r.json();
  document.getElementById("bal").innerText=j.sol.toFixed(4);
  document.getElementById("upd").innerText="updated "+j.updated+" • auto every 10m";
 }catch(e){
  document.getElementById("bal").innerText="0.0000";
  document.getElementById("upd").innerText="waiting for bot...";
 }
}
renderWorkers();loadBal();setInterval(loadBal,60000);
</script>
</body></html>
