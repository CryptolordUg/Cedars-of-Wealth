<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - Cedars of Wealth</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0a0f1e;color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:40px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin:20px 0}
.card{background:#131a2e;border:1px solid #1e2a4a;border-radius:12px;padding:24px}
.card h3{margin:0 0 8px;color:#a0b0cc;font-size:16px}
.card .val{font-size:28px;font-weight:800}
.risk{font-size:13px;color:#8a94ad;margin-top:20px}
</style>
</head>
<body>
<div id="site-header"></div>
<div class="wrap">
<h1>Dashboard</h1>
<div class="grid">
<div class="card"><h3>Total Portfolio Value</h3><div class="val">$0.00</div></div>
<div class="card"><h3>Total Deposited</h3><div class="val">$0.00</div></div>
<div class="card"><h3>Holdings</h3><div class="val">0 assets</div></div>
</div>
<p style="color:#a0b0cc">Track your holdings here. Connect your wallet to get started with educational portfolio tools.</p>
<div class="risk"><strong>Risk Disclosure:</strong> No returns are guaranteed. Values fluctuate with market. Educational use only, not financial advice.</div>
</div>
<div id="site-footer"></div>
<script src="/Cedars-of-Wealth/js/layout.js"></script>
</body>
</html>
