<script>
// CEDARS VERIFY LOCK — 360° Integrity
(function(){
 const v = localStorage.getItem("cedars_verified");
 const urlParams = new URLSearchParams(window.location.search);
 const verifiedSig = urlParams.get("verified");
 if(verifiedSig){
   // Coming from verify page — allow
   return;
 }
 if(!v){
   alert("🔒 Please verify deposit first — Redirecting to Verify Page");
   window.location.href="verify.html";
   return;
 }
 try{
   let data = JSON.parse(v);
   let age = Date.now() - data.time;
   // Expire after 7 days — user must re-verify
   if(age > 7*24*60*60*1000){
     localStorage.removeItem("cedars_verified");
     alert("Session expired — Please verify again");
     window.location.href="verify.html";
   }
 }catch(e){
   window.location.href="verify.html";
 }
})();
</script>
