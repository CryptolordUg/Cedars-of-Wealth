<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - CEDARS OF WEALTH</title>
<link rel="icon" href="data:image/svg+xml,[STRIPPED]">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0a0f1e;color:#fff;font-size:19px}
.wrap{max-width:1100px;margin:0 auto;padding:50px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:24px}
.card{background:#131a2e;border:1px solid #1e2a4a;border-radius:14px;padding:28px;text-align:center}
.card h3{font-size:20px;color:#8a9bb5;margin:0 0 12px}
.card .big{font-size:36px;font-weight:800}
button{padding:18px 28px;border:none;border-radius:10px;background:linear-gradient(135deg,#4f7cff,#2dd4a7);color:#fff !important;font-weight:800;font-size:18px;cursor:pointer;margin:8px}
</style>
</head>
<body>
<div id="site-header"></div>
<div class="wrap">
<h1 style="font-size:38px">Your Dashboard</h1>
<div class="grid">
<div class="card"><h3>Balance</h3><div class="big">$0.00</div></div>
<div class="card"><h3>Daily Earnings (2%)</h3><div class="big" style="color:#2dd4a7">$0.00</div></div>
<div class="card"><h3>Total Invested</h3><div class="big">$0.00</div></div>
</div>
<div style="text-align:center;margin-top:30px">
<button>Deposit</button>
<button>Withdraw</button>
</div>
</div>
<div id="site-footer"></div>
<script src="/Cedars-of-Wealth/js/layout.js"></script>
</body>
</html>
