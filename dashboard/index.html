<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cedars Deposit - KYC + Packages</title>
<style>
body{font-family:Arial;background:#0a0f1a;color:#fff;padding:16px;margin:0}
.card{background:#111a2e;border:1px solid #1e2d50;border-radius:12px;padding:16px;margin:12px auto;max-width:520px}
input,select{width:95%;padding:10px;margin:6px 0;border-radius:8px;border:none}
button{padding:12px 18px;background:#00c46a;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;width:100%;margin-top:10px}
.pkg{background:#fff;color:#111;border-radius:12px;padding:12px;margin:10px 0}
.tier{color:#2e7d32;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>
<div class="card" id="kycCard">
<h2>Step 1: Full KYC</h2>
<input id="fullname" placeholder="Full Legal Name">
<input id="dob" type="date">
<input id="country" placeholder="Country">
<select id="idtype"><option>ID Type</option><option>National ID</option><option>Passport</option><option>Driver License</option></select>
<input id="idnum" placeholder="ID Number">
<label>ID Photo</label><input type="file" id="idphoto">
<label>Selfie</label><input type="file" id="selfie">
<input id="phone" placeholder="Phone">
<input id="email" type="email" placeholder="Email">
<button onclick="goPackages()">Verify & Continue</button>
<p id="kycmsg"></p>
</div>

<div class="card hidden" id="pkgCard">
<h2>Step 2: Select Package</h2>
<p>50% Principal (6mo) | 25% Life Fund | 20% Reserve (30mo) | 5% Empire</p>
<div id="pkgs"></div>
</div>

<div class="card hidden" id="payCard">
<h2>Step 3: Deposit to Common Pool</h2>
<p id="selpkg"></p>
<p>All funds go to the central Cedars pool and are auto-distributed.</p>
<button onclick="pay()">Confirm Deposit</button>
<p id="paymsg"></p>
</div>

<script>
const packages=[
{t:"Seed",a:5,d:"$0.83/mo x6 | $1.25 Life"},
{t:"Sprout",a:25,d:"$4.17/mo x6 | $6.25 Life"},
{t:"Sapling",a:100,d:"$16.67/mo x6 | $25 Life"},
{t:"Cedar",a:500,d:"$83.33/mo x6 | $125 Life"},
{t:"Mighty Cedar",a:1000,d:"$166.67/mo x6 | $250 Life"},
{t:"Forest",a:5000,d:"$833.33/mo x6 | $1250 Life"},
{t:"Pro",a:10000,d:"$1666.67/mo x6 | $2500 Life"},
{t:"Empire",a:25000,d:"$4166.67/mo x6 | $6250 Life"},
{t:"Legacy",a:50000,d:"$8333.33/mo x6 | $12500 Life"},
{t:"Immortal",a:100000,d:"$16666.67/mo x6 | $25000 Life"}
];
let chosen=null;
function goPackages(){
 if(!fullname.value ||!idnum.value){kycmsg.innerText="Complete KYC to continue";return;}
 kycCard.classList.add("hidden"); pkgCard.classList.remove("hidden");
 pkgs.innerHTML=packages.map((p,i)=>`<div class="pkg"><h3>${i+1}. ${p.t} — $${p.a}</h3><p>${p.d}</p><button onclick="selectPkg(${i})">Invest $${p.a}</button></div>`).join("");
}
function selectPkg(i){
 chosen=packages[i]; pkgCard.classList.add("hidden"); payCard.classList.remove("hidden");
 selpkg.innerText=`${chosen.t} — $${chosen.a}`;
}
function pay(){
 paymsg.innerText=`Processing $${chosen.a} to Common Pool...`;
 setTimeout(()=>paymsg.innerText=`Success! $${chosen.a} added to pool for auto-distribution.`,1500);
}
</script>
</body>
</html>
