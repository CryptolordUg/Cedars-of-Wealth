<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - Cedars RubonAI</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0a0f1e;color:#fff;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:20px 15px}
.card{background:#131a2e;border:1px solid #1e2a4a;border-radius:12px;padding:20px;margin:16px 0}
h3{margin-top:0;color:#fff}
button{padding:10px 18px;background:#1a233f;color:#fff;border:1px solid #2a3a5a;border-radius:8px;cursor:pointer;margin:4px}
button:hover{background:#243152}
input,select{width:100%;padding:12px;background:#0a0f1e;border:1px solid #2a3a5a;color:#fff;border-radius:8px;margin:8px 0}
.upgrade-btn{width:100%;padding:14px;background:linear-gradient(135deg,#4f7cff,#2dd4a7);border:0;border-radius:8px;color:#fff;font-weight:700;margin-top:10px}
a{color:#4f7cff}
.muted{font-size:12px;color:#8a94ad}
</style>
