<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cedars Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#070E22;color:#fff;font-family:Inter,sans-serif;overflow-x:hidden}
.top{position:sticky;top:0;z-index:99;background:rgba(10,25,49,.96);backdrop-filter:blur(14px);border-bottom:2px solid #FFD700;overflow:hidden}
.top-main{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.top b{color:#fff;text-shadow:0 0 12px #FFD700,0 0 28px #FFD700,0 0 2px #fff;letter-spacing:.08em}
.live{font-family:JetBrains Mono;font-size:10px;color:#00FF88;border:1px solid #00FF8844;padding:5px 10px;border-radius:999px;background:#00FF8811}
.marquee{white-space:nowrap;overflow:hidden;border-top:1px solid #FFD70022;background:linear-gradient(90deg,#0A1931,#1A2F5A,#0A1931);padding:6px 0}
.track{display:inline-block;animation:scroll 120s linear infinite;font-family:Inter;font-weight:900;font-size:13px;letter-spacing:.25em;color:#fff;text-shadow:0 0 10px #FFD700,0 0 20px #FFD700,0 0 40px #FFD70088;filter:brightness(1.2)}
.track span{margin-right:28px;background:linear-gradient(180deg,#FFFFFF,#FFE9A3 45%,#FFD700 50%,#FFB800 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.wrap{max-width:1200px;margin:0 auto;padding:22px;display:grid;grid-template-columns:340px 1fr;gap:20px}
@media(max-width:980px){.wrap{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,#12264E,#0E1F3F);border:1px solid #1E3A6B;border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.gold{color:#FFD700}.mono{font-family:JetBrains Mono}
.tree{height:160px;background:radial-gradient(circle at 50% 20%,#FFD70022,transparent 70%);border-radius:18px;display:flex;align-items:center;justify-content:center}
.tree span{font-size:86px;filter:drop-shadow(0 0 22px #FFD700);transition:.6s}
.bar{height:10px;background:#0A1931;border-radius:999px;overflow:hidden;border:1px solid #1E3A6B}.fill{height:100%;width:32%;background:linear-gradient(90deg,#FFD700,#FFE55C);box-shadow:0 0 18px #FFD700;transition:.8s}
.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:900;cursor:pointer}.btn-gold{background:#FFD700;color:#0A1931;box-shadow:0 8px 24px #FFD70044}.btn-ghost{background:#0A1931;color:#fff;border:1px solid #1E3A6B}
.quest{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid #1E3A6B;border-radius:18px;margin-bottom:12px;background:#0B1E3C;cursor:pointer;transition:.2s}.quest:hover{transform:translateY(-2px);border-color:#FFD70066}.quest.done{opacity:.45;pointer-events:none}
.icon{width:52px;height:52px;border-radius:16px;background:#0A1931;border:1px solid #1E3A6B;display:flex;align-items:center;justify-content:center;font-size:26px}
.pill{font-size:10px;letter-spacing:.18em;padding:6px 10px;border-radius:999px;background:#0A1931;border:1px solid #FFD70033;color:#FFD700}
.badge{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:#00FF8811;border:1px solid #00FF8833;color:#00FF88;font-size:11px;font-family:JetBrains Mono}
.conf{position:fixed;pointer-events:none;inset:0;overflow:hidden;z-index:999}
</style>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()))}</script>
</head><body>
<div class="top">
<div class="top-main"><b>🌲 CEDARS OF WEALTH</b><div style="display:flex;gap:10px;align-items:center"><span class="live">● LIVE FOREST</span><a href="../index.html" style="color:#FFD700;text-decoration:none;font-weight:800">← Home</a></div></div>
<div class="marquee"><div class="track" id="track"></div></div>
</div>

<div class="wrap">
<div class="card">
<div class="tree"><span id="tree">🌲</span></div>
<div style="display:flex;justify-content:space-between;margin-top:14px"><span class="pill">LEVEL <span id="lvl">3</span> • CEDAR</span><span class="mono gold" id="xpTxt">320 / 1000 XP</span></div>
<div class="bar" style="margin-top:10px"><div class="fill" id="xpFill"></div></div>
<div style="margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="card" style="padding:14px"><small style="opacity:.6">Vault</small><div class="mono gold" style="font-size:22px" id="vault">$0.00</div></div>
<div class="card" style="padding:14px"><small style="opacity:.6">Streak</small><div class="mono gold" style="font-size:22px">🔥 7</div></div>
</div>
<button class="btn btn-gold" style="width:100%;margin-top:16px" onclick="grow()">🌱 GROW MY CEDAR +10 XP</button>
<button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="claim()">💰 Claim Vault</button>
</div>

<div class="card">
<h3 style="margin:0 0 14px 0">Today's Quests</h3>
<div class="quest" onclick="doQuest(this,100,0.80)"><div class="icon">🎙️</div><div style="flex:1"><b>Voice Spark</b><br><small style="opacity:.6">Say 1 word</small></div><span class="pill">+100 XP • $0.80</span></div>
<div class="quest" onclick="doQuest(this,150,1.00)"><div class="icon">🌍</div><div style="flex:1"><b>World Tag</b><br><small style="opacity:.6">Tag what you see</small></div><span class="pill">+150 XP • $1.00</span></div>
<div class="quest" onclick="doQuest(this,80,0.50)"><div class="icon">📡</div><div style="flex:1"><b>Mesh Ping</b><br><small style="opacity:.6">Ping the forest</small></div><span class="pill">+80 XP • $0.50</span></div>
<div class="quest" onclick="doQuest(this,200,1.20)"><div class="icon">🧩</div><div style="flex:1"><b>Seed Puzzle</b><br><small style="opacity:.6">Solve 20 sec</small></div><span class="pill">+200 XP • $1.20</span></div>
</div>
</div>
<div class="conf" id="conf"></div>
<script>
let xp=320,lvl=3,vault=0;
const t=document.getElementById('track');let html='';
for(let i=0;i<200;i++){html+='<span>🌲 CEDARS OF WEALTH ✨</span>'}t.innerHTML=html+html;
function grow(){addXP(10,0.10)}function addXP(x,d){xp+=x;vault+=d;if(xp>=1000){xp-=1000;lvl++;document.getElementById('tree').style.transform='scale('+(1+lvl*0.08)+')'}update();pop()}
function doQuest(el,x,d){el.classList.add('done');addXP(x,d)}
function claim(){if(vault<=0)return alert('Grow first!');alert('Claimed $'+vault.toFixed(2)+' — demo');vault=0;update()}
function update(){document.getElementById('lvl').innerText=lvl;document.getElementById('xpTxt').innerText=xp+' / 1000 XP';document.getElementById('xpFill').style.width=(xp/10)+'%';document.getElementById('vault').innerText='$'+vault.toFixed(2)}
function pop(){const c=document.getElementById('conf');for(let i=0;i<12;i++){let s=document.createElement('div');s.innerText=['🌲','✨','💰','⭐'][Math.floor(Math.random()*4)];s.style.position='absolute';s.style.left=Math.random()*100+'vw';s.style.top='-10px';s.style.fontSize='22px';s.style.animation='fall '+(1+Math.random()*1.5)+'s linear';c.appendChild(s);setTimeout(()=>s.remove(),2000)}}
let style=document.createElement('style');style.innerHTML='@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}';document.head.appendChild(style);update();
</script>
</body></html>
