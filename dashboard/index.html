<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - Cedars of Wealth</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0a0f1e;color:#fff;font-size:19px}
.wrap{max-width:1000px;margin:0 auto;padding:40px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#131a2e;border:1px solid #1e2a4a;border-radius:12px;padding:24px;text-align:center}
.card h3{margin:0;color:#a0b0cc;font-size:16px}
.card div{font-size:28px;font-weight:800;margin-top:8px}
.btn{display:inline-block;margin-top:20px;padding:16px 32px;background:linear-gradient(135deg,#4f7cff,#2dd4a7);color:#fff;text-decoration:none;border-radius:8px;font-weight:800}
</style>
</head>
<body>
<div id="site-header"></div>
<div class="wrap">
<h1>Dashboard</h1>
<div class="grid">
<div class="card"><h3>Balance</h3><div>$0.00</div></div>
<div class="card"><h3>Daily Earnings</h3><div>2%</div></div>
<div class="card"><h3>Total Earned</h3><div>$0.00</div></div>
</div>
<a href="#" class="btn">Deposit Now</a>
</div>
<div id="site-footer"></div>
<script src="/Cedars-of-Wealth/js/layout.js"></script>
</body>
</html>
