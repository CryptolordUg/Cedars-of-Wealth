<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cedars Auto Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#070E22;color:#fff;font-family:Inter,sans-serif}.top{position:sticky;top:0;z-index:99;background:#0A1931;border-bottom:2px solid #FFD700;padding:14px 20px;display:flex;justify-content:space-between}.card{background:#11264E;border:1px solid #1E3A6B;border-radius:18px;padding:18px;margin-bottom:14px}.btn{border:0;border-radius:999px;padding:14px 18px;font-weight:900;cursor:pointer;width:100%}.btn-gold{background:#FFD700;color:#0A1931}.btn:disabled{opacity:.4}.mono{font-family:JetBrains Mono}.bar{height:10px;background:#0A1931;border-radius:999px;overflow:hidden}.fill{height:100%;background:#FFD700;transition:.8s}</style>
</head><body>
<div class="top"><b>🌲 CEDARS AUTO VAULT</b><span style="font-size:10px;padding:6px 10px;border-radius:999px;border:1px solid #00FF8844;background:#00FF8811;color:#00FF88" class="mono">● AUTO PAYOUT</span></div>
<div style="max-width:900px;margin:0 auto;padding:18px">
<div class="card">
<div style="display:flex;justify-content:space-between"><span class="mono" style="font-size:11px;color:#FFD700">ID: <span id="uid">guest</span></span><span class="mono" style="font-size:11px">SECURED</span></div>
<div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="card" style="margin:0"><small>Vault Balance</small><div class="mono" style="font-size:30px;color:#FFD700" id="vault">$0.00</div><small>Min withdraw $30 • Fee $10</small></div>
<div class="card" style="margin:0"><small>You Receive</small><div class="mono" style="font-size:30px;color:#00FF88" id="receive">$0.00</div><small>After fee, auto to your wallet</small></div>
</div>
<div class="bar" style="margin-top:14px"><div class="fill" id="fill" style="width:32%"></div></div>
<button class="btn btn-gold" style="margin-top:14px" onclick="doTask()">🌱 Do Task +$0.80 +100 XP</button>
<button class="btn" id="wBtn" style="margin-top:10px;background:#0A1931;color:#fff;border:1px solid #1E3A6B" onclick="withdraw()">💰 Auto Withdraw — Min $30 | Fee $10</button>
<div id="txlog" style="margin-top:12px;font-size:11px" class="mono"></div>
<div style="margin-top:14px;font-size:10px;opacity:.4">Payout wallet hidden for security • Auto-routed • TX hash will appear after send</div>
</div>
</div>
<script>
const MASTER = 'TE26B7zQjMbahYAWcxEsSPC6aZEr2Hcz1u';
const MIN = 30; const FEE = 10;
const id = new URLSearchParams(location.search).get('id') || 'guest';
document.getElementById('uid').innerText = id;
let investors = JSON.parse(localStorage.getItem('cedars_investors')||'{}');
// Demo for 3 investors - in production this comes from Supabase, wallet never exposed to frontend JS of other users
if(!investors[id]){ investors[id]={wallet:'T-hidden-'+id, bonus:2.5, tasks:0, vault:2.5}; }
let inv = investors[id];
let xp=320;
function update(){
 let total = parseFloat(inv.vault) + (inv.tasks*0.80);
 let net = total >= MIN? total - FEE : 0;
 document.getElementById('vault').innerText='$'+total.toFixed(2);
 document.getElementById('receive').innerText='$'+net.toFixed(2);
 document.getElementById('fill').style.width=Math.min(100,(xp%1000/10))+'%';
 document.getElementById('wBtn').disabled = total < MIN;
 document.getElementById('wBtn').innerText = total < MIN? `Need $${(MIN-total).toFixed(2)} more to withdraw` : `💰 Auto Withdraw $${total.toFixed(2)} → You get $${net.toFixed(2)}`;
}
function doTask(){inv.tasks++;xp+=100;update();document.getElementById('txlog').innerHTML='<span style=color:#00FF88>✔ +$0.80 credited</span><br>'+document.getElementById('txlog').innerHTML; investors[id]=inv; localStorage.setItem('cedars_investors',JSON.stringify(investors));}
function mask(w){ if(!w) return '***'; return w.slice(0,4)+'****'+w.slice(-4); }
async function withdraw(){
 let total = parseFloat(inv.vault) + (inv.tasks*0.80);
 if(total < MIN) return alert('Min $'+MIN);
 let wallet = investors[id]?.wallet; // HIDDEN - never prompt, taken from admin ledger
 if(!wallet || wallet.includes('hidden')){ alert('Wallet not linked by admin yet. Contact support.'); return; }
 let sendAmount = total - FEE;
 let req = {id, to:wallet, to_masked:mask(wallet), amount:total, fee:FEE, willSend:sendAmount, time:Date.now(), tx:'pending', master:MASTER};
 let queue = JSON.parse(localStorage.getItem('cedars_withdraw_queue')||'[]');
 queue.push(req);
 localStorage.setItem('cedars_withdraw_queue', JSON.stringify(queue));
 document.getElementById('txlog').innerHTML=`<div style=background:#0A1931;padding:10px;border-radius:10px;border:1px solid #FFD70033>
 ⏳ Auto withdraw queued<br>
 Amount: $${total.toFixed(2)}<br>
 Fee: $${FEE}<br>
 <b style=color:#00FF88>Net to you: $${sendAmount.toFixed(2)} USDT</b><br>
 To: ${mask(wallet)} (hidden)<br>
 Status: sending... TX hash coming</div><br>`+document.getElementById('txlog').innerHTML;
 inv.vault=0;inv.tasks=0; investors[id]=inv; localStorage.setItem('cedars_investors',JSON.stringify(investors)); update();
 // In Vercel version, this fetch auto-sends: fetch('/api/payout',{method:'POST',body:JSON.stringify(req)})
}
update();
</script>
</body></html>
