tem('cedar_withdraws')||'[]');document.getElementById('log').innerText="["+new Date().toLocaleTimeString()+"] ACTIVE\nAddr: "+ADDR+"\nUsers: "+all.length+" | Deposits: "+deps.length+" | Withdraws: "+withs.length+"\nPolling: Tronscan API every 10s\nLink: https://tronscan.org/#/address/"+ADDR;document.getElementById('users').innerHTML=all.length?all.map(x=>x.u+" ["+x.code+"] refBy: "+x.refBy).join('<br>'):(u.u?u.u+' ['+(u.code||'CW-GUEST')+']':'No accounts');let dH=document.getElementById('deps');dH.innerHTML='<tr><th>Amt</th><th>TX</th><th>Status</th></tr>';deps.forEach(x=>{dH.innerHTML+=`<tr><td>$${x.amount}</td><td style="font-size:10px">${x.tx.slice(0,18)}...</td><td>${x.status}</td></tr>`});let wH=document.getElementById('withs');wH.innerHTML='<tr><th>Amt</th><th>Receive</th><th>Status</th></tr>';withs.forEach(x=>{wH.innerHTML+=`<tr><td>$${x.amount}</td><td>$${x.receive}</td><td>${x.status}</td></tr>`});}scan();setInterval(scan,10000);</script></body></html>
