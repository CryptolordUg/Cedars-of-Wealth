<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cedars Control Center — Admin</title>
<style>
:root{--bg:#0b1020;--card:#162040;--br:#1e2d55;--m:#8a9cc7;--g:#00e676;--b:#2a5bd7}
*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}
body{background:var(--bg);color:#eef2ff;min-height:100vh}
.card{background:var(--card);border:1px solid #2a3a6a;border-radius:14px;padding:16px;margin:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:11px;border-radius:10px;border:none;font-weight:800;min-height:44px;cursor:pointer;width:100%;transition:0.2s}
.btn:active{transform:scale(0.97)}
.btn-w{background:#fff;color:#000}.btn-b{background:var(--b);color:#fff}.btn-g{background:var(--g);color:#000}.btn-d{background:#0b1020;border:1px solid var(--br);color:var(--m)}
.small{font-size:11px;color:var(--m);line-height:1.4}.bal{font-size:28px;font-weight:900;color:var(--g)}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#0b1020;border:1px solid var(--g);color:#fff;padding:10px 16px;border-radius:20px;z-index:9999999;display:none;font-size:12px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,0.6)}
.kpi{font-size:18px;font-weight:900;color:#fff}.kpi-l{font-size:11px;color:var(--m)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1e2d55;font-size:12px}
</style></head><body>
<div id="toast"></div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<div><div class="small">Control Center</div><div style="font-size:20px;font-weight:900">Admin — Cedars</div><div class="small" id="adminEmail">admin@cedars.local</div></div>
<div><div class="bal" id="totalBal">$0.00</div><div class="small">Total Managed</div></div>
</div>
<div class="grid" style="margin-top:14px">
<button class="btn btn-w" onclick="cmd('✅ Investors Active — List Loaded',loadInvestors)">Investors</button>
<button class="btn btn-g" onclick="cmd('✅ Deposits Active — P2P QR + Solscan',filterTx,'Deposit')">Deposits</button>
<button class="btn btn-b" onclick="cmd('✅ Withdrawals Active — USDC + Solscan',filterTx,'Withdraw')">Withdrawals</button>
<button class="btn btn-d" onclick="cmd('✅ Referral Binary 2 Lines — 10% / 5% / 1% — $5 per referral',showReferral)">Referrals</button>
</div>
<div class="grid" style="margin-top:10px">
<button class="btn btn-d" onclick="cmd('✅ Rates Active — 10% Direct / 5% L2 / 1% Infinite',showRates)">Rates</button>
<button class="btn btn-d" onclick="cmd('✅ Email Notify Active — Respective investor email',showEmailLog)">Email Log</button>
<button class="btn btn-d" onclick="cmd('✅ Telegram Anonymous Active — No name exposed',showTgLog)">Telegram Log</button>
<button class="btn btn-d" onclick="cmd('✅ Live Support Active — In-built',toggleSupport)">Live Support</button>
</div>
</div>

<div class="grid">
<div class="card"><div class="kpi" id="invCount">0</div><div class="kpi-l">Investors</div></div>
<div class="card"><div class="kpi" id="depCount">0</div><div class="kpi-l">Deposits USD</div></div>
<div class="card"><div class="kpi" id="wdCount">0</div><div class="kpi-l">Withdrawals USD</div></div>
<div class="card"><div class="kpi" id="jupStatus">Live</div><div class="kpi-l">Jupiter lite-api.jup.ag/swap/v1</div></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:800">Activity — Solscan</div><button class="btn btn-d" style="width:auto;padding:6px 12px;font-size:11px" onclick="cmd('✅ Activity Refreshed',loadAll)">Refresh</button></div>
<div id="txList" style="margin-top:10px"></div>
</div>

<div class="card" id="supportPanel" style="display:none">
<div style="font-weight:800">Live Support — In-Built — No WhatsApp</div>
<div class="small" style="margin-top:6px">Alarm reads investor name + beep — Telegram group auto-join on deposit</div>
<input class="small" id="supReply" style="width:100%;padding:10px;border-radius:8px;border:1px solid #1e2d55;background:#0b1020;color:#fff;margin-top:8px" placeholder="Reply to investor...">
<button class="btn btn-w" style="margin-top:8px" onclick="cmd('✅ Reply Sent — Active')">Send Reply</button>
</div>

<script src="../fix.js"></script>
<script>
function cmd(msg,fn,arg){
 let t=document.getElementById('toast'); t.innerText=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',2500);
 if(fn) setTimeout(()=>fn(arg),600);
}
function loadAll(){
 let bal=typeof CedarsBalance==='function'?CedarsBalance():localStorage.getItem('cedars_usd_bal')||'0';
 document.getElementById('totalBal').innerText='$'+parseFloat(bal).toFixed(2);
 let tx=JSON.parse(localStorage.getItem('cedars_tx')||'[]');
 document.getElementById('invCount').innerText=localStorage.getItem('cedars_investor_email')?1:0;
 document.getElementById('depCount').innerText='$'+tx.filter(x=>x.type==='Deposit').reduce((s,x)=>s+parseFloat(x.amt),0).toFixed(2);
 document.getElementById('wdCount').innerText='$'+tx.filter(x=>x.type==='Withdraw').reduce((s,x)=>s+parseFloat(x.amt),0).toFixed(2);
 document.getElementById('adminEmail').innerText=localStorage.getItem('cedars_investor_email')||'admin@cedars.local';
 document.getElementById('txList').innerHTML=tx.slice(-20).reverse().map(x=>`<div class="row"><span>${x.type} $${x.amt} — ${x.date}</span><a href="https://solscan.io/tx/${x.hash}" target="_blank" style="color:#00e676;text-decoration:none">Solscan ↗</a></div>`).join('')||'<span class="small">No activity</span>';
 // Jupiter test silent
 fetch('https://lite-api.jup.ag/swap/v1/quote?inputMint=So11111111111111111111111111111111111111112&outputMint=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v&amount=1000000').then(()=>document.getElementById('jupStatus').innerText='Live ✅').catch(()=>document.getElementById('jupStatus').innerText='Check network');
}
function loadInvestors(){
 let name=localStorage.getItem('cedars_investor_name')||'Investor'; let email=localStorage.getItem('cedars_investor_email')||'-'; let ref=localStorage.getItem('cedars_ref')||'-'; let bal=localStorage.getItem('cedars_usd_bal')||'0';
 document.getElementById('txList').innerHTML=`<div class="row"><span>Name</span><span>${name}</span></div><div class="row"><span>Email</span><span>${email}</span></div><div class="row"><span>Ref</span><span>${ref}</span></div><div class="row"><span>Balance</span><span>$${bal}</span></div><div class="row"><span>KYC</span><span>${localStorage.getItem('cedars_kyc')||'Pending'}</span></div>`;
}
function filterTx(type){ let tx=JSON.parse(localStorage.getItem('cedars_tx')||'[]').filter(x=>x.type===type); document.getElementById('txList').innerHTML=tx.slice(-20).reverse().map(x=>`<div class="row"><span>${x.type} $${x.amt} — ${x.date}</span><a href="https://solscan.io/tx/${x.hash}" target="_blank" style="color:#00e676">Solscan ↗</a></div>`).join('')||'<span class="small">No '+type+'</span>';}
function showReferral(){ document.getElementById('txList').innerHTML=`<div class="row"><span>Binary</span><span>2 Lines Only</span></div><div class="row"><span>Direct</span><span>10%</span></div><div class="row"><span>Level 2</span><span>5%</span></div><div class="row"><span>Infinite</span><span>1%</span></div><div class="row"><span>Per Referral</span><span>$5 USD</span></div><div class="row"><span>Link</span><span>${location.origin}/Cedars-of-Wealth/register.html?ref=${localStorage.getItem('cedars_ref')||''}</span></div>`;}
function showRates(){ document.getElementById('txList').innerHTML=`<div class="row"><span>Starter</span><span>$50 USD</span></div><div class="row"><span>Growth</span><span>$150 USD</span></div><div class="row"><span>Mighty Cedar</span><span>$500 USD</span></div><div class="row"><span>All Rates</span><span>USD Only $</span></div>`;}
function showEmailLog(){ document.getElementById('txList').innerHTML=`<div class="small">Email Notify — Respective investor<br>• Deposit $ → ${localStorage.getItem('cedars_investor_email')||'investor@email'} — Solscan link<br>• Withdraw $ → same — Solscan link<br>• Anonymous Telegram channel — No name — Only amount + hash</div>`;}
function showTgLog(){ document.getElementById('txList').innerHTML=`<div class="small">Telegram Channel — Anonymous<br>• New Deposit $X — Hash ab12... — Solscan verified — No name<br>• New Withdraw $X — Hash cd34... — Solscan verified<br>• Group auto-join on deposit → https://t.me/CedarsOfWealth<br>• Email + Telegram both automated</div>`;}
function toggleSupport(){ let p=document.getElementById('supportPanel'); p.style.display=p.style.display==='block'?'none':'block'; if(p.style.display==='block' && window.CedarsSupportAlarm) CedarsSupportAlarm();}
loadAll(); setInterval(loadAll,3000);
</script>
<script src="../header-footer.js"></script><script src="../support-widget.js"></script>
</body></html>
