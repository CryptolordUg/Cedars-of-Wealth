<!-- Deposit -->
<button onclick="buyPackage('seed',5)">Buy Seed - $5 + $5 fee</button>
<script>
const FEE_WALLET = "TE26B7zQjMbahYAWcxEsSPC6aZEr2Hcz1u";
function buyPackage(name, amt){
  const total = amt + 5;
  if(!confirm(`Package $${amt} + $5 maintenance fee = $${total}\n$5 goes to ${FEE_WALLET}\nConfirm?`)) return;
  // save investment (existing logic)
  let inv = JSON.parse(localStorage.getItem('investments')||'[]');
  inv.push({pkg:name, amount:amt, fee:5, date:new Date().toISOString(), feeTo:FEE_WALLET});
  localStorage.setItem('investments', JSON.stringify(inv));
  alert(`Activated! $5 fee logged to company wallet.`);
  location.reload();
}
function requestWithdraw(){
  const amt = parseFloat(prompt("Amount to withdraw (min $5):"));
  if(amt < 5) return alert("Minimum $5");
  const net = amt - 5;
  if(!confirm(`Withdrawal $${amt}\nFee $5 to ${FEE_WALLET}\nYou receive $${net}\nConfirm?`)) return;
  alert(`Withdrawal queued. $5 fee to ${FEE_WALLET}`);
}
</script>
<button onclick="requestWithdraw()">Withdraw</button>
<p style="font-size:12px">All deposits/withdrawals include $5 to TE26B7zQjMbahYAWcxEsSPC6aZEr2Hcz1u for maintenance & community education.</p>
