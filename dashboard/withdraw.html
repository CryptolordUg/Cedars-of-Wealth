<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEDARS OF WEALTH - Withdraw</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0a0f1e;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#131a2e;border:1px solid #1e2a4a;border-radius:20px;padding:28px;max-width:400px;width:100%}
h1{font-size:20px;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:#8a9bb5;font-size:13px;margin-bottom:20px}
label{font-size:13px;color:#8a9bb5;display:block;margin:14px 0 6px}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #1e2a4a;background:#0d1428;color:#fff;font-size:15px}
.feebox{background:#0d1428;border-radius:10px;padding:14px;margin-top:14px;font-size:14px;line-height:1.8}
.feebox span{float:right;color:#2dd4a7}
.consent{display:flex;gap:10px;margin-top:16px;font-size:13px;color:#8a9bb5;line-height:1.5}
.consent input{width:18px;height:18px;margin-top:2px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;margin-top:18px;background:linear-gradient(135deg,#4f7cff,#2dd4a7);color:#fff;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div class="card">
<h1>Withdraw</h1>
<p class="sub">CEDARS OF WEALTH</p>

<label>Wallet address</label>
<input id="wallet" placeholder="Your Solana address">

<label>Amount (USDC)</label>
<input id="amount" type="number" placeholder="0.00" min="10" oninput="calc()">

<div class="feebox">
<div>Withdrawal fee (2%): <span id="fee">$0.00</span></div>
<div>You will receive: <span id="net">$0.00</span></div>
</div>

<label class="consent"><input type="checkbox" id="agree" onchange="toggleBtn()"> I confirm this is my wallet and I agree to the 2% withdrawal fee. Withdrawals are processed within 24 hours.</label>

<button class="btn" id="btn" disabled onclick="submitWd()">Confirm Withdrawal</button>
<p class="sub" id="msg" style="margin-top:12px"></p>
</div>
<script>
function calc(){
  const amt = parseFloat(document.getElementById('amount').value)||0;
  const fee = amt*0.02;
  document.getElementById('fee').textContent='$'+fee.toFixed(2);
  document.getElementById('net').textContent='$'+(amt-fee).toFixed(2);
}
function toggleBtn(){
  document.getElementById('btn').disabled=!document.getElementById('agree').checked;
}
function submitWd(){
  const w=document.getElementById('wallet').value.trim();
  const a=document.getElementById('amount').value;
  if(w.length<32){document.getElementById('msg').textContent='Enter valid wallet address';return;}
  if(!a||a<10){document.getElementById('msg').textContent='Minimum 10 USDC';return;}
  const fee=(a*0.02).toFixed(2), net=(a-fee).toFixed(2);
  const text=encodeURIComponent(`WITHDRAWAL REQUEST - CEDARS OF WEALTH\nWallet: ${w}\nAmount: ${a} USDC\nFee: ${fee} USDC\nNet: ${net} USDC`);
  window.open(`https://wa.me/?text=${text}`,'_blank');
  document.getElementById('msg').textContent='Request prepared';
}
</script>
</body>
</html>
