<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cedars of Wealth | Withdraw</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--b:#102A43;--g:#a8c686;--bg:#F8F9FA;--t:#1A1A1A;--bd:#DADADA;--blue:#0057B8}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,Arial,sans-serif;font-size:18px;line-height:1.7;color:var(--t);background:var(--bg);padding-top:72px} .top{position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--b);border-bottom:2px solid var(--g);padding:12px 20px;display:flex;justify-content:space-between;align-items:center} .logo{font-size:20px;font-weight:700;color:#fff} .logo span{color:var(--g)} .nav{display:flex;gap:8px;flex-wrap:wrap} .nav a{font-size:16px;font-weight:600;color:#fff;text-decoration:none;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)} .nav a.active{background:var(--g);color:var(--b)} .wrap{max-width:1100px;margin:0 auto;padding:24px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px} .card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:24px} h2{font-size:36px;font-weight:700} h3{font-size:24px;font-weight:600;margin-bottom:12px} .bal{font-size:36px;font-weight:700;color:var(--b)} input{width:100%;font-size:16px;padding:14px;border:1px solid var(--bd);border-radius:8px;margin:8px 0;box-sizing:border-box} input:focus{outline:3px solid #4D90FE;outline-offset:2px} .btn{width:100%;padding:14px;font-size:18px;font-weight:600;border-radius:8px;border:0;background:var(--b);color:#fff;cursor:pointer} .btn:hover{background:#0a2035} .calc{background:#F8F9FA;border:1px solid var(--bd);border-radius:12px;padding:16px;margin:16px 0} .calc-row{display:flex;justify-content:space-between;padding:8px 0;font-size:16px;border-bottom:1px solid #eee} .calc-row:last-child{border:0;font-weight:700;font-size:18px;color:var(--b)} table{width:100%;border-collapse:collapse;margin-top:12px} th{font-size:14px;font-weight:600;text-align:left;color:#444;padding:10px;border-bottom:2px solid var(--bd)} td{font-size:16px;padding:10px;border-bottom:1px solid #eee} .badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600} .ok{background:#d1f0d1;color:#0B6E4F} .pend{background:#fff3cd;color:#856404} *:focus{outline:3px solid #4D90FE;outline-offset:2px} @media(max-width:900px){.grid{grid-template-columns:1fr}body{padding-top:120px}.top{flex-direction:column;gap:10px}h2{font-size:28px}}</style></head><body>
<div class="top"><div class="logo">🌲 CEDARS <span>OF WEALTH</span></div><div class="nav"><a href="../index.html">🏠 Home</a><a href="balance.html">💰 Balance</a><a href="deposit.html">📥 Deposit</a><a href="withdraw.html" class="active">📤 Withdraw</a><a href="referral.html">👥 Referral</a><a href="../login.html">🔐 Login</a><a href="../register.html">✨ Register</a><a href="#" onclick="localStorage.removeItem('cedar_login');localStorage.removeItem('cedar_session');location.href='../login.html'" style="background:#8b0000">🔓 Logout</a></div></div>

<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px"><h2>Withdraw</h2><a href="balance.html" style="color:var(--blue);font-size:16px;font-weight:600;text-decoration:none">← Back to Balance</a></div>

<div class="grid">
<div class="card">
<h3>Calculator</h3>
<div style="font-size:16px;color:#444">Min $20 — Max $10,000 — Fee $10</div>
<div class="bal" id="bal">$100.00</div>

<input id="amt" type="number" placeholder="Enter amount (20 - 10000)" oninput="calc()" min="20" max="10000">

<div class="calc">
<div class="calc-row"><span>Amount</span><span id="c-amt">$0.00</span></div>
<div class="calc-row"><span>Fee</span><span>$10.00</span></div>
<div class="calc-row"><span>You Receive</span><span id="c-rec">$0.00</span></div>
</div>

<input id="addr" placeholder="TRON Address (T...)" style="margin-top:8px">
<button class="btn" onclick="doWith()">Request Withdraw</button>
<div id="msg" style="margin-top:12px;font-size:16px"></div>
</div>

<div class="card"><h3>History</h3><table><thead><tr><th>Amount</th><th>Receive</th><th>Status</th></tr></thead><tbody id="hist"></tbody></table></div>
</div>
</div>

<script>
if(localStorage.getItem('cedar_login')!=='1'){location.href='../login.html'}
function getRealBal(){let u=JSON.parse(localStorage.getItem('cedar_user')||'{"bal":100}');let deps=JSON.parse(localStorage.getItem('cedar_deposits')||'[]');let withs=JSON.parse(localStorage.getItem('cedar_withdraws')||'[]');let t=parseFloat(u.bal||100);deps.forEach(x=>{if(x.status==='approved')t+=parseFloat(x.amount||0)});withs.forEach(x=>{if(x.status!=='rejected')t-=parseFloat(x.amount||0)});return t}
function refreshBal(){document.getElementById('bal').innerText='$'+getRealBal().toFixed(2)+' Real Balance'}
refreshBal();
function calc(){
 let a=parseFloat(document.getElementById('amt').value)||0;
 if(a<20||a>10000){document.getElementById('c-amt').innerText='$0.00';document.getElementById('c-rec').innerText='$0.00';return}
 document.getElementById('c-amt').innerText='$'+a.toFixed(2);
 document.getElementById('c-rec').innerText='$'+(a-10).toFixed(2);
}
function doWith(){
 let a=parseFloat(document.getElementById('amt').value);let addr=document.getElementById('addr').value.trim();
 if(!a||a<20)return alert('Minimum $20');if(a>10000)return alert('Maximum $10,000');
 if(!addr.startsWith('T')||addr.length<20)return alert('Enter valid TRON T-address');
 let bal=getRealBal();if(a>bal)return alert('Insufficient balance: $'+bal.toFixed(2));
 let kyc=localStorage.getItem('cedar_kyc');if(kyc!=='approved')return alert('KYC pending — deposit first');
 let withs=JSON.parse(localStorage.getItem('cedar_withdraws')||'[]');
 withs.push({amount:a,receive:a-10,addr:addr,status:'pending',date:new Date().toLocaleDateString()});
 localStorage.setItem('cedar_withdraws',JSON.stringify(withs));
 document.getElementById('msg').innerHTML='<span style="color:#0B6E4F;font-weight:700">✓ Request submitted — You receive $'+(a-10).toFixed(2)+'</span>';
 loadHist();refreshBal();
}
function loadHist(){let w=JSON.parse(localStorage.getItem('cedar_withdraws')||'[]');let h=document.getElementById('hist');h.innerHTML='';if(w.length===0){h.innerHTML='<tr><td colspan="3" style="color:#888">No withdrawals</td></tr>';return}w.slice().reverse().forEach(x=>{let b=x.status==='approved'?'<span class="badge ok">Approved</span>':'<span class="badge pend">Pending</span>';h.innerHTML+=`<tr><td>$${x.amount.toFixed(2)}</td><td>$${(x.receive||x.amount-10).toFixed(2)}</td><td>${b}</td></tr>`})}
loadHist();
</script>
</body></html>
