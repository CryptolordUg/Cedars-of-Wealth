<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cedars Withdraw</title>
<style>body{font-family:sans-serif;padding:16px;background:#f6fbf6;max-width:600px;margin:0 auto}.card{background:#fff;padding:14px;margin:10px 0;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}button{padding:12px 18px;background:#2e7d32;color:#fff;border:0;border-radius:8px;font-size:15px;cursor:pointer}a{color:#2e7d32}</style>
</head><body>
<h1>💸 Cedars Withdrawals</h1>
<p>Principal 50% / 6 months + Reserve 20% / 30 months.<br>Withdrawals available monthly.</p>
<div id="list"></div>
<p><a href="packages.html">← Choose a package</a></p>
<script>
function load(){
 let inv=JSON.parse(localStorage.getItem('cedars_inv')||'[]');
 let list=document.getElementById('list');
 if(!inv.length){
  list.innerHTML='<div class="card"><b>No investments yet.</b><br><br><a href="packages.html">Invest now →</a></div>'; return;
 }
 list.innerHTML='';
 inv.forEach((v)=>{
  let amt=parseFloat(v.amount);
  let p=(amt*0.5/6).toFixed(2);
  let r=(amt*0.2/30).toFixed(2);
  let t=(parseFloat(p)+parseFloat(r)).toFixed(2);
  let d=new Date(v.date).toLocaleDateString();
  list.innerHTML+=`<div class="card"><b>${v.pkg} - $${amt}</b> <small>(${d})</small><br>Withdrawable now: <b>$${t}</b><br><small>Principal: $${p} | Reserve: $${r}</small><br><br><button onclick="withdraw('${t}')">Withdraw $${t}</button></div>`;
 });
}
function withdraw(t){
 let addr=prompt('Enter your USDT address to receive $'+t+':');
 if(!addr) return;
 if(addr.length<10){ alert('Please enter a valid address'); return; }
 alert('Withdrawal request of $'+t+' to '+addr+' submitted for review (test mode).');
}
load();
</script></body></html>
