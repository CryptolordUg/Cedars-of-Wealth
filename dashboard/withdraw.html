<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cedars Withdraw</title>
<style>body{font-family:sans-serif;padding:16px;background:#f6fbf6}.card{background:#fff;padding:12px;margin:10px 0;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}button{padding:10px 16px;background:#2e7d32;color:#fff;border:0;border-radius:8px;margin:4px}</style>
</head><body>
<h1>💸 Cedars Withdrawals</h1>
<p>Principal 50%/6mo + Reserve 20%/30mo</p>
<div id="list"></div>
<button onclick="addTest()">+ Add Test $5 Investment (debug)</button>
<p><a href="packages.html">Choose a package</a> | <a href="cedars-deposit-5.html?pkg=seed&amount=5">Go to Deposit</a></p>
<script>
function load(){
 let inv=JSON.parse(localStorage.getItem('cedars_inv')||'[]');
 let list=document.getElementById('list');
 list.innerHTML='';
 if(!inv.length){list.innerHTML='<p><b>No investments yet.</b><br>Click "+ Add Test $5" below, then refresh. If it appears, storage works.</p>'; return;}
 inv.forEach((v,i)=>{
  let amt=parseFloat(v.amount);
  let p=(amt*0.5/6).toFixed(2); let r=(amt*0.2/30).toFixed(2); let t=(parseFloat(p)+parseFloat(r)).toFixed(2);
  list.innerHTML+=`<div class="card"><b>${v.pkg} - $${amt}</b><br>Withdrawable: $${t} (P:$${p} R:$${r})<br><br><button onclick="wd('${t}')">Withdraw $${t}</button></div>`;
 });
}
function addTest(){
 let inv=JSON.parse(localStorage.getItem('cedars_inv')||'[]');
 inv.push({pkg:'seed', amount:'5', date:Date.now()});
 localStorage.setItem('cedars_inv', JSON.stringify(inv));
 alert('Test $5 added! Reloading...');
 location.reload();
}
function wd(t){ let a=prompt('USDT address for $'+t); if(a) alert('Withdrawal $'+t+' to '+a+' requested (test mode)'); }
load();
</script></body></html>
