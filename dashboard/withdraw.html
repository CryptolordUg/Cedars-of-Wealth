<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdraw</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet"><style>:root{--b:#102A43;--g:#a8c686}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#F8F9FA;padding-top:72px}.top{position:fixed;top:0;left:0;right:0;background:#102A43;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:999}.logo{color:#fff;font-weight:700}.logo span{color:#a8c686}.nav a{color:#fff;text-decoration:none;margin-left:8px;font-size:13px;font-weight:600;padding:8px 12px;background:rgba(255,255,255,.1);border-radius:6px}.nav a.active{background:#a8c686;color:#102A43}.wrap{max-width:900px;margin:0 auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px;margin-top:16px}.bal{font-size:32px;font-weight:700}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;margin:8px 0}.btn{width:100%;padding:14px;background:#102A43;color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:12px}th{padding:10px;text-align:left;font-size:12px;color:#666;border-bottom:2px solid #ddd}td{padding:10px;border-bottom:1px solid #eee;font-size:14px}footer{text-align:center;padding:20px;font-size:11px;color:#666;margin-top:30px}@media(max-width:700px){.top{flex-direction:column;gap:8px}body{padding-top:110px}}</style></head><body><div class="top"><div class="logo">🌲 CEDARS <span>OF WEALTH</span></div><div class="nav"><a href="../index.html">Home</a><a href="balance.html">Balance</a><a href="deposit.html">Deposit</a><a href="withdraw.html" class="active">Withdraw</a><a href="referral.html">Referral</a><a href="#" onclick="localStorage.clear();location.href='../login.html'" style="background:#8b0000">Logout</a></div></div><div class="wrap"><div class="card"><h3>Available</h3><div class="bal" id="bal">$0.00</div></div><div class="card"><h3>Withdraw</h3><input id="wAmt" type="number" placeholder="Amount (min 30)"><input id="wAddr" placeholder="Your T-address"><div style="display:flex;justify-content:space-between;font-size:13px;margin:8px 0"><span>Fee</span><b>$10</b></div><div style="display:flex;justify-content:space-between;font-size:13px;margin:8px 0"><span>Receive</span><b id="rec">$0.00</b></div><button class="btn" onclick="requestW()">Request</button><div id="msg" style="margin-top:8px;font-size:13px"></div></div><div class="card"><h3>History</h3><table><thead><tr><th>Amount</th><th>Receive</th><th>Status</th></tr></thead><tbody id="hist"></tbody></table></div></div><footer>© CEDARS OF WEALTH</footer><script>function getBal(){let deps=JSON.parse(localStorage.getItem('cedar_deposits')||'[]');let withs=JSON.parse(localStorage.getItem('cedar_withdraws')||'[]');let t=0;deps.forEach(x=>{if(x.status==='approved')t+=parseFloat(x.amount)});withs.forEach(x=>{if(x.status!=='rejected')t-=parseFloat(x.amount)});return t<0?0:t}document.getElementById('wAmt').addEventListener('input',function(){let a=parseFloat(this.value)||0;let r=a>=30?a-10:0;if(r<0)r=0;document.getElementById('rec').innerText='$'+r.toFixed(2)});function requestW(){let a=parseFloat(document.getElementById('wAmt').value),addr=document.getElementById('wAddr').value.trim();let bal=getBal();if(!a||a<30){alert('Min 30');return}if(a>bal){alert('Insufficient');return}if(!addr.startsWith('T')||addr.length<20){alert('T-address');return}let withs=JSON.parse(localStorage.getItem('cedar_withdraws')||'[]');withs.push({amount:a,receive:a-10,addr:addr,status:'pending',date:new Date().toLocaleDateString()});localStorage.setItem('cedar_withdraws',JSON.stringify(withs));document.getElementById('msg').innerText='Request submitted';load();}function load(){document.getElementById('bal').innerText='$'+getBal().toFixed(2);let w=JSON.parse(localStorage.getItem('cedar_withdraws')||'[]');let h=document.getElementById('hist');h.innerHTML='';if(w.length===0){h.innerHTML='<tr><td colspan="3">No records</td></tr>';return}w.slice().reverse().forEach(x=>{h.innerHTML+=`<tr><td>$${parseFloat(x.amount).toFixed(2)}</td><td>$${parseFloat(x.receive).toFixed(2)}</td><td>${x.status}</td></tr>`})}load();</script></body></html>
