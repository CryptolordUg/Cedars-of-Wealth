<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdraw</title><style>:root{--b:#102A43;--g:#FFD700}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#F8F9FA;padding-top:68px}.top{position:fixed;top:0;left:0;right:0;background:#102A43;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:9999;border-bottom:2px solid #FFD700}.logo{font-size:28px;font-weight:900;color:#fff;text-shadow:0 0 10px #FFD700}.logo span{color:#FFD700}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,215,0,.3)}.nav a.active{background:#FFD700;color:#102A43}.wrap{max-width:900px;margin:0 auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin-top:14px}.bal{font-size:32px;font-weight:900}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}.row b{color:#102A43}.calc{background:#102A43;color:#fff;border-radius:12px;padding:14px;margin:12px 0;border:1px solid #FFD700}.calc div{display:flex;justify-content:space-between;margin:6px 0;font-size:13px}.calc b{color:#FFD700}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;margin:8px 0}.consent{display:flex;gap:8px;align-items:flex-start;margin:12px 0;font-size:12px}.consent input{width:18px;height:18px;margin:0}.btn{width:100%;padding:14px;background:#102A43;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.4}.btn-g{background:#FFD700;color:#102A43}table{width:100%;border-collapse:collapse;margin-top:12px}th{padding:8px;text-align:left;font-size:11px;color:#666;border-bottom:2px solid #ddd}td{padding:8px;border-bottom:1px solid #eee;font-size:13px}footer{text-align:center;padding:16px;font-size:10px;color:#666}@media(max-width:700px){.top{flex-direction:column;gap:6px}body{padding-top:100px}}</style></head><body><div class="top"><div class="logo">🌲 CEDARS <span>OF WEALTH</span></div><div class="nav"><a href="../index.html">Home</a><a href="balance.html">Balance</a><a href="deposit.html">Deposit</a><a href="withdraw.html" class="active">Withdraw</a><a href="referral.html">Referral</a><a href="#" onclick="localStorage.clear();location.href='../login.html'" style="background:#8b0000">Sign Out</a></div></div><div class="wrap"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span>Available</span><b class="bal" id="bal">$0.00</b></div></div><div class="card"><h3>Withdraw Application</h3><input id="wAddr" placeholder="T-address"><input id="wAmt" type="number" placeholder="Amount"><div class="calc"><div><span>Amount</span><b id="cAmt">$0.00</b></div><div><span>Fee</span><b>$10.00</b></div><div style="border-top:1px solid rgba(255,215,0,.3);padding-top:6px;margin-top:6px"><span>Receive</span><b id="cRec">$0.00</b></div></div><div class="consent"><input type="checkbox" id="consent"><label for="consent">I confirm this address is correct and I accept $10 network fee.</label></div><button class="btn" id="btnW" disabled onclick="requestW()">Submit Application</button><div id="msg" style="font-size:12px;margin-top:8px;text-align:center"></div></div><div class="card"><h3>History</h3><table><thead><tr><th>Amount</th><th>Receive</th><th>Status</th><th>Date</th></tr></thead><tbody id="hist"></tbody></table></div></div><footer>© CEDARS OF WEALTH</footer><script>function getBal(){let deps=JSON.parse(localStorage.getItem('cedar_deposits')||'[]');let withs=JSON.parse(localStorage.getItem('cedar_withdraws')||'[]');let t=0;deps.forEach(x=>{if(x.status==='approved')t+=parseFloat(x.amount)});withs.forEach(x=>{if(x.status!=='rejected')t-=parseFloat(x.amount)});return t<0?0:t}let amtEl=document.getElementById('wAmt');let addrEl=document.getElementById('wAddr');let consEl=document.getElementById('consent');let btn=document.getElementById('btnW');function calc(){let a=parseFloat(amtEl.value)||0;document.getElementById('cAmt').innerText='$'+a.toFixed(2);let r=a>=30?a-10:0;if(r<0)r=0;document.getElementById('cRec').innerText='$'+r.toFixed(2);check()}function check(){let a=parseFloat(amtEl.value)||0;let addr=addrEl.value.trim();let c=consEl.checked;let bal=getBal();btn.disabled=!(a>=30&&a<=bal&&addr.startsWith('T')&&addr.length>20&&c)}amtEl.addEventListener('input',calc);addrEl.addEventListener('input',check);consEl.addEventListener('change',check);function requestW(){let a=parseFloat(amtEl.value),addr=addrEl.value.trim();let bal=getBal();if(a<30||a>bal||!addr.startsWith('T'))return;let withs=JSON.parse(localStorage.getItem('cedar_withdraws')||'[]');withs.push({amount:a,receive:a-10,addr:addr,status:'pending',date:new Date().toLocaleDateString(),time:Date.now()});localStorage.setItem('cedar_withdraws',JSON.stringify(withs));document.getElementById('msg').innerText='Application submitted';amtEl.value='';addrEl.value='';consEl.checked=false;calc();load()}function load(){document.getElementById('bal').innerText='$'+getBal().toFixed(2);let w=JSON.parse(localStorage.getItem('cedar_withdraws')||'[]');let h=document.getElementById('hist');h.innerHTML='';if(w.length===0){h.innerHTML='<tr><td colspan="4">No records</td></tr>';return}w.slice().reverse().forEach(x=>{h.innerHTML+=`<tr><td>$${parseFloat(x.amount).toFixed(2)}</td><td>$${parseFloat(x.receive).toFixed(2)}</td><td>${x.status}</td><td>${x.date}</td></tr>`})}load();calc();</script></body></html>
