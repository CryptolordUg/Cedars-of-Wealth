<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cedars Withdraw</title>
<style>body{font-family:sans-serif;padding:16px;background:#f6fbf6}.card{background:#fff;padding:12px;margin:10px 0;border-radius:12px}</style>
</head><body>
<h1>💸 Cedars Withdrawals</h1>
<p>Principal 50%/6mo + Reserve 20%/30mo</p>
<div id="list"></div>
<p><a href="packages.html">Choose a package</a> | <a href="cedars-deposit-5.html?pkg=seed&amount=5">Test Deposit $5</a></p>
<script>
let inv=JSON.parse(localStorage.getItem('cedars_inv')||'[]');
let list=document.getElementById('list');
if(!inv.length){list.innerHTML='<p><b>No investments yet.</b><br>Click "Test Deposit $5" above, then click Confirm Deposit.</p>';}
inv.forEach((v,i)=>{
 let amt=parseFloat(v.amount);
 let p=(amt*0.5/6).toFixed(2); let r=(amt*0.2/30).toFixed(2); let t=(parseFloat(p)+parseFloat(r)).toFixed(2);
 list.innerHTML+=`<div class="card"><b>${v.pkg} - $${amt}</b><br>Withdrawable: $${t} (P:$${p} R:$${r})<br><br><button onclick="let a=prompt('USDT address for $${t}');if(a)alert('Request sent to '+a)">Withdraw $${t}</button></div>`;
});
</script></body></html>
