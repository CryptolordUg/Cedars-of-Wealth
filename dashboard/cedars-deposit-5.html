<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cedars Deposit</title>
<style>body{font-family:sans-serif;padding:16px;background:#f6fbf6}.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}input,select{padding:10px;width:100%;margin:8px 0}button{padding:12px;background:#2e7d32;color:#fff;border:0;border-radius:8px;width:100%}</style>
</head><body>
<div class="card">
<h1>💰 Cedars Deposit</h1>
<p id="pkginfo">Select package</p>
<label>Amount USD</label>
<input id="amt" type="number" value="5">
<label>Network</label>
<select><option>Solana</option><option>TRC20</option><option>BEP20</option></select>
<button onclick="deposit()">Confirm Deposit</button>
<p><a href="withdraw.html">Go to Withdraw</a></p>
</div>
<script>
const q=new URLSearchParams(location.search);
const pkg=q.get('pkg')||'seed';
const amount=q.get('amount')||'5';
document.getElementById('amt').value=amount;
document.getElementById('pkginfo').innerText='Package: '+pkg+' - $'+amount;
function deposit(){
 let amt=document.getElementById('amt').value;
 let inv=JSON.parse(localStorage.getItem('cedars_inv')||'[]');
 inv.push({pkg:pkg, amount:amt, date:Date.now()});
 localStorage.setItem('cedars_inv',JSON.stringify(inv));
 alert('Deposit $'+amt+' for '+pkg+' saved! Redirecting to withdraw...');
 location.href='withdraw.html';
}
</script>
</body></html>
