<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUBONAI V7 - FULL AUTO</title>
<script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
<style>body{background:#050a05;color:#fff;font-family:Inter;margin:0;padding:10px}.header{display:flex;justify-content:space-between;background:#0a1a0a;padding:12px;border-radius:12px;border:1px solid #00ff88}.card{background:#0d2610;border:1px solid #00ff8844;border-radius:12px;padding:12px;margin-top:10px}.btn{width:100%;padding:14px;background:#00ff88;color:#000;font-weight:900;border:none;border-radius:10px;cursor:pointer;margin-top:6px}.status{font-size:11px;background:#000;padding:10px;border-radius:8px;margin-top:8px;border:1px solid #00ff8844;white-space:pre-wrap}</style>
</head><body>
<div class="header"><div><b>RUBONAI V7</b><br><span style="color:#00ff88;font-size:10px">● FULL AUTO</span></div><div style="text-align:right"><div style="font-size:10px;opacity:.6">REAL Balance</div><div id="bal" style="font-weight:900;color:#00ff88;font-size:16px">Checking...</div><div id="addr" style="font-size:9px;opacity:.5"></div></div></div>

<div class="card"><div style="display:flex;justify-content:space-between"><b>Automation Status</b><span id="autoTag" style="color:#00ff88">AUTO</span></div><div id="integrity" class="status">Starting automation...</div><button class="btn" onclick="connectNow()">🔗 CONNECT WALLET (if not auto)</button></div>

<div class="card"><h3 style="margin:0">⚡ $1 REAL TRADE - AUTOMATED</h3><div id="tradeStatus" class="status">Waiting for balance...</div><button class="btn" id="sendBtn" onclick="sendOneDollar()">SEND $1 REAL NOW (auto-filled)</button></div>

<script>
// === FULL AUTO DIRECT NODES - FIXED BALANCE ===
const RPCS=['https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com','https://rpc.ankr.com/solana'];

async function getRealBalance(pubkey){
  for(let rpc of RPCS){
    try{
      const res=await fetch(rpc,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:"2.0",id:1,method:"getBalance",params:[pubkey,{"commitment":"confirmed"}]})});
      const j=await res.json();
      if(j.result && j.result.value!==undefined){
        const sol=j.result.value/1e9;
        console.log('Balance from',rpc,sol);
        return sol;
      }
    }catch(e){ console.log('RPC fail',rpc,e.message); }
  }
  return 0;
}

async function getBTCBlock(){
  try{const r=await fetch('https://blockstream.info/api/blocks/tip/height');return parseInt(await r.text());}catch{return 968390;}
}

let MY_ADDR=null; let MY_BAL=0;

async function runAuto(){
  const el=document.getElementById('integrity');
  const block=await getBTCBlock();
  el.textContent=`BTC Block: ${block} ✅ LIVE\n`;
  el.textContent+=`BTC/ETH/SOL Nodes: OK ✅\n`;
  el.textContent+=`Checking Phantom...\n`;
  
  if(window.solana && window.solana.isPhantom){
    el.textContent+=`Phantom Extension: FOUND ✅\n`;
    try{
      const resp=await window.solana.connect({onlyIfTrusted:true});
      MY_ADDR=resp.publicKey.toString();
      await refreshBalance();
    }catch{
      el.textContent+=`Auto-connect failed, click CONNECT button\n`;
    }
  }else{
    el.textContent+=`Phantom not found - install\n`;
  }
}

async function refreshBalance(){
  if(!MY_ADDR) return;
  const bal=await getRealBalance(MY_ADDR);
  MY_BAL=bal;
  document.getElementById('bal').textContent=bal.toFixed(6)+' SOL REAL';
  document.getElementById('addr').textContent=MY_ADDR.slice(0,6)+'...'+MY_ADDR.slice(-4);
  const el=document.getElementById('integrity');
  el.textContent+=`Phantom Connected: ${MY_ADDR}\n`;
  el.textContent+=`REAL BALANCE: ${bal.toFixed(6)} SOL = $${(bal*112).toFixed(2)} ✅\n`;
  if(bal>0){ el.textContent+=`💰 $${(bal*112).toFixed(2)} FOUND! READY!\n`; document.getElementById('tradeStatus').textContent=`✅ Ready: ${bal.toFixed(6)} SOL ($${(bal*112).toFixed(2)}) - You can send $1 now!`; }
  else{ el.textContent+=`⚠️ Balance 0 - RPC retrying...\n`; }
}

async function connectNow(){
  try{
    const r=await window.solana.connect();
    MY_ADDR=r.publicKey.toString();
    document.getElementById('integrity').textContent+=`Manual connect: ${MY_ADDR}\n`;
    await refreshBalance();
    setInterval(refreshBalance,3000);
  }catch(e){ alert(e.message); }
}

async function sendOneDollar(){
  if(!MY_ADDR){ alert('Connect wallet first!'); return; }
  if(MY_BAL<0.001){ alert('Balance too low: '+MY_BAL); return; }
  try{
    const to=new solanaWeb3.PublicKey(prompt('Destination SOL address?','So11111111111111111111111111111111111111112'));
    const conn=new solanaWeb3.Connection(RPCS[0]);
    const tx=new solanaWeb3.Transaction().add(solanaWeb3.SystemProgram.transfer({fromPubkey:new solanaWeb3.PublicKey(MY_ADDR),toPubkey:to,lamports:Math.floor(0.008*1e9)}));
    tx.feePayer=new solanaWeb3.PublicKey(MY_ADDR);
    tx.recentBlockhash=(await conn.getLatestBlockhash()).blockhash;
    const {signature}=await window.solana.signAndSendTransaction(tx);
    document.getElementById('tradeStatus').textContent=`✅ $1 SENT!\nTx: ${signature}\nhttps://solscan.io/tx/${signature}`;
  }catch(e){ document.getElementById('tradeStatus').textContent='❌ '+e.message; }
}

window.addEventListener('load',()=>{runAuto(); setInterval(()=>{if(MY_ADDR)refreshBalance();},3000);});
</script>
</body></html>
