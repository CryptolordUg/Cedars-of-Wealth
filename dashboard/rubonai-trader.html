<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUBONAI V6 - $1 REAL DIRECT NODE</title>
<script src="../api/direct-nodes.js"></script>
<script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
<style>
body{background:#050a05;color:#fff;font-family:Inter;margin:0;padding:10px}
.header{display:flex;justify-content:space-between;align-items:center;background:#0a1a0a;padding:10px;border-radius:10px;border:1px solid #00ff8844}
.card{background:#0d2610;border:1px solid #00ff8844;border-radius:12px;padding:12px;margin-top:10px}
.btn{width:100%;padding:14px;background:#00ff88;color:#000;font-weight:900;border:none;border-radius:10px;cursor:pointer;margin-top:10px}
input{width:100%;padding:10px;background:#000;border:1px solid #00ff8844;border-radius:8px;color:#fff;margin:5px 0}
#chart{height:300px;background:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#00ff88;border:1px solid #00ff8844}
</style>
</head>
<body>

<div class="header">
<div><b>RUBONAI AI V6</b> <span style="color:#00ff88;font-size:12px">● DIRECT NODE LIVE</span></div>
<div style="text-align:right"><div style="font-size:11px;opacity:.6">Balance</div><div id="bal" style="font-weight:900">$1.00 REAL</div></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;font-size:12px"><span>BTC/USDT</span><span id="btcPrice" style="color:#00ff88">$67,148.20</span></div>
<div id="chart">📈 LIVE BTC CHART - Block <span id="block">loading...</span></div>
</div>

<div class="card">
<h3>⚡ DIRECT TRADE PANEL - $1 REAL ON-CHAIN</h3>
<label>Amount (USDT/SOL)</label>
<input id="amount" value="1" placeholder="1">
<label>Chain</label>
<select id="chain" style="width:100%;padding:10px;background:#000;color:#fff;border:1px solid #00ff8844;border-radius:8px">
<option value="sol">Solana (BEST for $1 - fee $0.00001)</option>
<option value="tron">Tron (USDT TRC20)</option>
<option value="eth">Ethereum</option>
<option value="btc">Bitcoin</option>
</select>
<button class="btn" id="execBtn" onclick="executeRealOrder()">EXECUTE ORDER - $1 REAL</button>
<div id="status" style="font-size:11px;margin-top:8px;opacity:.7"></div>
</div>

<div class="card" style="font-size:11px;line-height:1.8">
<b>🟢 Direct Nodes Status:</b><br>
<div id="nodes"></div>
</div>

<script>
// REAL $1 DIRECT NODE TRADER
async function executeRealOrder(){
  const amount = document.getElementById('amount').value || 1;
  const chain = document.getElementById('chain').value;
  const btn = document.getElementById('execBtn');
  const status = document.getElementById('status');
  
  btn.innerText = "⏳ CONNECTING DIRECT NODES...";
  
  try {
    if(!window.DirectNodes){
      alert("⚠️ Create api/direct-nodes.js first in GitHub!");
      btn.innerText = "EXECUTE ORDER - $1 REAL";
      return;
    }
    
    const test = await window.DirectNodes.testAll();
    document.getElementById('block').innerText = test.btc_block;
    document.getElementById('nodes').innerHTML = `
    BTC Block: ${test.btc_block}<br>
    ETH: ${test.eth_rpc}<br>
    SOL: ${test.sol_rpc}<br>
    TRON: ${test.tron_rpc}<br>
    Status: ${test.status}
    `;
    
    const solRpc = localStorage.getItem('CEDARS_SOL_RPC') || 'https://api.mainnet-beta.solana.com';
    const res = await fetch(solRpc, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({jsonrpc:"2.0",id:1,method:"getHealth"})
    });
    const health = await res.json();
    
    btn.innerText = `✅ $1 DIRECT NODE LIVE - Block ${test.btc_block}`;
    btn.style.background = "#00ff88";
    
    // Try connect Phantom for REAL $1
    if(window.solana && window.solana.isPhantom){
      status.innerHTML = "🔗 Phantom found! Connecting...";
      const resp = await window.solana.connect();
      const bal = await window.DirectNodes.getSolanaBalance(resp.publicKey.toString());
      document.getElementById('bal').innerText = bal + " SOL REAL";
      status.innerHTML = `✅ Wallet: ${resp.publicKey.toString().slice(0,8)}... Balance: ${bal} SOL<br>Ready to send $${amount} real on ${chain}`;
      alert(`🟢 WALLET CONNECTED!\nBalance: ${bal} SOL\n\nClick EXECUTE again to send REAL $${amount} on ${chain} chain!`);
      btn.innerText = `SEND $${amount} REAL ${chain.toUpperCase()} NOW`;
      btn.onclick = ()=> sendReal(chain, amount, resp.publicKey.toString());
    } else {
      status.innerHTML = `🟢 Nodes OK Health: ${health.result||'ok'}<br>Install Phantom wallet to send REAL $1, or use TRON for USDT`;
      alert(`🟢 DIRECT RPC LIVE!\nBTC Block: ${test.btc_block}\n\nFor $1 REAL:\n1. Install Phantom (Solana) - best for $1\n2. Or use TronLink for USDT\n\nNodes are LIVE now!`);
    }
    
  } catch(e){
    btn.innerText = "EXECUTE ORDER - $1 REAL";
    status.innerHTML = "Error: " + e.message;
    alert("Error: " + e.message);
  }
}

async function sendReal(chain, amount, from){
  alert(`This will send REAL $${amount} on ${chain.toUpperCase()} from ${from}\n\nNext step: I will build signer for ${chain} - tell me your wallet!`);
}

window.addEventListener('load', async ()=>{
  if(window.DirectNodes){
    const test = await window.DirectNodes.testAll();
    document.getElementById('block').innerText = test.btc_block;
    document.getElementById('nodes').innerHTML = `Loading... BTC ${test.btc_block}`;
    // Update BTC price
    try{
      const r = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
      const d = await r.json();
      document.getElementById('btcPrice').innerText = '$' + parseFloat(d.price).toLocaleString();
    }catch{}
  }
});
</script>

</body>
</html>
