<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUBONAI V6 - INTEGRITY AUTO</title>
<script src="../api/direct-nodes.js"></script>
<script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
<style>body{background:#050a05;color:#fff;font-family:Inter;margin:0;padding:10px}.header{display:flex;justify-content:space-between;align-items:center;background:#0a1a0a;padding:12px;border-radius:12px;border:1px solid #00ff8844}.card{background:#0d2610;border:1px solid #00ff8844;border-radius:12px;padding:12px;margin-top:10px}.btn{width:100%;padding:15px;background:#00ff88;color:#000;font-weight:900;border:none;border-radius:12px;cursor:pointer;font-size:16px;margin-top:6px}.btn2{background:#00aaff;color:#fff}.status{font-size:12px;line-height:1.6;word-break:break-all;background:#000;padding:10px;border-radius:8px;margin-top:8px;border:1px solid #00ff8844}input{width:100%;padding:12px;background:#000;border:1px solid #00ff8844;border-radius:8px;color:#fff;margin:6px 0;box-sizing:border-box}</style>
</head><body>

<div class="header">
<div><b>RUBONAI V6</b><br><span style="color:#00ff88;font-size:11px">● AUTOMATION + INTEGRITY</span></div>
<div style="text-align:right"><div style="font-size:10px;opacity:.6">REAL Balance</div><div id="bal" style="font-weight:900;color:#00ff88">Not connected</div><div id="addrShort" style="font-size:9px;opacity:.5">Click checks below</div></div>
</div>

<div class="card">
<button class="btn btn2" onclick="runIntegrity()">🔍 RUN AUTOMATED INTEGRITY CHECKS</button>
<div id="integrity" class="status">Click button to check all automation...</div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between"><span>BTC/USDT</span><span id="btcPrice" style="color:#00ff88">Live</span></div>
<div id="chart" style="height:50px;background:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;border:1px solid #00ff8844;margin-top:8px">Block <span id="block">...</span> • <span id="nodeStatus">Checking...</span></div>
</div>

<div class="card">
<h3 style="margin:0 0 10px 0">⚡ $1 REAL TRADE</h3>
<input id="myAddr" placeholder="Auto-filled after connect">
<input id="amount" value="0.005">
<input id="toAddr" placeholder="Destination SOL address">
<button class="btn" id="execBtn" onclick="connectAndCheck()">1. CONNECT PHANTOM - SHOW $1.28</button>
<div id="status" class="status">Ready...</div>
</div>

<script>
async function runIntegrity(){
  const el=document.getElementById('integrity');
  const blockEl=document.getElementById('block');
  const nodeEl=document.getElementById('nodeStatus');
  el.innerHTML='⏳ Running checks...<br>';
  try{
    console.log('=== CEDARS INTEGRITY CHECK ===');
    const test = await window.DirectNodes.testAll();
    blockEl.innerText=test.btc_block;
    const isFresh = test.btc_block > 890800;
    el.innerHTML+=`BTC Block: ${test.btc_block} ${isFresh?'✅ OK':'❌ STALE'}<br>`;
    el.innerHTML+=`BTC Node: ${test.btc_rpc} ✅<br>`;
    el.innerHTML+=`ETH Node: ${test.eth_rpc} ✅<br>`;
    el.innerHTML+=`SOL Node: ${test.sol_rpc} ✅<br>`;
    nodeEl.innerText=isFresh?'All Nodes OK ✅':'Nodes Stale ❌';
    nodeEl.style.color=isFresh?'#00ff88':'red';

    const balOld = await window.DirectNodes.getSolanaBalance('6XQviXJ5EceCmZq6uGrnrsxBKSnLKSvXeT7MCFF6fTb');
    el.innerHTML+=`Old wallet 6XQviX: ${balOld} SOL ${parseFloat(balOld)>0?'✅':'⚠️ 0 - Empty'}<br>`;

    if(window.solana && window.solana.isPhantom){
      el.innerHTML+=`Phantom Extension: ✅ Found<br>`;
      try{
        const r = await window.solana.connect({onlyIfTrusted:true});
        const addr = r.publicKey.toString();
        const balNew = await window.DirectNodes.getSolanaBalance(addr);
        el.innerHTML+=`Phantom Connected: ${addr.slice(0,10)}...<br>`;
        el.innerHTML+=`<b style="color:#00ff88;font-size:14px">REAL BALANCE: ${balNew} SOL ✅</b><br>`;
        document.getElementById('bal').innerText=balNew+' SOL REAL';
        document.getElementById('myAddr').value=addr;
        document.getElementById('addrShort').innerText=addr.slice(0,6)+'...'+addr.slice(-4);
        if(parseFloat(balNew)>0){ el.innerHTML+=`💰 $1.28 FOUND! Automation 100% ✅<br>`; }
      }catch(e){
        el.innerHTML+=`Phantom: Not auto-connected (need click) ⚠️<br>`;
      }
    } else {
      el.innerHTML+=`❌ Phantom Extension: NOT FOUND - Install phantom.app<br>`;
    }
    el.innerHTML+=`<br>=== ${isFresh?'ALL AUTOMATION WORKING ✅':'DIRECT NODES OK, WALLET NEEDS CONNECT'} ===`;
  }catch(e){ el.innerHTML+='❌ Error: '+e.message; }
}

async function connectAndCheck(){
  const btn=document.getElementById('execBtn');
  const status=document.getElementById('status');
  btn.innerText='⏳ Connecting...';
  try{
    if(!window.solana){ status.innerHTML='❌ Phantom not found! Install from phantom.app'; btn.innerText='INSTALL PHANTOM FIRST'; return; }
    const r=await window.solana.connect();
    const addr=r.publicKey.toString();
    localStorage.setItem('MY_SOL_ADDR',addr);
    document.getElementById('myAddr').value=addr;
    document.getElementById('addrShort').innerText=addr.slice(0,6)+'...'+addr.slice(-4);
    status.innerHTML=`🔗 Connected: ${addr}<br>Checking balance...`;
    const bal=await window.DirectNodes.getSolanaBalance(addr);
    document.getElementById('bal').innerText=bal+' SOL REAL';
    status.innerHTML+=`<br><b style="color:#00ff88;font-size:16px">REAL: ${bal} SOL (~$${(parseFloat(bal)*205).toFixed(2)})</b><br>✅ Ready to send $1!`;
    btn.innerText=`SEND ${document.getElementById('amount').value} SOL REAL NOW`;
    btn.onclick=()=>sendRealSOL();
    await runIntegrity();
  }catch(e){ btn.innerText='CONNECT FAILED - TRY AGAIN'; status.innerHTML='Error: '+e.message; }
}

async function sendRealSOL(){
  const to=document.getElementById('toAddr').value.trim();
  const amount=parseFloat(document.getElementById('amount').value)||0.005;
  if(!to||to.length<30){alert('Paste destination address!');return}
  const btn=document.getElementById('execBtn');
  btn.innerText='⏳ Sending REAL... Confirm in Phantom';
  try{
    const connection=new solanaWeb3.Connection(localStorage.getItem('CEDARS_SOL_RPC')||'https://api.mainnet-beta.solana.com');
    const fromPubkey=window.solana.publicKey;
    const toPubkey=new solanaWeb3.PublicKey(to);
    const tx=new solanaWeb3.Transaction().add(solanaWeb3.SystemProgram.transfer({fromPubkey,toPubkey,lamports:Math.floor(amount*1e9)}));
    tx.feePayer=fromPubkey;
    tx.recentBlockhash=(await connection.getLatestBlockhash()).blockhash;
    const {signature}=await window.solana.signAndSendTransaction(tx);
    document.getElementById('status').innerHTML+=`<br>✅ REAL $1 SENT!<br>Tx: ${signature}<br><a href="https://solscan.io/tx/${signature}" target="_blank" style="color:#00ff88">View on Solscan</a>`;
    btn.innerText='✅ SENT - Check Solscan';
  }catch(e){ btn.innerText='SEND FAILED'; alert(e.message); }
}

window.addEventListener('load', runIntegrity);
</script>
</body></html>
