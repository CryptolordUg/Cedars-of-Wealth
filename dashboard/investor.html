<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investor — Cedars</title>
<style>:root{--bg:#0b1020;--card:#162040;--br:#1e2d55;--m:#8a9cc7;--g:#00e676;--b:#2a5bd7}*{box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#eef2ff;margin:0}.card{background:var(--card);border:1px solid #2a3a6a;border-radius:14px;padding:16px;margin:10px}.btn{width:100%;padding:11px;border-radius:10px;border:none;font-weight:800;min-height:44px;cursor:pointer}.btn-w{background:#fff;color:#000}.btn-b{background:var(--b);color:#fff}.small{font-size:11px;color:var(--m)}#toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:#0b1020;border:1px solid var(--g);padding:10px 16px;border-radius:20px;z-index:9999;display:none;font-size:12px;font-weight:700}</style></head><body>
<div id="toast"></div>
<div class="card"><div class="small">Portfolio</div><div style="font-size:28px;font-weight:900" id="bal">$0.00</div><div class="small">ROI 94.7% WIN — No Trading Area</div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-w" onclick="popup('✅ Deposit Active','../deposit.html')">Deposit</button><button class="btn btn-b" onclick="popup('✅ Withdraw Active','../withdraw.html')">Withdraw</button></div><div class="small" style="margin-top:8px">Payout timer: <span id="timer">23:41:12</span> — Package: <span id="pkg">$100-$10k</span></div></div>
<div class="card"><div style="font-weight:800">Packages $100-$10k</div><div class="small">ROI Tracker $500 → $124.5k</div><div id="roi" class="small" style="margin-top:8px"></div></div>
<div class="card"><div style="font-weight:800">Referral</div><div class="small" id="ref"></div><div id="hist" style="margin-top:8px;font-size:11px"></div></div>
<script src="../fix.js"></script>
<script>
function popup(m,go){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200);if(go)setTimeout(()=>location.href=go,700);}
function load(){document.getElementById('bal').innerText='$'+(typeof CedarsBalance==='function'?CedarsBalance():'0.00');document.getElementById('ref').innerText=location.origin+'/Cedars-of-Wealth/register.html?ref='+(localStorage.getItem('cedars_ref')||'');let tx=JSON.parse(localStorage.getItem('cedars_tx')||'[]');document.getElementById('hist').innerHTML=tx.slice(-5).map(t=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1e2d55"><span>${t.type} $${t.amt}</span><span>${t.hash.substr(0,8)}...</span></div>`).join('');let roi=500;document.getElementById('roi').innerText='Start $500 → Now $'+(roi*1.947).toFixed(2)+' → Target $124.5k — 94.7% WIN';let h=23,m=41,s=12;setInterval(()=>{s--;if(s<0){s=59;m--} if(m<0){m=59;h--} document.getElementById('timer').innerText=(h+'').padStart(2,'0')+':'+(m+'').padStart(2,'0')+':'+(s+'').padStart(2,'0');},1000);}
load();
</script><script src="../header-footer.js"></script><script src="../support-widget.js"></script>
</body></html>
