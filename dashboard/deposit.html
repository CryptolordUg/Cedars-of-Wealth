<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deposit</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet"><style>:root{--b:#102A43;--g:#FFD700}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#F8F9FA;padding-top:68px}.top{position:fixed;top:0;left:0;right:0;background:#102A43;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:9999;border-bottom:2px solid #FFD700}.logo{font-size:28px;font-weight:900;color:#fff;text-shadow:0 0 10px #FFD700}.logo span{color:#FFD700}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,215,0,.3)}.nav a.active{background:#FFD700;color:#102A43}.wrap{max-width:900px;margin:0 auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin-top:14px}.drop{border:1px solid #ddd;border-radius:10px;overflow:hidden}.drop-head{padding:14px;background:#102A43;color:#fff;font-weight:700;cursor:pointer;display:flex;justify-content:space-between}.drop-body{display:none;padding:16px;text-align:center}.drop-body.open{display:block}.qr{width:180px;height:180px;margin:10px auto;display:block;border:6px solid #FFD700;border-radius:12px}.addr{font-size:11px;word-break:break-all;background:#102A43;color:#FFD700;padding:10px;border-radius:8px;margin:10px 0;font-weight:700}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;margin:8px 0}.btn{width:100%;padding:14px;background:#102A43;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer}.btn-g{background:#FFD700;color:#102A43}table{width:100%;border-collapse:collapse;margin-top:12px}th{padding:8px;text-align:left;font-size:11px;color:#666;border-bottom:2px solid #ddd}td{padding:8px;border-bottom:1px solid #eee;font-size:13px}footer{text-align:center;padding:16px;font-size:10px;color:#666}@media(max-width:700px){.top{flex-direction:column;gap:6px}body{padding-top:100px}}</style></head><body><div class="top"><div class="logo">🌲 CEDARS <span>OF WEALTH</span></div><div class="nav"><a href="../index.html">Home</a><a href="balance.html">Balance</a><a href="deposit.html" class="active">Deposit</a><a href="withdraw.html">Withdraw</a><a href="referral.html">Referral</a><a href="#" onclick="localStorage.clear();location.href='../login.html'" style="background:#8b0000">Sign Out</a></div></div><div class="wrap"><div class="card"><h3>Deposit</h3><div class="drop"><div class="drop-head" onclick="this.nextElementSibling.classList.toggle('open')"><span>Show Address & QR</span><span>▼</span></div><div class="drop-body" id="drop"><img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=TE26B7zQjMbahYAWcxEsSPC6aZEr2Hcz1u"><div class="addr">TE26B7zQjMbahYAWcxEsSPC6aZEr2Hcz1u</div><button class="btn btn-g" onclick="navigator.clipboard.writeText('TE26B7zQjMbahYAWcxEsSPC6aZEr2Hcz1u');this.innerText='Copied'">Copy</button></div></div><input id="amt" type="number" placeholder="Amount"><input id="tx" placeholder="TX Hash"><button class="btn" onclick="submitDep()">Submit</button><div id="msg" style="font-size:12px;margin-top:6px"></div></div><div class="card"><h3>History</h3><table><thead><tr><th>Amount</th><th>Date</th><th>Status</th></tr></thead><tbody id="hist"></tbody></table></div></div><footer>© CEDARS OF WEALTH</footer><script>const ADDR="TE26B7zQjMbahYAWcxEsSPC6aZEr2Hcz1u";async function submitDep(){let a=parseFloat(document.getElementById('amt').value),tx=document.getElementById('tx').value.trim();if(!a||a<20){alert('Min 20');return}if(tx.length<10){alert('TX');return}document.getElementById('msg').innerText='Verifying...';try{let r=await fetch('https://apilist.tronscan.org/api/transaction-info?hash='+tx);let d=await r.json();let deps=JSON.parse(localStorage.getItem('cedar_deposits')||'[]');if(d && d.tokenTransferInfo && d.tokenTransferInfo.to_address===ADDR){deps.push({amount:a,tx:tx,status:'approved',date:new Date().toLocaleDateString()});localStorage.setItem('cedar_deposits',JSON.stringify(deps));if(!localStorage.getItem('cedar_contract_start'))localStorage.setItem('cedar_contract_start',Date.now());document.getElementById('msg').innerText='Verified';}else{deps.push({amount:a,tx:tx,status:'pending',date:new Date().toLocaleDateString()});localStorage.setItem('cedar_deposits',JSON.stringify(deps));document.getElementById('msg').innerText='Pending';}}catch(e){let deps=JSON.parse(localStorage.getItem('cedar_deposits')||'[]');deps.push({amount:a,tx:tx,status:'pending',date:new Date().toLocaleDateString()});localStorage.setItem('cedar_deposits',JSON.stringify(deps));document.getElementById('msg').innerText='Pending';}loadHist()}function loadHist(){let d=JSON.parse(localStorage.getItem('cedar_deposits')||'[]');let h=document.getElementById('hist');h.innerHTML='';if(d.length===0){h.innerHTML='<tr><td colspan="3">No records</td></tr>';return}d.slice().reverse().forEach(x=>{h.innerHTML+=`<tr><td>$${parseFloat(x.amount).toFixed(2)}</td><td>${x.date}</td><td>${x.status}</td></tr>`})}loadHist();</script></body></html>
