<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - Cedars</title>
<style>:root{--bg:#0b1020;--card:#162040;--br:#1e2d55;--m:#8a9cc7}*{box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#eef2ff;margin:0}.nav{padding:12px 16px;border-bottom:1px solid var(--br);display:flex;justify-content:space-between}.card{max-width:400px;margin:30px auto;background:var(--card);border:1px solid #2a3a6a;border-radius:14px;padding:16px}.input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--br);background:#0b1020;color:#fff;margin:6px 0}.btn{width:100%;padding:12px;border-radius:8px;border:none;font-weight:800;min-height:44px;cursor:pointer;background:#fff;color:#000;margin-top:8px}.small{font-size:11px;color:var(--m)}</style></head><body>
<div class="nav"><b>🌲 Cedars of Wealth</b><a href="index.html" style="color:var(--m);text-decoration:none;font-size:12px">Home</a></div>
<div class="card"><h3>Register — USD Only</h3>
<input id="name" class="input" placeholder="Full Name">
<input id="email" class="input" placeholder="Email">
<input id="wallet" class="input" placeholder="Solana Wallet (Optional)">
<input id="pass" class="input" type="password" placeholder="Password">
<button class="btn" onclick="doReg()">Create Account — $ USD</button>
<p class="small" style="margin-top:8px">Wallet connect optional — All balances in USD — Data saved locally — No system jump — 360° smooth.</p>
<div id="out" style="margin-top:10px;font-size:12px"></div>
</div>
<script>
function doReg(){
 let n=document.getElementById('name').value, e=document.getElementById('email').value, w=document.getElementById('wallet').value;
 if(!n||!e){alert('Name + Email required');return;}
 localStorage.setItem('cedars_investor_name',n); localStorage.setItem('cedars_investor_email',e); localStorage.setItem('cedars_wallet',w);
 if(!localStorage.getItem('cedars_ref')){localStorage.setItem('cedars_ref','CRD-'+Math.random().toString(36).substr(2,6).toUpperCase());}
 document.getElementById('out').innerHTML='✅ Registered as <b>'+n+'</b> — USD Dashboard ready — <a href="investor-dashboard.html" style="color:#00e676">Go to Investor Dashboard</a>';
 let rp=new URLSearchParams(location.search).get('ref'); if(rp){localStorage.setItem('cedars_referred_by',rp);}
}
</script></body></html>
