<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#F8F9FA;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:28px;width:100%;max-width:400px}.logo{text-align:center;font-size:28px;font-weight:900;color:#102A43;margin-bottom:16px}.logo span{color:#FFD700}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;margin:8px 0}.btn{width:100%;padding:14px;background:#102A43;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px}a{color:#102A43;font-size:13px;text-decoration:none;font-weight:600}</style></head><body><div class="card"><div class="logo">🌲 CEDARS <span>OF WEALTH</span></div><h3 style="text-align:center;margin-bottom:12px">Register</h3><input id="u" placeholder="Username"><input id="e" placeholder="Email"><input id="p" type="password" placeholder="Password"><input id="ref" placeholder="Referral code (optional)"><button class="btn" onclick="reg()">Create Account</button><p style="text-align:center;margin-top:12px"><a href="login.html">Already have account? Sign In</a></p><div id="msg" style="font-size:12px;margin-top:8px;text-align:center"></div></div><script>function getRef(){let params=new URLSearchParams(window.location.search);return params.get('ref')||''}document.getElementById('ref').value=getRef();function reg(){let u=document.getElementById('u').value.trim(),e=document.getElementById('e').value.trim(),p=document.getElementById('p').value,ref=document.getElementById('ref').value.trim();if(!u||!e||!p){document.getElementById('msg').innerText='Fill all';return}let secret='CW-'+u.toUpperCase()+'-'+Math.random().toString(36).substring(2,6).toUpperCase();let user={u:u,e:e,code:secret,refBy:ref||'Guest',created:Date.now()};localStorage.setItem('cedar_user',JSON.stringify(user));let users=JSON.parse(localStorage.getItem('cedar_all_users')||'[]');users.push(user);localStorage.setItem('cedar_all_users',JSON.stringify(users));if(ref){let refs=JSON.parse(localStorage.getItem('cedar_refs')||'[]');refs.push({from:ref,to:u,date:new Date().toLocaleDateString()});localStorage.setItem('cedar_refs',JSON.stringify(refs))}location.href='dashboard/balance.html';}</script></body></html>
