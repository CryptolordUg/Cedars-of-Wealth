<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#F8F9FA;padding-top:68px}.top{position:fixed;top:0;left:0;right:0;background:#102A43;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:9999;border-bottom:2px solid #FFD700}.logo{font-size:28px;font-weight:900;color:#fff;text-shadow:0 0 10px #FFD700}.logo span{color:#FFD700}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,215,0,.3)}.nav a.active{background:#FFD700;color:#102A43}.wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 68px);padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:28px;width:100%;max-width:420px}.ip{font-size:11px;background:#102A43;color:#FFD700;padding:8px 12px;border-radius:8px;margin-bottom:12px;text-align:center}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;margin:8px 0}.row{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:12px}.row input{width:18px;height:18px;margin:0}.btn{width:100%;padding:14px;background:#102A43;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px}.btn-g{background:#FFD700;color:#102A43}a{color:#102A43;font-size:13px;text-decoration:none;font-weight:600}footer{text-align:center;padding:16px;font-size:10px;color:#666}@media(max-width:700px){.top{flex-direction:column;gap:6px}body{padding-top:100px}}</style></head><body><div class="top"><div class="logo">🌲 CEDARS <span>OF WEALTH</span></div><div class="nav"><a href="index.html">Home</a><a href="register.html" class="active">Register</a><a href="dashboard/deposit.html">Deposit</a><a href="dashboard/withdraw.html">Withdraw</a><a href="dashboard/referral.html">Referral</a><a href="dashboard/balance.html">Balance</a><a href="login.html">Sign In</a></div></div><div class="wrap"><div class="card"><div style="text-align:center;font-size:22px;font-weight:900;margin-bottom:12px">🌲 CEDARS <span style="color:#FFD700">OF WEALTH</span></div><div class="ip" id="ip">Detecting location...</div><input id="u" placeholder="Username"><input id="e" placeholder="Email"><input id="p" type="password" placeholder="Password"><input id="ref" placeholder="Referral code (optional)"><div class="row"><input type="checkbox" id="rem"><label for="rem">Remember login</label></div><button class="btn" onclick="reg()">Create Account</button><p style="text-align:center;margin-top:12px"><a href="login.html">Already have account? Sign In</a></p><div id="msg" style="font-size:12px;margin-top:8px;text-align:center"></div></div></div><footer>© CEDARS OF WEALTH</footer><script>let ipData={ip:'-',city:'-',country:'-'};async function detect(){try{let r=await fetch('https://ipapi.co/json/');let d=await r.json();ipData={ip:d.ip,city:d.city,country:d.country_name,loc:d.city+', '+d.country_name};document.getElementById('ip').innerText='IP: '+d.ip+' | '+d.city+', '+d.country_name;}catch(e){try{let r2=await fetch('https://ipinfo.io/json');let d2=await r2.json();ipData={ip:d2.ip,city:d2.city,country:d2.country,loc:d2.city+', '+d2.country};document.getElementById('ip').innerText='IP: '+d2.ip+' | '+d2.city+', '+d2.country;}catch{ document.getElementById('ip').innerText='Location: Secure Connection'; ipData={ip:'hidden',city:'hidden',country:'hidden',loc:'hidden'}}}}detect();function getRef(){let params=new URLSearchParams(window.location.search);return params.get('ref')||''}document.getElementById('ref').value=getRef();function reg(){let u=document.getElementById('u').value.trim(),e=document.getElementById('e').value.trim(),p=document.getElementById('p').value,ref=document.getElementById('ref').value.trim(),rem=document.getElementById('rem').checked;if(!u||!e||!p){document.getElementById('msg').innerText='Fill all';return}let secret='CW-'+u.toUpperCase()+'-'+Math.random().toString(36).substring(2,6).toUpperCase();let user={u:u,e:e,code:secret,refBy:ref||'Guest',ip:ipData.ip,location:ipData.loc||ipData.city,created:Date.now()};localStorage.setItem('cedar_user',JSON.stringify(user));let users=JSON.parse(localStorage.getItem('cedar_all_users')||'[]');users.push(user);localStorage.setItem('cedar_all_users',JSON.stringify(users));if(rem){localStorage.setItem('cedar_remember',JSON.stringify({u:u,p:p}))}else{localStorage.removeItem('cedar_remember')}if(ref){let refs=JSON.parse(localStorage.getItem('cedar_refs')||'[]');refs.push({from:ref,to:u,ip:ipData.ip,loc:ipData.loc,date:new Date().toLocaleDateString()});localStorage.setItem('cedar_refs',JSON.stringify(refs))}location.href='dashboard/balance.html';}</script></body></html>
