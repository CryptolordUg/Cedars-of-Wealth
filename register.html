<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register KYC - Cedars V42</title>
<style>:root{--bg:#0b1020;--card:#162040;--br:#1e2d55;--m:#8a9cc7;--g:#00e676}*{box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#eef2ff;margin:0}.card{max-width:420px;margin:20px auto;background:var(--card);border:1px solid #2a3a6a;border-radius:14px;padding:18px}.input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--br);background:#0b1020;color:#fff;margin:7px 0}.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:800;background:#fff;color:#000;min-height:44px;cursor:pointer}.small{font-size:11px;color:var(--m)}</style></head><body>
<div class="card"><h3>Register — Email + Wallet + KYC — USD Only $</h3>
<input id="name" class="input" placeholder="Full Name (KYC)"><input id="email" class="input" placeholder="Email"><input id="wallet" class="input" placeholder="Solana Wallet (USDC)"><input id="idnum" class="input" placeholder="ID / Passport No. (KYC)"><input id="pass" class="input" type="password" placeholder="Password">
<button class="btn" onclick="CedarsRegister(document.getElementById('name').value,document.getElementById('email').value,document.getElementById('wallet').value); localStorage.setItem('cedars_kyc',document.getElementById('idnum').value); alert('Registered $ USD — '+document.getElementById('name').value); location.href='investor-dashboard.html'">Create Account — $ USD</button>
<p class="small">KYC saved local — All USD only — Investor owned 100% — Logo click → Home</p><div id="out" style="margin-top:10px;font-size:12px;color:#00e676"></div></div>
<script src="fix.js"></script><script src="header-footer.js"></script><script src="support-widget.js"></script><script src="integrity-check.js"></script>
</body></html>
