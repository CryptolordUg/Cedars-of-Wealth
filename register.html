<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - Cedars</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--b:#102A43;--g:#a8c686;--bg:#fff;--t:#1A1A1A;--bd:#DADADA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,Arial,sans-serif;font-size:18px;line-height:1.7;color:var(--t);background:#F8F9FA;padding-top:72px} .top{position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--b);border-bottom:2px solid var(--g);padding:12px 20px;display:flex;justify-content:space-between;align-items:center} .logo{font-size:20px;font-weight:700;color:#fff} .logo span{color:var(--g)} .nav{display:flex;gap:8px;flex-wrap:wrap} .nav a{font-size:16px;font-weight:600;color:#fff;text-decoration:none;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)} .nav a.active{background:var(--g);color:var(--b)} .wrap{display:flex;justify-content:center;align-items:center;min-height:85vh;padding:24px} .card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:32px;width:100%;max-width:440px;box-shadow:0 10px 40px rgba(0,0,0,.08)} h2{font-size:36px;font-weight:700;margin-bottom:8px} p{color:#444;margin-bottom:20px} input{width:100%;font-size:16px;padding:14px;border:1px solid var(--bd);border-radius:8px;margin:8px 0;box-sizing:border-box} input:focus{outline:3px solid #4D90FE;outline-offset:2px} .btn{width:100%;padding:14px;font-size:18px;font-weight:600;border-radius:8px;border:0;background:#0B6E4F;color:#fff;cursor:pointer;margin-top:12px} .btn:hover{background:#095a40} *:focus{outline:3px solid #4D90FE;outline-offset:2px} @media(max-width:768px){body{padding-top:120px}.top{flex-direction:column;gap:10px}.nav a{font-size:14px;padding:8px 10px}h2{font-size:28px}}</style></head><body>
<div class="top"><div class="logo">🌲 CEDARS <span>OF WEALTH</span></div><div class="nav"><a href="index.html">🏠 Home</a><a href="dashboard/balance.html">💰 Balance</a><a href="dashboard/deposit.html">📥 Deposit</a><a href="dashboard/withdraw.html">📤 Withdraw</a><a href="dashboard/referral.html">👥 Referral</a><a href="login.html">🔐 Login</a><a href="register.html" class="active">✨ Register</a></div></div>
<div class="wrap"><div class="card"><h2>Create Account</h2><p>Clean & secure. No extra info.</p><input id="u" placeholder="Username"><input id="e" placeholder="Email"><input id="p" type="password" placeholder="Password"><button class="btn" onclick="reg()">Register</button><p style="text-align:center;margin-top:16px;font-size:16px">Already have account? <a href="login.html" style="color:#0057B8;font-weight:600">Login</a></p></div></div>
<script>function reg(){let u=document.getElementById('u').value,e=document.getElementById('e').value,p=document.getElementById('p').value;if(!u||!e||!p)return alert('Fill all');localStorage.setItem('cedar_user',JSON.stringify({u,e,p,bal:100}));localStorage.setItem('cedar_login','1');location.href='dashboard/balance.html'}</script></body></html>
