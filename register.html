<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - Cedars</title><style>body{margin:0;background:#050805;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Arial} .box{background:#0c140c;border:1px solid #2a4a2a;padding:24px;border-radius:12px;width:90%;max-width:360px} input{width:100%;padding:10px;margin:6px 0;background:#060a06;border:1px solid #2a4a2a;color:#fff;border-radius:6px} .btn{width:100%;padding:10px;background:#8faf68;border:0;border-radius:8px;font-weight:800;margin-top:10px}</style></head><body>
<div class="box"><div style="color:#c7b07a;font-weight:900;text-align:center">🌲 CEDARS REGISTER</div><input id="u" placeholder="Username"><input id="e" placeholder="Email"><input id="p" type="password" placeholder="Password"><input id="r" placeholder="Referral Code (Optional)"><button class="btn" onclick="reg()">CREATE ACCOUNT</button><div style="font-size:10px;text-align:center;margin-top:10px"><a href="login.html" style="color:#8faf68">Already have? Login</a></div></div>
<script>function reg(){if(!u.value||!e.value||!p.value)return alert('Fill all');localStorage.setItem('cedar_user',JSON.stringify({u:u.value,e:e.value,p:p.value,bal:100,earn:1.5}));localStorage.setItem('cedar_login','1');location.href='dashboard/balance.html'}</script></body></html>
