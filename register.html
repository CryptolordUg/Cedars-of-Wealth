<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - Cedars of Wealth - USD Only</title>
<style>:root{--bg:#0b1020;--card:#162040;--br:#1e2d55;--m:#8a9cc7;--g:#00e676}*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}body{background:var(--bg);color:#eef2ff;min-height:100vh}.nav{padding:12px 16px;border-bottom:1px solid var(--br);display:flex;justify-content:space-between;align-items:center;background:#0b1020}.nav a{color:var(--m);text-decoration:none;font-size:12px}.card{max-width:400px;margin:30px auto;background:var(--card);border:1px solid #2a3a6a;border-radius:14px;padding:18px}.input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--br);background:#0b1020;color:#fff;margin:7px 0;outline:none}.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:800;min-height:44px;cursor:pointer;background:#fff;color:#000;margin-top:10px;font-size:14px}.small{font-size:11px;color:var(--m);margin-top:8px;line-height:1.4}</style></head><body>
<div class="nav"><b>🌲 Cedars of Wealth</b><a href="index.html">Home</a></div>
<div class="card">
<h3>Register — USD Only — $</h3>
<input id="name" class="input" placeholder="Full Name">
<input id="email" class="input" placeholder="Email">
<input id="wallet" class="input" placeholder="Solana Wallet (Optional)">
<input id="pass" class="input" type="password" placeholder="Password">
<button class="btn" onclick="CedarsRegister(document.getElementById('name').value,document.getElementById('email').value,document.getElementById('wallet').value); alert('Registered $ USD — '+document.getElementById('name').value); location.href='investor-dashboard.html'">Create Account — $ USD</button>
<p class="small">All balances in $ USD only — Wallet optional — Saves to localStorage — No system jump — 360° smooth — Works with investor-dashboard balance.</p>
<div id="out" style="margin-top:10px;font-size:12px;color:#00e676"></div>
<div style="margin-top:12px"><a href="login.html" style="color:#8a9cc7;font-size:12px">Already have account? Sign In</a> | <a href="investor-dashboard.html" style="color:#00e676;font-size:12px">Go to Dashboard</a></div>
</div>
<script src="fix.js"></script>
<script>
function CedarsRegister(n,e,w){
 if(!n||!e){alert('Name + Email required');return false;}
 localStorage.setItem('cedars_investor_name',n);
 localStorage.setItem('cedars_investor_email',e);
 if(w) localStorage.setItem('cedars_wallet',w);
 if(!localStorage.getItem('cedars_ref')){localStorage.setItem('cedars_ref','CRD-'+Math.random().toString(36).substr(2,6).toUpperCase());}
 localStorage.setItem('cedars_logged_in','true');
 localStorage.setItem('cedars_usd_bal',localStorage.getItem('cedars_usd_bal')||'0');
 localStorage.setItem('cedars_tx',localStorage.getItem('cedars_tx')||'[]');
 document.getElementById('out').innerHTML='✅ Registered: '+n+' — $ USD Ready';
 return true;
}
</script>
<script src="support-widget.js"></script>
</body></html>
