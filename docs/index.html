<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cedars of Wealth</title>
<style>body{background:#0a0f1e;color:#fff;font-family:system-ui;padding:20px}.card{background:#111a2e;padding:15px;border-radius:12px;margin:10px 0}</style>
</head><body>
<h2>🌲 Cedars of Wealth</h2>
<div class="card">Portfolio: $9,343.89 <span style="color:#4ade80">+$931.29 (10.91%)</span></div>
<div class="card"><b>Market - LIVE</b><div id="m">Loading...</div></div>
<div class="card"><input type="file" id="f" accept=".json"><small> Upload MY_722_BACKUP_25Sep.json later to auto-update balance</small></div>
<script>
async function load(){
 try{
  const r=await fetch('https://open.er-api.com/v6/latest/USD');
  const j=await r.json();
  const eur=(1/j.rates.EUR).toFixed(4);
  const gbp=(1/j.rates.GBP).toFixed(4);
  const jpy=j.rates.JPY.toFixed(2);
  document.getElementById('m').innerHTML=`EUR/USD ${eur}<br>GBP/USD ${gbp}<br>USD/JPY ${jpy}<br><small>Live via open.er-api.com</small>`;
 }catch(e){document.getElementById('m').innerText='Market offline - showing last: EUR/USD 1.1403';}
}
load(); setInterval(load,60000);
document.getElementById('f').addEventListener('change',e=>{
 const fr=new FileReader();
 fr.onload=()=>{try{const d=JSON.parse(fr.result); alert('Backup loaded! Found keys: '+Object.keys(d).slice(0,5).join(','));}catch(err){alert('Invalid JSON')}};
 fr.readAsText(e.target.files[0]);
});
</script></body></html>
