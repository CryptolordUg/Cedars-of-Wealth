<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cedars of Wealth</title>
<style>body{background:#0a0f1e;color:#fff;font-family:system-ui;padding:20px}.card{background:#111a2e;padding:15px;border-radius:12px;margin:10px 0}</style>
</head><body>
<h2>🌲 Cedars of Wealth</h2>
<div class="card" id="p">Portfolio: loading...</div>
<div class="card"><b>Market - LIVE</b><div id="m">Loading...</div></div>
<div class="card"><input type="file" id="f" accept=".json"><small> Upload backup</small><div id="log" style="margin-top:8px;font-size:12px;opacity:.9;word-break:break-all"></div></div>
<script>
const IDS={XMR:'monero',VRSC:'verus-coin',DUCO:'duinocoin',NIM:'nimiq-2',BAN:'banano',RVN:'ravencoin',ERG:'ergo',KAS:'kaspa',SOL:'solana'};
let prices={};
async function loadPrices(){
 try{
  const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+Object.values(IDS).join(',')+'&vs_currencies=usd');
  prices=await r.json();
 }catch(e){}
}
async function loadFX(){
 try{
  const r=await fetch('https://open.er-api.com/v6/latest/USD'); const j=await r.json();
  document.getElementById('m').innerHTML=`EUR/USD ${(1/j.rates.EUR).toFixed(4)}<br>GBP/USD ${(1/j.rates.GBP).toFixed(4)}<br>USD/JPY ${j.rates.JPY.toFixed(2)}`;
 }catch(e){document.getElementById('m').innerText='FX offline';}
}
loadPrices(); loadFX();
document.getElementById('f').addEventListener('change',e=>{
 const fr=new FileReader();
 fr.onload=async()=>{
  await loadPrices();
  const d=JSON.parse(fr.result);
  let balances=d.cedars_coinBalances;
  if(typeof balances==='string') balances=JSON.parse(balances);
  let total=0; let rows=[];
  for(let sym in balances){
   let amt=parseFloat(balances[sym]); if(isNaN(amt)) continue;
   let id=IDS[sym]; let p=prices[id]?.usd||0;
   let val=amt*p; total+=val;
   rows.push(`${sym}: ${amt} x $${p} = $${val.toFixed(2)}`);
  }
  document.getElementById('p').innerHTML=`Portfolio: $${total.toLocaleString('en-US',{minimumFractionDigits:2})} <span style="color:#4ade80">live priced (${rows.length} assets)</span>`;
  document.getElementById('log').innerHTML=rows.join('<br>');
 };
 fr.readAsText(e.target.files[0]);
});
</script></body></html>
