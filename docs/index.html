<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cedars of Wealth</title>
<style>body{background:#0a0f1e;color:#fff;font-family:system-ui;padding:20px}.card{background:#111a2e;padding:15px;border-radius:12px;margin:10px 0}</style>
</head><body>
<h2>🌲 Cedars of Wealth</h2>
<div class="card" id="p">Portfolio: $9,343.89 <span style="color:#4ade80">+$931.29 (10.91%)</span></div>
<div class="card"><b>Market - LIVE</b><div id="m">Loading...</div></div>
<div class="card"><input type="file" id="f" accept=".json"><small> Upload backup to auto-update</small><div id="log" style="margin-top:8px;font-size:12px;opacity:.9;word-break:break-all"></div></div>
<script>
async function load(){
 try{
  const r=await fetch('https://open.er-api.com/v6/latest/USD');
  const j=await r.json();
  document.getElementById('m').innerHTML=`EUR/USD ${(1/j.rates.EUR).toFixed(4)}<br>GBP/USD ${(1/j.rates.GBP).toFixed(4)}<br>USD/JPY ${j.rates.JPY.toFixed(2)}<br><small>Live via open.er-api.com</small>`;
 }catch(e){document.getElementById('m').innerText='Market offline';}
}
load(); setInterval(load,60000);
document.getElementById('f').addEventListener('change',e=>{
 const fr=new FileReader();
 fr.onload=()=>{
  try{
   const d=JSON.parse(fr.result);
   let out='Keys: '+Object.keys(d).slice(0,5).join(', ')+'<br>';
   let balances = d.cedars_coinBalances;
   if(typeof balances==='string'){ try{balances=JSON.parse(balances);}catch{} }
   out+='Balances type: '+(typeof balances)+' ';
   if(balances && typeof balances==='object'){
     out+='Coins: '+Object.keys(balances).slice(0,10).join(', ')+'<br>';
     let total=0; let details=[];
     for(let k in balances){
       let v=balances[k];
       let num=parseFloat(v);
       if(!isNaN(num)){ details.push(k+': '+num); total+=num; }
     }
     out+='Found: '+details.slice(0,10).join(' | ')+'<br>';
     document.getElementById('p').innerHTML=`Portfolio: $${total.toLocaleString('en-US',{minimumFractionDigits:2})} <span style="color:#4ade80">from backup (${Object.keys(balances).length} assets)</span>`;
   }
   let trades=d.cedars_trades;
   if(trades) out+='Trades found: '+(Array.isArray(trades)?trades.length:typeof trades);
   document.getElementById('log').innerHTML=out;
  }catch(err){document.getElementById('log').innerText='Invalid JSON: '+err.message}
 };
 fr.readAsText(e.target.files[0]);
});
</script></body></html>
