<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cedars of Wealth</title>
<style>body{background:#0a0f1e;color:#fff;font-family:system-ui;padding:20px}.card{background:#111a2e;padding:15px;border-radius:12px;margin:10px 0}</style>
</head><body>
<h2>🌲 Cedars of Wealth</h2>
<div class="card" id="p">Portfolio: $9,343.89 <span style="color:#4ade80">+$931.29 (10.91%)</span></div>
<div class="card"><b>Market - LIVE</b><div id="m">Loading...</div></div>
<div class="card"><input type="file" id="f" accept=".json"><small> Upload MY_722_BACKUP_25Sep.json to auto-update</small><div id="log" style="margin-top:8px;font-size:13px;opacity:.8"></div></div>
<script>
async function load(){
 try{
  const r=await fetch('https://open.er-api.com/v6/latest/USD');
  const j=await r.json();
  document.getElementById('m').innerHTML=`EUR/USD ${(1/j.rates.EUR).toFixed(4)}<br>GBP/USD ${(1/j.rates.GBP).toFixed(4)}<br>USD/JPY ${j.rates.JPY.toFixed(2)}<br><small>Live via open.er-api.com</small>`;
 }catch(e){document.getElementById('m').innerText='Market offline';}
}
load(); setInterval(load,60000);
document.getElementById('f').addEventListener('change',e=>{
 const fr=new FileReader();
 fr.onload=()=>{
  try{
   const d=JSON.parse(fr.result);
   const keys=Object.keys(d);
   // try common balance fields
   let bal = d.balance || d.equity || d.portfolio_value || d.total || d.Portfolio || null;
   // if nested, search first numeric large value
   if(!bal){
     for(let k of keys){ if(typeof d[k]==='number' && d[k]>1000){ bal=d[k]; break; } }
   }
   document.getElementById('log').innerText='Found keys: '+keys.slice(0,8).join(', ');
   if(bal){
     document.getElementById('p').innerHTML=`Portfolio: $${Number(bal).toLocaleString('en-US',{minimumFractionDigits:2})} <span style="color:#4ade80">updated from backup</span>`;
   } else {
     document.getElementById('log').innerText+=' | No balance field auto-found';
   }
  }catch(err){alert('Invalid JSON')}
 };
 fr.readAsText(e.target.files[0]);
});
</script></body></html>
